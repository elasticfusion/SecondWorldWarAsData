Rules_Data_Definitions:
	Completeness:
		- Include all paragraphs in analysis.  It's OK to group multiple paragraphs together as a single sub-event.
	Source: chapter1a-content.md
	Event: Corresponds to the Chapter Name
	Sub-event: The LLM should group paragraphs into logical subsections based upon The content in the "Source":
	  - Logical Combinations of Places, Dates, Countries, Military Units named in the Source
	  - Individuals, especially those who win specific military awards including, but limited to:
		- Medal of Honor
	  	- Distinguished Service Medal
	    - Iron Cross
	    - Victoria Cross
	Sub-event_Fulltext:
		- capture the original text used for the sub-event analysis.
		- A sub-event is classified as an event that occurs at roughly the same Place/Date and should be treated a unique entry with the same event.
		  - It's very important to be able to be able to track the the source of the material
		  - IMPORTANT: Sub-event_fulltext.Paragraph_[nn] (for example, it should document the absolute paragraph for all paragraphs in the entire $SourceLink and include all text used in analysis.
			  - In the Sub-event_fulltext.Paragraph_[nn], the brakets are for documentation purposes only and should not be included in the data
			  - Each paragraph should have it's own unique paragraph number.
	Sub-Event-Images: Do not search the web, extract the URL and if it exists, and image description.
	Sub-Event-Maps: Do not search the web, extract the URL and if it exists, an Map description.
	Sub-Event-Dates: Capture the time/date or time/date rage as presented in the text. 
		- Occasionally an approximate time will be mentioned, include it with the date.
		- Occasionally an exact time will be mentioned, include it with the date.
	Sub-Event-Places: See the JSON structure below, places are to be aligned with the sub-event.
	Endnotes: Capture the number as presented in the text.
	Footnote: Capture the footnote, including the symbol in the text document the footnote reference

Data_Structure_Notes:
	- Brackets [] exist for illustrative purposes only
	- Footnotes and Endnotes are separate entities:
		  - Review:
		  	- Chicago Style Guide, for 17th Edition - Footnotes appear the bottom of a page whereas endnotes will appear at the end of the article, chapter, or back of the book. Footnotes are more common in scholarly works due to their ease of access for quick reference. The limiting factor for footnotes is the amount of physical space they occupy on each page (additionally footnotes must be located on the same page as their reference point).  Endnotes avoid the shortcoming of footnotes but are not as quickly accessible. In texts with large numbers of citations, finding a particular note can be burdensome for some. Hyperlinking of note numbers in electronic resources has helped to alleviate this issue.
			- The source refers to the text as "footnotes"  they are in fact "endnotes".
		    - In the JSON, only reference the endnote number, do not analyze the endnote text.
JSON:
	- structure should be adhered to exactly.  No additional items should be added
	- All JSON should be displayed in a Markdown text box.

Event_Data_JSON_Structure:

Create Events:
  - Chapter:
  - Event:
    Sub-event:
	  - Sub-event_summary:
      - Sub-event_fulltext:
		- Paragraph_19
		- Paragraph_20
		- Paragraph_nn
  	  - Sub-Event-Images: [Image URL, Image Description]
	  - Sub-Events-Maps: [MAP URL, Map Description]
  	  - Sub-Event-Dates:
	    - Date(s)_of_event
	  - Sub-Event-Places:
		- Places mentioned
	  - Endnote_References: [4, 5]
	  - Footnote_References: [*, †]

