AWSTemplateFormatVersion: '2010-09-09'
Description: WWII Data Extraction Pipeline - Root Stack

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
  TemplateBucket:
    Type: String
    Description: S3 bucket containing nested stack templates
  LambdaCodeBucket:
    Type: String
    Description: S3 bucket containing Lambda deployment package
  LambdaCodeKey:
    Type: String
    Default: lambda/code.zip
  OpenSerpImageUri:
    Type: String
    Description: ECR image URI for OpenSERP container
  PipelineImageUri:
    Type: String
    Description: ECR image URI for pipeline container
  NotificationEmail:
    Type: String
    Default: ''
    Description: Email for pipeline notifications (leave empty to skip)
  GitHubOrg:
    Type: String
    Default: ''
    Description: GitHub org/user for OIDC deploy role (leave empty to skip)
  MultiDocEnabled:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: M4 concurrency kill-switch — 'true' routes triggers to the SFN dispatcher

Resources:
  NetworkStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub https://${TemplateBucket}.s3.amazonaws.com/cloudformation/network.yaml
      Parameters:
        EnvironmentName: !Ref EnvironmentName

  StorageStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub https://${TemplateBucket}.s3.amazonaws.com/cloudformation/storage.yaml
      Parameters:
        EnvironmentName: !Ref EnvironmentName

  IAMStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub https://${TemplateBucket}.s3.amazonaws.com/cloudformation/iam.yaml
      Parameters:
        EnvironmentName: !Ref EnvironmentName
        DataBucketArn: !GetAtt StorageStack.Outputs.DataBucketArn
        CacheTableArn: !GetAtt StorageStack.Outputs.CacheTableArn
        GitHubOrg: !Ref GitHubOrg
        DeployBucketName: !Ref TemplateBucket

  ComputeStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub https://${TemplateBucket}.s3.amazonaws.com/cloudformation/compute.yaml
      Parameters:
        EnvironmentName: !Ref EnvironmentName
        MultiDocEnabled: !Ref MultiDocEnabled
        VpcId: !GetAtt NetworkStack.Outputs.VpcId
        PrivateSubnet1Id: !GetAtt NetworkStack.Outputs.PrivateSubnet1Id
        PrivateSubnet2Id: !GetAtt NetworkStack.Outputs.PrivateSubnet2Id
        PublicSubnet1Id: !GetAtt NetworkStack.Outputs.PublicSubnet1Id
        LambdaSGId: !GetAtt NetworkStack.Outputs.LambdaSGId
        OpenSerpSGId: !GetAtt NetworkStack.Outputs.OpenSerpSGId
        LambdaExecutionRoleArn: !GetAtt IAMStack.Outputs.LambdaExecutionRoleArn
        ECSTaskRoleArn: !GetAtt IAMStack.Outputs.ECSTaskRoleArn
        ECSTaskExecutionRoleArn: !GetAtt IAMStack.Outputs.ECSTaskExecutionRoleArn
        DataBucketName: !GetAtt StorageStack.Outputs.DataBucketName
        CacheTableName: !GetAtt StorageStack.Outputs.CacheTableName
        LambdaCodeBucket: !Ref LambdaCodeBucket
        LambdaCodeKey: !Ref LambdaCodeKey
        OpenSerpImageUri: !Ref OpenSerpImageUri
        PipelineImageUri: !Ref PipelineImageUri

  EventsStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub https://${TemplateBucket}.s3.amazonaws.com/cloudformation/events.yaml
      Parameters:
        EnvironmentName: !Ref EnvironmentName
        DataBucketArn: !GetAtt StorageStack.Outputs.DataBucketArn
        DataBucketName: !GetAtt StorageStack.Outputs.DataBucketName
        TriggerFunctionArn: !GetAtt ComputeStack.Outputs.TriggerFunctionArn
        OpenSerpManagerFunctionArn: !GetAtt ComputeStack.Outputs.OpenSerpManagerFunctionArn
        NotificationEmail: !Ref NotificationEmail

  # M4.3 concurrency dispatcher (SFN Map). Deployed but NOT invoked while the
  # multi_doc kill-switch is off; start at MaxConcurrency=1 before raising the
  # pool (§15/§17). Nested after ComputeStack (needs its task defs + cluster).
  DispatcherStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub https://${TemplateBucket}.s3.amazonaws.com/cloudformation/dispatcher.yaml
      Parameters:
        EnvironmentName: !Ref EnvironmentName
        ECSClusterArn: !GetAtt ComputeStack.Outputs.ECSClusterName
        Phase1TaskDefArn: !GetAtt ComputeStack.Outputs.Phase1TaskDefArn
        Phase2TaskDefArn: !GetAtt ComputeStack.Outputs.Phase2TaskDefArn
        Phase3TaskDefArn: !GetAtt ComputeStack.Outputs.Phase3TaskDefArn
        CacheTableArn: !GetAtt StorageStack.Outputs.CacheTableArn
        PrivateSubnetIds: !Sub
          - ${S1},${S2}
          - S1: !GetAtt NetworkStack.Outputs.PrivateSubnet1Id
            S2: !GetAtt NetworkStack.Outputs.PrivateSubnet2Id
        SecurityGroupId: !GetAtt NetworkStack.Outputs.LambdaSGId
        TaskRoleArn: !GetAtt IAMStack.Outputs.ECSTaskRoleArn
        ExecutionRoleArn: !GetAtt IAMStack.Outputs.ECSTaskExecutionRoleArn
        LambdaCodeBucket: !Ref LambdaCodeBucket
        LambdaCodeKey: !Ref LambdaCodeKey

Outputs:
  DataBucket:
    Value: !GetAtt StorageStack.Outputs.DataBucketName
  ECSCluster:
    Value: !GetAtt ComputeStack.Outputs.ECSClusterName
  VpcId:
    Value: !GetAtt NetworkStack.Outputs.VpcId
  DedupReviewUrl:
    Value: !GetAtt ComputeStack.Outputs.DedupApiUrl
  DispatcherStateMachineArn:
    Value: !GetAtt DispatcherStack.Outputs.DispatcherStateMachineArn
    Description: Concurrency dispatcher (invoke only when multi_doc.enabled)
