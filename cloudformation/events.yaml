AWSTemplateFormatVersion: '2010-09-09'
Description: WWII Pipeline - Events (S3 notifications, SNS topics, EventBridge rule)

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
  DataBucketArn:
    Type: String
  DataBucketName:
    Type: String
  TriggerFunctionArn:
    Type: String
  OpenSerpManagerFunctionArn:
    Type: String
  NotificationEmail:
    Type: String
    Default: ''
    Description: Email address for pipeline notifications (leave empty to skip)
  OcrMergeFunctionArn:
    Type: String
    Default: ''
    Description: ARN of the OCR->parse merge Lambda (Batch SUCCEEDED handoff)

Conditions:
  HasOcrMerge: !Not [!Equals [!Ref OcrMergeFunctionArn, '']]
  HasNotificationEmail: !Not [!Equals [!Ref NotificationEmail, '']]

Resources:
  # --- SNS Topics ---
  ContentUploadedTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub ${EnvironmentName}-wwii-content-uploaded

  ChapterParsedTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub ${EnvironmentName}-wwii-chapter-parsed

  EntityCreatedTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub ${EnvironmentName}-wwii-entity-created

  Phase2CompleteTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub ${EnvironmentName}-wwii-phase2-complete

  Phase2CompleteEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasNotificationEmail
    Properties:
      TopicArn: !Ref Phase2CompleteTopic
      Protocol: email
      Endpoint: !Ref NotificationEmail

  Phase2CompleteNatTeardownSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref Phase2CompleteTopic
      Protocol: lambda
      Endpoint: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${EnvironmentName}-wwii-nat-manager

  NatManagerSNSInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Sub ${EnvironmentName}-wwii-nat-manager
      Action: lambda:InvokeFunction
      Principal: sns.amazonaws.com
      SourceArn: !Ref Phase2CompleteTopic

  # --- SNS Topic Policies (allow S3 to publish) ---
  ContentUploadedPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref ContentUploadedTopic
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowS3Publish
            Effect: Allow
            Principal:
              Service: s3.amazonaws.com
            Action: sns:Publish
            Resource: !Ref ContentUploadedTopic
            Condition:
              ArnLike:
                aws:SourceArn: !Ref DataBucketArn

  ChapterParsedPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref ChapterParsedTopic
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowS3Publish
            Effect: Allow
            Principal:
              Service: s3.amazonaws.com
            Action: sns:Publish
            Resource: !Ref ChapterParsedTopic
            Condition:
              ArnLike:
                aws:SourceArn: !Ref DataBucketArn

  EntityCreatedPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref EntityCreatedTopic
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowS3Publish
            Effect: Allow
            Principal:
              Service: s3.amazonaws.com
            Action: sns:Publish
            Resource: !Ref EntityCreatedTopic
            Condition:
              ArnLike:
                aws:SourceArn: !Ref DataBucketArn

  # --- SQS Queues (debounce S3 events before triggering ECS) ---
  TriggerQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${EnvironmentName}-wwii-trigger-queue
      VisibilityTimeout: 300
      MessageRetentionPeriod: 1209600

  TriggerQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref TriggerQueue]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt TriggerQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn:
                  - !Ref ContentUploadedTopic
                  - !Ref ChapterParsedTopic
                  - !Ref EntityCreatedTopic

  # --- SNS → SQS Subscriptions (batched) ---
  Phase1Subscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref ContentUploadedTopic
      Protocol: sqs
      Endpoint: !GetAtt TriggerQueue.Arn

  Phase2Subscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref ChapterParsedTopic
      Protocol: sqs
      Endpoint: !GetAtt TriggerQueue.Arn

  Phase3Subscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref EntityCreatedTopic
      Protocol: sqs
      Endpoint: !GetAtt TriggerQueue.Arn

  # --- SQS → Lambda (batch window deduplicates events) ---
  TriggerEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt TriggerQueue.Arn
      FunctionName: !Ref TriggerFunctionArn
      BatchSize: 100
      MaximumBatchingWindowInSeconds: 60
      Enabled: true

  # --- Dedup Complete Topic (single event, stays direct SNS → Lambda) ---
  DedupCompleteTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub ${EnvironmentName}-wwii-dedup-complete

  DedupCompleteSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref DedupCompleteTopic
      Protocol: lambda
      Endpoint: !Ref TriggerFunctionArn

  # --- Lambda Permissions ---
  TriggerDedupCompletePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref TriggerFunctionArn
      Action: lambda:InvokeFunction
      Principal: sns.amazonaws.com
      SourceArn: !Ref DedupCompleteTopic

  # --- EventBridge Rule for OpenSERP Idle Monitor ---
  IdleMonitorRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub ${EnvironmentName}-wwii-openserp-idle-monitor
      ScheduleExpression: rate(10 minutes)
      State: ENABLED
      Targets:
        - Id: OpenSerpManager
          Arn: !Ref OpenSerpManagerFunctionArn

  IdleMonitorPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref OpenSerpManagerFunctionArn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt IdleMonitorRule.Arn

  # --- CloudWatch Alarms ---
  AlarmSNSTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub ${EnvironmentName}-wwii-alarms

  AlarmEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasNotificationEmail
    Properties:
      TopicArn: !Ref AlarmSNSTopic
      Protocol: email
      Endpoint: !Ref NotificationEmail

  Phase1ErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${EnvironmentName}-wwii-trigger-errors
      MetricName: Errors
      Namespace: AWS/Lambda
      Dimensions:
        - Name: FunctionName
          Value: !Sub ${EnvironmentName}-wwii-trigger
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !Ref AlarmSNSTopic

  Phase2ErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${EnvironmentName}-wwii-batch-poller-errors
      MetricName: Errors
      Namespace: AWS/Lambda
      Dimensions:
        - Name: FunctionName
          Value: !Sub ${EnvironmentName}-wwii-batch-poller
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !Ref AlarmSNSTopic

  Phase3ErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${EnvironmentName}-wwii-nat-manager-errors
      MetricName: Errors
      Namespace: AWS/Lambda
      Dimensions:
        - Name: FunctionName
          Value: !Sub ${EnvironmentName}-wwii-nat-manager
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !Ref AlarmSNSTopic

  Phase2DurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${EnvironmentName}-wwii-phase2-duration
      MetricName: Duration
      Namespace: AWS/Lambda
      Dimensions:
        - Name: FunctionName
          Value: !Sub ${EnvironmentName}-wwii-phase2-extract
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 840000
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !Ref AlarmSNSTopic

  ThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${EnvironmentName}-wwii-lambda-throttles
      MetricName: Throttles
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !Ref AlarmSNSTopic

  DLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${EnvironmentName}-wwii-dlq-messages
      MetricName: ApproximateNumberOfMessagesVisible
      Namespace: AWS/SQS
      Dimensions:
        - Name: QueueName
          Value: !Sub ${EnvironmentName}-wwii-phase2-dlq
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !Ref AlarmSNSTopic

  # ===========================================================================
  # M8 observability for the concurrency footprint (§10). Metric filters turn
  # correctness-critical log lines into metrics + alarms so a bug under parallel
  # load pages the operator instead of hiding in logs. All notify AlarmSNSTopic
  # (SNS -> Slack via Chatbot + email).
  # ===========================================================================

  # --- Metric filters on the ECS pipeline log group (correctness signals) ---
  CreditHoldMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Sub /ecs/${EnvironmentName}-wwii-pipeline
      FilterPattern: '"HOLDING work"'
      MetricTransformations:
        - MetricName: CreditHolds
          MetricNamespace: !Sub ${EnvironmentName}-wwii/concurrency
          MetricValue: '1'
          DefaultValue: 0

  CreditHoldAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${EnvironmentName}-wwii-credit-hold
      AlarmDescription: Credit gate is HOLDING work (unsubmitted = unprocessed) — top up credit / raise budget
      MetricName: CreditHolds
      Namespace: !Sub ${EnvironmentName}-wwii/concurrency
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmSNSTopic

  # Soft spend heads-up (§9): fires as accrued Grok spend crosses each
  # spend_alert_usd multiple ($10, $20, ...) — BEFORE the hard credit hold.
  SpendAlertMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Sub /ecs/${EnvironmentName}-wwii-pipeline
      FilterPattern: '"SPEND ALERT"'
      MetricTransformations:
        - MetricName: SpendAlerts
          MetricNamespace: !Sub ${EnvironmentName}-wwii/concurrency
          MetricValue: '1'
          DefaultValue: 0

  SpendAlertAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${EnvironmentName}-wwii-spend-alert
      AlarmDescription: Accrued Grok spend crossed a soft threshold ($10 multiple) — heads-up, not a block
      MetricName: SpendAlerts
      Namespace: !Sub ${EnvironmentName}-wwii/concurrency
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmSNSTopic

  MergeRetryExhaustedMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Sub /ecs/${EnvironmentName}-wwii-pipeline
      FilterPattern: '"mentions NOT merged"'
      MetricTransformations:
        - MetricName: MergeRetryExhausted
          MetricNamespace: !Sub ${EnvironmentName}-wwii/concurrency
          MetricValue: '1'
          DefaultValue: 0

  MergeRetryExhaustedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${EnvironmentName}-wwii-merge-retry-exhausted
      AlarmDescription: Entity mention merge exhausted retries — a cross-book write was LOST (§3.3)
      MetricName: MergeRetryExhausted
      Namespace: !Sub ${EnvironmentName}-wwii/concurrency
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmSNSTopic

  BatchSubmissionErrorMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Sub /ecs/${EnvironmentName}-wwii-pipeline
      FilterPattern: '"BatchSubmissionError"'
      MetricTransformations:
        - MetricName: BatchSubmissionErrors
          MetricNamespace: !Sub ${EnvironmentName}-wwii/concurrency
          MetricValue: '1'
          DefaultValue: 0

  BatchSubmissionErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${EnvironmentName}-wwii-batch-submission-error
      AlarmDescription: A batch was rejected/cancelled by xAI (fail-fast) — investigate model/size
      MetricName: BatchSubmissionErrors
      Namespace: !Sub ${EnvironmentName}-wwii/concurrency
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmSNSTopic

  NatLeaseFailureMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Sub /ecs/${EnvironmentName}-wwii-pipeline
      FilterPattern: '"Failed to acquire NAT lease"'
      MetricTransformations:
        - MetricName: NatLeaseFailures
          MetricNamespace: !Sub ${EnvironmentName}-wwii/concurrency
          MetricValue: '1'
          DefaultValue: 0

  NatLeaseFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${EnvironmentName}-wwii-nat-lease-failures
      AlarmDescription: Repeated NAT lease acquisition failures — NAT demand accounting may drift
      MetricName: NatLeaseFailures
      Namespace: !Sub ${EnvironmentName}-wwii/concurrency
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmSNSTopic

  # --- Step Functions dispatcher alarms (M4.3 had NONE — the biggest gap) ---
  DispatcherFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${EnvironmentName}-wwii-dispatcher-failed
      AlarmDescription: Concurrency dispatcher execution failed
      MetricName: ExecutionsFailed
      Namespace: AWS/States
      Dimensions:
        - Name: StateMachineArn
          Value: !Sub arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${EnvironmentName}-wwii-dispatcher
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmSNSTopic

  DispatcherTimedOutAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${EnvironmentName}-wwii-dispatcher-timedout
      AlarmDescription: Concurrency dispatcher execution timed out (stuck drain)
      MetricName: ExecutionsTimedOut
      Namespace: AWS/States
      Dimensions:
        - Name: StateMachineArn
          Value: !Sub arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${EnvironmentName}-wwii-dispatcher
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmSNSTopic

  # --- Dispatcher Lambda error alarms (enumerate/clamp/gate) ---
  EnumeratePendingErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${EnvironmentName}-wwii-enumerate-pending-errors
      MetricName: Errors
      Namespace: AWS/Lambda
      Dimensions:
        - Name: FunctionName
          Value: !Sub ${EnvironmentName}-wwii-enumerate-pending
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmSNSTopic

  ClampPoolErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${EnvironmentName}-wwii-clamp-pool-errors
      MetricName: Errors
      Namespace: AWS/Lambda
      Dimensions:
        - Name: FunctionName
          Value: !Sub ${EnvironmentName}-wwii-clamp-pool
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmSNSTopic

  HumanGateErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${EnvironmentName}-wwii-human-gate-errors
      MetricName: Errors
      Namespace: AWS/Lambda
      Dimensions:
        - Name: FunctionName
          Value: !Sub ${EnvironmentName}-wwii-human-gate
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmSNSTopic

  # --- OCR -> parse handoff: Batch job SUCCEEDED (chandra) -> merge Lambda ---
  OcrJobSucceededRule:
    Type: AWS::Events::Rule
    Condition: HasOcrMerge
    Properties:
      Name: !Sub ${EnvironmentName}-wwii-ocr-succeeded
      Description: On Chandra OCR job SUCCEEDED, promote OCR output to contentrepository (triggers parse)
      EventPattern:
        source: [aws.batch]
        detail-type: [Batch Job State Change]
        detail:
          status: [SUCCEEDED]
          jobQueue:
            - !Sub arn:aws:batch:${AWS::Region}:${AWS::AccountId}:job-queue/${EnvironmentName}-wwii-chandra-gpu
      State: ENABLED
      Targets:
        - Id: OcrMergeLambda
          Arn: !Ref OcrMergeFunctionArn

  OcrMergeInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: HasOcrMerge
    Properties:
      FunctionName: !Ref OcrMergeFunctionArn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt OcrJobSucceededRule.Arn

  # --- CloudWatch Dashboard ---
  PipelineDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub ${EnvironmentName}-wwii-pipeline
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "x": 0, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "Lambda Invocations",
                "metrics": [
                  ["AWS/Lambda", "Invocations", "FunctionName", "${EnvironmentName}-wwii-phase1-parse"],
                  ["...", "${EnvironmentName}-wwii-phase2-extract"],
                  ["...", "${EnvironmentName}-wwii-phase3-enrich"]
                ],
                "period": 300, "stat": "Sum", "region": "${AWS::Region}"
              }
            },
            {
              "type": "metric",
              "x": 12, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "Lambda Errors",
                "metrics": [
                  ["AWS/Lambda", "Errors", "FunctionName", "${EnvironmentName}-wwii-phase1-parse"],
                  ["...", "${EnvironmentName}-wwii-phase2-extract"],
                  ["...", "${EnvironmentName}-wwii-phase3-enrich"]
                ],
                "period": 300, "stat": "Sum", "region": "${AWS::Region}"
              }
            },
            {
              "type": "metric",
              "x": 0, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "Lambda Duration (ms)",
                "metrics": [
                  ["AWS/Lambda", "Duration", "FunctionName", "${EnvironmentName}-wwii-phase1-parse"],
                  ["...", "${EnvironmentName}-wwii-phase2-extract"],
                  ["...", "${EnvironmentName}-wwii-phase3-enrich"]
                ],
                "period": 300, "stat": "Average", "region": "${AWS::Region}"
              }
            },
            {
              "type": "metric",
              "x": 12, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "DLQ Messages",
                "metrics": [
                  ["AWS/SQS", "ApproximateNumberOfMessagesVisible", "QueueName", "${EnvironmentName}-wwii-phase1-dlq"],
                  ["...", "${EnvironmentName}-wwii-phase2-dlq"],
                  ["...", "${EnvironmentName}-wwii-phase3-dlq"]
                ],
                "period": 300, "stat": "Sum", "region": "${AWS::Region}"
              }
            }
          ]
        }

  # --- S3 Bucket Notification Configuration ---
  # S3 NotificationConfiguration is a property of AWS::S3::Bucket, but the bucket
  # is in storage.yaml and the SNS topics are here. Use a Custom Resource to wire
  # them together without circular dependencies.
  S3NotificationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${EnvironmentName}-wwii-s3-notif-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: S3NotificationAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:PutBucketNotification
                Resource: !Ref DataBucketArn

  S3NotificationFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${EnvironmentName}-wwii-s3-notif-setup
      Runtime: python3.12
      Handler: index.handler
      Timeout: 30
      Role: !GetAtt S3NotificationRole.Arn
      Code:
        ZipFile: |
          import boto3
          import cfnresponse
          def handler(event, context):
              try:
                  if event["RequestType"] == "Delete":
                      # Clear notifications on stack delete
                      boto3.client("s3").put_bucket_notification_configuration(
                          Bucket=event["ResourceProperties"]["BucketName"],
                          NotificationConfiguration={},
                      )
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
                      return
                  props = event["ResourceProperties"]
                  boto3.client("s3").put_bucket_notification_configuration(
                      Bucket=props["BucketName"],
                      NotificationConfiguration={
                          "TopicConfigurations": [
                              {
                                  "TopicArn": props["ContentUploadedTopicArn"],
                                  "Events": ["s3:ObjectCreated:*"],
                                  # No suffix filter: raw media (pdf/jpg/docx/epub/
                                  # md) all fire; the trigger Lambda routes by
                                  # suffix (Option B — feeds pre-stage/dispatcher)
                                  # and ignores non-content (zip, etc.). S3 forbids
                                  # overlapping same-prefix rules, so one broad rule
                                  # + code-side routing is the correct model.
                                  "Filter": {"Key": {"FilterRules": [
                                      {"Name": "prefix", "Value": "contentrepository/"},
                                  ]}},
                              },
                              {
                                  "TopicArn": props["ChapterParsedTopicArn"],
                                  "Events": ["s3:ObjectCreated:*"],
                                  "Filter": {"Key": {"FilterRules": [
                                      {"Name": "prefix", "Value": "output/content/"},
                                      {"Name": "suffix", "Value": "-parsed.json"},
                                  ]}},
                              },
                          ],
                      },
                  )
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
              except Exception as e:
                  cfnresponse.send(event, context, cfnresponse.FAILED, {"Error": str(e)})

  S3NotificationConfig:
    Type: Custom::S3Notification
    DependsOn:
      - ContentUploadedPolicy
      - ChapterParsedPolicy
      - EntityCreatedPolicy
    Properties:
      ServiceToken: !GetAtt S3NotificationFunction.Arn
      BucketName: !Ref DataBucketName
      ContentUploadedTopicArn: !Ref ContentUploadedTopic
      ChapterParsedTopicArn: !Ref ChapterParsedTopic
      EntityCreatedTopicArn: !Ref EntityCreatedTopic
      ConfigVersion: "4"  # Bump to force re-execution when notification config changes

Outputs:
  ContentUploadedTopicArn:
    Value: !Ref ContentUploadedTopic
  ChapterParsedTopicArn:
    Value: !Ref ChapterParsedTopic
  EntityCreatedTopicArn:
    Value: !Ref EntityCreatedTopic
  Phase2CompleteTopicArn:
    Value: !Ref Phase2CompleteTopic
