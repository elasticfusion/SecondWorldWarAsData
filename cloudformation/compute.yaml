AWSTemplateFormatVersion: '2010-09-09'
Description: WWII Pipeline - Compute (ECS tasks for pipeline, Lambda for trigger/dedup/openserp, ALB)

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
  VpcId:
    Type: String
  PrivateSubnet1Id:
    Type: String
  PrivateSubnet2Id:
    Type: String
  PublicSubnet1Id:
    Type: String
  LambdaSGId:
    Type: String
  OpenSerpSGId:
    Type: String
  LambdaExecutionRoleArn:
    Type: String
  ECSTaskRoleArn:
    Type: String
  ECSTaskExecutionRoleArn:
    Type: String
  DataBucketName:
    Type: String
  CacheTableName:
    Type: String
  LambdaCodeBucket:
    Type: String
  LambdaCodeKey:
    Type: String
    Default: lambda/code.zip
  OpenSerpImageUri:
    Type: String
    Description: ECR image URI for OpenSERP container
  PipelineImageUri:
    Type: String
    Description: ECR image URI for pipeline container
  BatchPollerIntervalMinutes:
    Type: Number
    Default: 5
    Description: How often the batch poller checks for completed batches
  ReconciliationIntervalMinutes:
    Type: Number
    Default: 15
    Description: How often the stale lock / reconciliation check runs
  NatWaitSeconds:
    Type: Number
    Default: 180
    Description: Max seconds to wait for NAT gateway availability
  TeardownDelayMinutes:
    Type: Number
    Default: 30
    Description: Minutes to wait before tearing down networking after Phase 2 (dedup review window)

Resources:
  # --- ECS Cluster ---
  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub ${EnvironmentName}-wwii-pipeline
      ClusterSettings:
        - Name: containerInsights
          Value: enabled
      CapacityProviders:
        - FARGATE_SPOT
        - FARGATE
      DefaultCapacityProviderStrategy:
        - CapacityProvider: FARGATE_SPOT
          Weight: 4
          Base: 0
        - CapacityProvider: FARGATE
          Weight: 1
          Base: 0

  # --- Pipeline ECS Log Group ---
  PipelineLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/${EnvironmentName}-wwii-pipeline
      RetentionInDays: 30

  # --- Pipeline ECS Task Definitions ---
  Phase1TaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub ${EnvironmentName}-wwii-phase1-parse
      Cpu: '512'
      Memory: '1024'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      TaskRoleArn: !Ref ECSTaskRoleArn
      ExecutionRoleArn: !Ref ECSTaskExecutionRoleArn
      ContainerDefinitions:
        - Name: pipeline
          Image: !Ref PipelineImageUri
          StopTimeout: 30
          Command: ['phase1_parse.py']
          Environment:
            - Name: AWS_DEFAULT_REGION
              Value: !Ref AWS::Region
            - Name: S3_BUCKET
              Value: !Ref DataBucketName
            - Name: NOTIFICATION_TOPIC_ARN
              Value: !Sub arn:aws:sns:${AWS::Region}:${AWS::AccountId}:${EnvironmentName}-wwii-phase2-complete
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref PipelineLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: phase1

  Phase2TaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub ${EnvironmentName}-wwii-phase2-extract
      Cpu: '1024'
      Memory: '2048'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      TaskRoleArn: !Ref ECSTaskRoleArn
      ExecutionRoleArn: !Ref ECSTaskExecutionRoleArn
      ContainerDefinitions:
        - Name: pipeline
          Image: !Ref PipelineImageUri
          Command: ['phase2_extract.py', '--batch']
          Environment:
            - Name: AWS_DEFAULT_REGION
              Value: !Ref AWS::Region
            - Name: S3_BUCKET
              Value: !Ref DataBucketName
            - Name: CACHE_TABLE
              Value: !Ref CacheTableName
            - Name: SECRETS_ID
              Value: !Sub ${EnvironmentName}-wwii-pipeline/grok-api-key
            - Name: NOTIFICATION_TOPIC_ARN
              Value: !Sub arn:aws:sns:${AWS::Region}:${AWS::AccountId}:${EnvironmentName}-wwii-phase2-complete
            - Name: DEDUP_REVIEW_URL
              Value: !Sub https://${DedupApi}.execute-api.${AWS::Region}.amazonaws.com/app/dedup
            - Name: CONTENT_TOPIC_ARN
              Value: !Sub arn:aws:sns:${AWS::Region}:${AWS::AccountId}:${EnvironmentName}-wwii-content-uploaded
            - Name: ENV_NAME
              Value: !Ref EnvironmentName
            - Name: SCHEDULER_ROLE_ARN
              Value: !Sub arn:aws:iam::${AWS::AccountId}:role/${EnvironmentName}-wwii-scheduler-role
            - Name: TEARDOWN_DELAY_MINUTES
              Value: !Ref TeardownDelayMinutes
            - Name: NAT_WAIT_SECONDS
              Value: !Ref NatWaitSeconds
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref PipelineLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: phase2

  Phase3TaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub ${EnvironmentName}-wwii-phase3-enrich
      Cpu: '512'
      Memory: '1024'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      TaskRoleArn: !Ref ECSTaskRoleArn
      ExecutionRoleArn: !Ref ECSTaskExecutionRoleArn
      ContainerDefinitions:
        - Name: pipeline
          Image: !Ref PipelineImageUri
          Command: ['phase3_enrich_data.py', '--batch']
          Environment:
            - Name: AWS_DEFAULT_REGION
              Value: !Ref AWS::Region
            - Name: S3_BUCKET
              Value: !Ref DataBucketName
            - Name: CACHE_TABLE
              Value: !Ref CacheTableName
            - Name: SECRETS_ID
              Value: !Sub ${EnvironmentName}-wwii-pipeline/grok-api-key
            - Name: NOTIFICATION_TOPIC_ARN
              Value: !Sub arn:aws:sns:${AWS::Region}:${AWS::AccountId}:${EnvironmentName}-wwii-phase2-complete
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref PipelineLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: phase3

  ImportTaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub ${EnvironmentName}-wwii-import
      Cpu: '512'
      Memory: '1024'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      TaskRoleArn: !Ref ECSTaskRoleArn
      ExecutionRoleArn: !Ref ECSTaskExecutionRoleArn
      ContainerDefinitions:
        - Name: pipeline
          Image: !Ref PipelineImageUri
          Command: ['import_to_dynamodb.py', '--prefix', !Sub '${EnvironmentName}-wwii-']
          Environment:
            - Name: AWS_DEFAULT_REGION
              Value: !Ref AWS::Region
            - Name: S3_BUCKET
              Value: !Ref DataBucketName
            - Name: NOTIFICATION_TOPIC_ARN
              Value: !Sub arn:aws:sns:${AWS::Region}:${AWS::AccountId}:${EnvironmentName}-wwii-phase2-complete
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref PipelineLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: import

  # --- Trigger Lambda (SNS → ECS RunTask) ---
  TriggerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${EnvironmentName}-wwii-trigger
      Runtime: python3.12
      Handler: lambda_handlers.trigger_handler.handler
      Timeout: 240
      MemorySize: 128
      Role: !Ref LambdaExecutionRoleArn
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Ref LambdaCodeKey
      Environment:
        Variables:
          ENV_NAME: !Ref EnvironmentName
          ECS_CLUSTER: !Sub ${EnvironmentName}-wwii-pipeline
          PRIVATE_SUBNET_IDS: !Sub "${PrivateSubnet1Id},${PrivateSubnet2Id}"
          SECURITY_GROUP_ID: !Ref LambdaSGId
          S3_BUCKET: !Ref DataBucketName
          CACHE_TABLE: !Ref CacheTableName
          NOTIFICATION_TOPIC_ARN: !Sub arn:aws:sns:${AWS::Region}:${AWS::AccountId}:${EnvironmentName}-wwii-phase2-complete
          NAT_MANAGER_FN: !Sub ${EnvironmentName}-wwii-nat-manager
          NETWORKING_STACK: !Sub ${EnvironmentName}-wwii-networking
          PHASE1_TASK_DEF: !Ref Phase1TaskDef
          PHASE2_TASK_DEF: !Ref Phase2TaskDef
          PHASE3_TASK_DEF: !Ref Phase3TaskDef
          NAT_WAIT_SECONDS: !Ref NatWaitSeconds
  # --- Hourly stale lock check ---
  StaleLockCheckRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub ${EnvironmentName}-wwii-stale-lock-check
      ScheduleExpression: !Sub "rate(${ReconciliationIntervalMinutes} minutes)"
      State: ENABLED
      Targets:
        - Id: TriggerLambda
          Arn: !GetAtt TriggerFunction.Arn
          Input: '{"source": "scheduled", "action": "check_locks"}'

  StaleLockCheckPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref TriggerFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt StaleLockCheckRule.Arn

  # --- Spot termination recovery (immediate lock clearing) ---
  SpotTerminationRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub ${EnvironmentName}-wwii-spot-recovery
      State: ENABLED
      EventPattern:
        source:
          - aws.ecs
        detail-type:
          - ECS Task State Change
        detail:
          clusterArn:
            - !Sub arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:cluster/${EnvironmentName}-wwii-pipeline
          lastStatus:
            - STOPPED
          stoppedReason:
            - prefix: "Your Spot Task"
      Targets:
        - Id: TriggerLambda
          Arn: !GetAtt TriggerFunction.Arn

  # --- ECS task failure detection (any non-zero exit) ---
  TaskFailureRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub ${EnvironmentName}-wwii-task-failure
      State: ENABLED
      EventPattern:
        source:
          - aws.ecs
        detail-type:
          - ECS Task State Change
        detail:
          clusterArn:
            - !Sub arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:cluster/${EnvironmentName}-wwii-pipeline
          lastStatus:
            - STOPPED
          containers:
            exitCode:
              - anything-but: 0
      Targets:
        - Id: TriggerLambda
          Arn: !GetAtt TriggerFunction.Arn
          Input: '{"source": "scheduled", "action": "check_locks"}'

  SpotTerminationPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref TriggerFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt SpotTerminationRule.Arn

  # --- Lambda Functions (kept) ---
  OpenSerpManagerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${EnvironmentName}-wwii-openserp-manager
      Runtime: python3.12
      Handler: lambda_handlers.openserp_manager.handler
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Ref LambdaCodeKey
      MemorySize: 128
      Timeout: 120
      Role: !Ref LambdaExecutionRoleArn

  # --- NAT Gateway Manager ---
  NatManagerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${EnvironmentName}-wwii-nat-manager
      Runtime: python3.12
      Handler: lambda_handlers.nat_manager.handler
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Ref LambdaCodeKey
      MemorySize: 128
      Timeout: 300
      Role: !Ref LambdaExecutionRoleArn
      Environment:
        Variables:
          ENV_NAME: !Ref EnvironmentName
          PUBLIC_SUBNET_ID: !Ref PublicSubnet1Id
          PRIVATE_SUBNET_IDS: !Sub "${PrivateSubnet1Id},${PrivateSubnet2Id}"
          VPC_ID: !Ref VpcId
          SECURITY_GROUP_ID: !Ref LambdaSGId
          OPENSERP_SG_ID: !Ref OpenSerpSGId
          CACHE_TABLE: !Ref CacheTableName
          NOTIFICATION_TOPIC_ARN: !Sub arn:aws:sns:${AWS::Region}:${AWS::AccountId}:${EnvironmentName}-wwii-phase2-complete

  # --- Metrics API ---
  MetricsFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${EnvironmentName}-wwii-metrics
      Runtime: python3.12
      Handler: scripts.view_metrics.handler
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Ref LambdaCodeKey
      MemorySize: 128
      Timeout: 30
      Role: !Ref LambdaExecutionRoleArn
      Environment:
        Variables:
          CACHE_TABLE: !Ref CacheTableName

  # --- Batch Poller ---
  BatchPollerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${EnvironmentName}-wwii-batch-poller
      Runtime: python3.12
      Handler: lambda_handlers.batch_poller.handler
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Ref LambdaCodeKey
      MemorySize: 128
      Timeout: 300
      Role: !Ref LambdaExecutionRoleArn
      Environment:
        Variables:
          ENV_NAME: !Ref EnvironmentName
          CACHE_TABLE: !Ref CacheTableName
          ECS_CLUSTER: !Sub ${EnvironmentName}-wwii-pipeline
          PRIVATE_SUBNET_IDS: !Sub "${PrivateSubnet1Id},${PrivateSubnet2Id}"
          SECURITY_GROUP_ID: !Ref LambdaSGId
          SECRETS_ID: !Sub ${EnvironmentName}-wwii-pipeline/grok-api-key
          NOTIFICATION_TOPIC_ARN: !Sub arn:aws:sns:${AWS::Region}:${AWS::AccountId}:${EnvironmentName}-wwii-phase2-complete
          NAT_WAIT_SECONDS: !Ref NatWaitSeconds

  BatchPollerSchedule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub ${EnvironmentName}-wwii-batch-poller-schedule
      ScheduleExpression: !Sub "rate(${BatchPollerIntervalMinutes} minutes)"
      State: ENABLED
      Targets:
        - Id: BatchPollerTarget
          Arn: !GetAtt BatchPollerFunction.Arn

  BatchPollerSchedulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref BatchPollerFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt BatchPollerSchedule.Arn

  MetricsApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub ${EnvironmentName}-wwii-metrics-api

  MetricsUnauthorizedResponse:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref MetricsApi
      ResponseType: UNAUTHORIZED
      StatusCode: '401'
      ResponseParameters:
        gatewayresponse.header.WWW-Authenticate: "'Basic realm=\"Metrics\"'"

  MetricsAccessDeniedResponse:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref MetricsApi
      ResponseType: ACCESS_DENIED
      StatusCode: '401'
      ResponseParameters:
        gatewayresponse.header.WWW-Authenticate: "'Basic realm=\"Metrics\"'"

  MetricsAuthorizer:
    Type: AWS::ApiGateway::Authorizer
    Properties:
      Name: BasicAuth
      RestApiId: !Ref MetricsApi
      Type: TOKEN
      AuthorizerUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DedupAuthFunction.Arn}/invocations
      IdentitySource: method.request.header.Authorization
      AuthorizerResultTtlInSeconds: 300

  MetricsAuthInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref DedupAuthFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${MetricsApi}/*

  MetricsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MetricsApi
      ParentId: !GetAtt MetricsApi.RootResourceId
      PathPart: metrics

  MetricsGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref MetricsApi
      ResourceId: !Ref MetricsResource
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref MetricsAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${MetricsFunction.Arn}/invocations

  MetricsInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref MetricsFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${MetricsApi}/*

  MetricsApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - MetricsGetMethod
      - MetricsUnauthorizedResponse
      - MetricsAccessDeniedResponse
    Properties:
      RestApiId: !Ref MetricsApi

  MetricsApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref MetricsApi
      DeploymentId: !Ref MetricsApiDeployment
      StageName: app

  # --- Dedup Review UI ---
  DedupUIFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${EnvironmentName}-wwii-dedup-ui
      Runtime: python3.12
      Handler: lambda_handlers.dedup_ui_handler.handler
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Ref LambdaCodeKey
      MemorySize: 512
      Timeout: 30
      Role: !Ref LambdaExecutionRoleArn
      Environment:
        Variables:
          S3_BUCKET: !Ref DataBucketName
          CACHE_TABLE: !Ref CacheTableName
          DEDUP_COMPLETE_TOPIC_ARN: !Sub arn:aws:sns:${AWS::Region}:${AWS::AccountId}:${EnvironmentName}-wwii-dedup-complete

  DedupGateFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${EnvironmentName}-wwii-dedup-gate
      Runtime: python3.12
      Handler: lambda_handlers.dedup_gate_handler.handler
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Ref LambdaCodeKey
      MemorySize: 256
      Timeout: 300
      Role: !Ref LambdaExecutionRoleArn
      Environment:
        Variables:
          S3_BUCKET: !Ref DataBucketName
          PHASE3_FUNCTION_NAME: !Sub ${EnvironmentName}-wwii-phase3-enrich

  DedupAuthFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${EnvironmentName}-wwii-dedup-auth
      Runtime: python3.12
      Handler: index.handler
      Code:
        ZipFile: |
          import base64
          import os
          def handler(event, context):
              token = event.get('authorizationToken', '')
              expected = os.environ.get('AUTH_TOKEN', '')
              if token.startswith('Basic '):
                  decoded = base64.b64decode(token[6:]).decode()
                  if decoded == expected:
                      return {'principalId': 'user', 'policyDocument': {
                          'Version': '2012-10-17',
                          'Statement': [{'Action': 'execute-api:Invoke', 'Effect': 'Allow',
                                         'Resource': event['methodArn']}]}}
              return {'principalId': 'user', 'policyDocument': {
                  'Version': '2012-10-17',
                  'Statement': [{'Action': 'execute-api:Invoke', 'Effect': 'Deny',
                                 'Resource': event['methodArn']}]}}
      MemorySize: 128
      Timeout: 5
      Role: !Ref LambdaExecutionRoleArn
      Environment:
        Variables:
          AUTH_TOKEN: !Sub '{{resolve:secretsmanager:${EnvironmentName}-wwii-pipeline/dedup-auth}}'

  # --- API Gateway for Dedup UI ---
  DedupApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub ${EnvironmentName}-wwii-dedup-api

  DedupUnauthorizedResponse:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref DedupApi
      ResponseType: UNAUTHORIZED
      StatusCode: '401'
      ResponseParameters:
        gatewayresponse.header.WWW-Authenticate: "'Basic realm=\"Dedup Review\"'"
      ResponseTemplates:
        application/json: '{"message":"Unauthorized"}'

  DedupAccessDeniedResponse:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref DedupApi
      ResponseType: ACCESS_DENIED
      StatusCode: '401'
      ResponseParameters:
        gatewayresponse.header.WWW-Authenticate: "'Basic realm=\"Dedup Review\"'"
      ResponseTemplates:
        application/json: '{"message":"Invalid credentials"}'

  DedupAuthorizer:
    Type: AWS::ApiGateway::Authorizer
    Properties:
      Name: BasicAuth
      RestApiId: !Ref DedupApi
      Type: TOKEN
      AuthorizerUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DedupAuthFunction.Arn}/invocations
      IdentitySource: method.request.header.Authorization
      AuthorizerResultTtlInSeconds: 300

  DedupAuthInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref DedupAuthFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${DedupApi}/*

  DedupResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref DedupApi
      ParentId: !GetAtt DedupApi.RootResourceId
      PathPart: dedup

  DedupProxyResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref DedupApi
      ParentId: !Ref DedupResource
      PathPart: '{proxy+}'

  DedupGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref DedupApi
      ResourceId: !Ref DedupResource
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref DedupAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DedupUIFunction.Arn}/invocations

  DedupProxyMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref DedupApi
      ResourceId: !Ref DedupProxyResource
      HttpMethod: ANY
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref DedupAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DedupUIFunction.Arn}/invocations

  DedupUIInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref DedupUIFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${DedupApi}/*

  DedupApiDeploymentV3:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - DedupGetMethod
      - DedupProxyMethod
      - DedupUnauthorizedResponse
      - DedupAccessDeniedResponse
    Properties:
      RestApiId: !Ref DedupApi

  DedupApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref DedupApi
      DeploymentId: !Ref DedupApiDeploymentV3
      StageName: app

  # --- OpenSERP ECS Service ---
  OpenSerpLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/${EnvironmentName}-wwii-openserp
      RetentionInDays: 14

  OpenSerpTaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub ${EnvironmentName}-wwii-openserp
      Cpu: '512'
      Memory: '1024'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      TaskRoleArn: !Ref ECSTaskRoleArn
      ExecutionRoleArn: !Ref ECSTaskExecutionRoleArn
      ContainerDefinitions:
        - Name: openserp
          Image: !Ref OpenSerpImageUri
          Command: ['serve', '--host', '0.0.0.0', '--port', '7001', '--raw']
          PortMappings:
            - ContainerPort: 7001
              Protocol: tcp
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref OpenSerpLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: openserp
          HealthCheck:
            Command:
              - CMD-SHELL
              - wget -q -O /dev/null http://localhost:7001/health || exit 1
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 60

  # --- Internal ALB for OpenSERP ---
  OpenSerpService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub ${EnvironmentName}-wwii-openserp
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref OpenSerpTaskDef
      DesiredCount: 0
      CapacityProviderStrategy:
        - CapacityProvider: FARGATE_SPOT
          Weight: 4
          Base: 0
        - CapacityProvider: FARGATE
          Weight: 1
          Base: 0
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets:
            - !Ref PrivateSubnet1Id
            - !Ref PrivateSubnet2Id
          SecurityGroups:
            - !Ref OpenSerpSGId

  PipelineDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub ${EnvironmentName}-wwii-pipeline-logs
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "log",
              "x": 0, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "Pipeline Run Summary",
                "region": "${AWS::Region}",
                "view": "table",
                "logGroupNames": ["/ecs/${EnvironmentName}-wwii-pipeline"],
                "query": "fields @timestamp, extra_fields.phase, extra_fields.duration_s | filter extra_fields.event = 'phase_complete' OR extra_fields.event = 'phase_failed' | sort @timestamp desc | limit 20"
              }
            },
            {
              "type": "log",
              "x": 12, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "Batch Submissions",
                "region": "${AWS::Region}",
                "view": "table",
                "logGroupNames": ["/ecs/${EnvironmentName}-wwii-pipeline"],
                "query": "fields @timestamp, extra_fields.batch_name, extra_fields.request_count, extra_fields.type_counts | filter extra_fields.event = 'batch_submit' OR extra_fields.event = 'batch_breakdown' | sort @timestamp desc | limit 20"
              }
            },
            {
              "type": "log",
              "x": 0, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "Failed Batch Results",
                "region": "${AWS::Region}",
                "view": "table",
                "logGroupNames": ["/ecs/${EnvironmentName}-wwii-pipeline"],
                "query": "fields @timestamp, extra_fields.request_id, extra_fields.cache_type, extra_fields.status, extra_fields.finish_reason, extra_fields.content_tail | filter extra_fields.event = 'batch_result_failed' | sort @timestamp desc | limit 50"
              }
            },
            {
              "type": "log",
              "x": 12, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "Token Usage (hourly)",
                "region": "${AWS::Region}",
                "view": "bar",
                "logGroupNames": ["/ecs/${EnvironmentName}-wwii-pipeline"],
                "query": "filter extra_fields.event = 'api_usage' | stats sum(extra_fields.total_tokens) as total_tokens, sum(extra_fields.prompt_tokens) as prompt, sum(extra_fields.completion_tokens) as completion by bin(1h)"
              }
            },
            {
              "type": "log",
              "x": 0, "y": 12, "width": 12, "height": 6,
              "properties": {
                "title": "Rate Limiting Events",
                "region": "${AWS::Region}",
                "view": "bar",
                "logGroupNames": ["/ecs/${EnvironmentName}-wwii-pipeline"],
                "query": "filter message like /Rate limit/ OR message like /429/ OR message like /backing off/ | stats count() as rate_limits by bin(10m)"
              }
            },
            {
              "type": "log",
              "x": 12, "y": 12, "width": 12, "height": 6,
              "properties": {
                "title": "Errors (last 24h)",
                "region": "${AWS::Region}",
                "view": "table",
                "logGroupNames": ["/ecs/${EnvironmentName}-wwii-pipeline"],
                "query": "fields @timestamp, level, message, extra_fields.phase, extra_fields.book | filter level = 'ERROR' | sort @timestamp desc | limit 50"
              }
            }
          ]
        }

Outputs:
  TriggerFunctionArn:
    Value: !GetAtt TriggerFunction.Arn
  OpenSerpManagerFunctionArn:
    Value: !GetAtt OpenSerpManagerFunction.Arn
  DedupGateFunctionArn:
    Value: !GetAtt DedupGateFunction.Arn
  ECSClusterName:
    Value: !Ref ECSCluster
  Phase1TaskDefArn:
    Value: !Ref Phase1TaskDef
  Phase2TaskDefArn:
    Value: !Ref Phase2TaskDef
  Phase3TaskDefArn:
    Value: !Ref Phase3TaskDef
  ImportTaskDefArn:
    Value: !Ref ImportTaskDef
  OpenSerpServiceName:
    Value: !GetAtt OpenSerpService.Name
  DedupApiUrl:
    Value: !Sub https://${DedupApi}.execute-api.${AWS::Region}.amazonaws.com/app/dedup
  MetricsApiUrl:
    Value: !Sub https://${MetricsApi}.execute-api.${AWS::Region}.amazonaws.com/app/metrics
