AWSTemplateFormatVersion: '2010-09-09'
Description: WWII Pipeline - Compute (ECS tasks for pipeline, Lambda for trigger/dedup/openserp, ALB)

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
  VpcId:
    Type: String
  PrivateSubnet1Id:
    Type: String
  PrivateSubnet2Id:
    Type: String
  PublicSubnet1Id:
    Type: String
  LambdaSGId:
    Type: String
  OpenSerpSGId:
    Type: String
  LambdaExecutionRoleArn:
    Type: String
  ECSTaskRoleArn:
    Type: String
  ECSTaskExecutionRoleArn:
    Type: String
  DataBucketName:
    Type: String
  CacheTableName:
    Type: String
  LambdaCodeBucket:
    Type: String
  LambdaCodeKey:
    Type: String
    Default: lambda/code.zip
  OpenSerpImageUri:
    Type: String
    Description: ECR image URI for OpenSERP container
  PipelineImageUri:
    Type: String
    Description: ECR image URI for pipeline container

Resources:
  # --- ECS Cluster ---
  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub ${EnvironmentName}-wwii-pipeline

  # --- Pipeline ECS Log Group ---
  PipelineLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/${EnvironmentName}-wwii-pipeline
      RetentionInDays: 14

  # --- Pipeline ECS Task Definitions ---
  Phase1TaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub ${EnvironmentName}-wwii-phase1-parse
      Cpu: '512'
      Memory: '1024'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      TaskRoleArn: !Ref ECSTaskRoleArn
      ExecutionRoleArn: !Ref ECSTaskExecutionRoleArn
      ContainerDefinitions:
        - Name: pipeline
          Image: !Ref PipelineImageUri
          Command: ['phase1_parse.py']
          Environment:
            - Name: AWS_DEFAULT_REGION
              Value: !Ref AWS::Region
            - Name: S3_BUCKET
              Value: !Ref DataBucketName
            - Name: NOTIFICATION_TOPIC_ARN
              Value: !Sub arn:aws:sns:${AWS::Region}:${AWS::AccountId}:${EnvironmentName}-wwii-phase2-complete
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref PipelineLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: phase1

  Phase2TaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub ${EnvironmentName}-wwii-phase2-extract
      Cpu: '1024'
      Memory: '2048'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      TaskRoleArn: !Ref ECSTaskRoleArn
      ExecutionRoleArn: !Ref ECSTaskExecutionRoleArn
      ContainerDefinitions:
        - Name: pipeline
          Image: !Ref PipelineImageUri
          Command: ['phase2_extract.py', '--batch']
          Environment:
            - Name: AWS_DEFAULT_REGION
              Value: !Ref AWS::Region
            - Name: S3_BUCKET
              Value: !Ref DataBucketName
            - Name: CACHE_TABLE
              Value: !Ref CacheTableName
            - Name: SECRETS_ID
              Value: !Sub ${EnvironmentName}-wwii-pipeline/grok-api-key
            - Name: NOTIFICATION_TOPIC_ARN
              Value: !Sub arn:aws:sns:${AWS::Region}:${AWS::AccountId}:${EnvironmentName}-wwii-phase2-complete
            - Name: DEDUP_REVIEW_URL
              Value: !Sub https://${DedupApi}.execute-api.${AWS::Region}.amazonaws.com/app/dedup
            - Name: CONTENT_TOPIC_ARN
              Value: !Sub arn:aws:sns:${AWS::Region}:${AWS::AccountId}:${EnvironmentName}-wwii-content-uploaded
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref PipelineLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: phase2

  Phase3TaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub ${EnvironmentName}-wwii-phase3-enrich
      Cpu: '512'
      Memory: '1024'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      TaskRoleArn: !Ref ECSTaskRoleArn
      ExecutionRoleArn: !Ref ECSTaskExecutionRoleArn
      ContainerDefinitions:
        - Name: pipeline
          Image: !Ref PipelineImageUri
          Command: ['phase3_enrich_data.py', '--batch']
          Environment:
            - Name: AWS_DEFAULT_REGION
              Value: !Ref AWS::Region
            - Name: S3_BUCKET
              Value: !Ref DataBucketName
            - Name: CACHE_TABLE
              Value: !Ref CacheTableName
            - Name: SECRETS_ID
              Value: !Sub ${EnvironmentName}-wwii-pipeline/grok-api-key
            - Name: NOTIFICATION_TOPIC_ARN
              Value: !Sub arn:aws:sns:${AWS::Region}:${AWS::AccountId}:${EnvironmentName}-wwii-phase2-complete
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref PipelineLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: phase3

  ImportTaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub ${EnvironmentName}-wwii-import
      Cpu: '512'
      Memory: '1024'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      TaskRoleArn: !Ref ECSTaskRoleArn
      ExecutionRoleArn: !Ref ECSTaskExecutionRoleArn
      ContainerDefinitions:
        - Name: pipeline
          Image: !Ref PipelineImageUri
          Command: ['import_to_dynamodb.py', '--prefix', !Sub '${EnvironmentName}-wwii-']
          Environment:
            - Name: AWS_DEFAULT_REGION
              Value: !Ref AWS::Region
            - Name: S3_BUCKET
              Value: !Ref DataBucketName
            - Name: NOTIFICATION_TOPIC_ARN
              Value: !Sub arn:aws:sns:${AWS::Region}:${AWS::AccountId}:${EnvironmentName}-wwii-phase2-complete
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref PipelineLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: import

  # --- Trigger Lambda (SNS → ECS RunTask) ---
  TriggerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${EnvironmentName}-wwii-trigger
      Runtime: python3.12
      Handler: index.handler
      Timeout: 240
      MemorySize: 128
      Role: !Ref LambdaExecutionRoleArn
      Code:
        ZipFile: !Sub |
          import boto3, json, os, logging
          logger = logging.getLogger()
          logger.setLevel("INFO")
          ecs = boto3.client("ecs")
          s3 = boto3.client("s3")
          dynamo = boto3.resource("dynamodb").Table("${CacheTableName}")
          CLUSTER = "${ECSCluster}"
          SUBNETS = ["${PrivateSubnet1Id}", "${PrivateSubnet2Id}"]
          SG = "${LambdaSGId}"
          BUCKET = "${DataBucketName}"
          NOTIFY_TOPIC = "arn:aws:sns:${AWS::Region}:${AWS::AccountId}:${EnvironmentName}-wwii-phase2-complete"
          TOPIC_MAP = {
              "${EnvironmentName}-wwii-content-uploaded": "${Phase1TaskDef}",
              "${EnvironmentName}-wwii-chapter-parsed": "${Phase2TaskDef}",
          }
          DEDUP_COMPLETE_TOPIC = "${EnvironmentName}-wwii-dedup-complete"
          ENTITY_TOPIC = "${EnvironmentName}-wwii-entity-created"
          PHASE3_TASK = "${Phase3TaskDef}"

          def handler(event, context):
              # Scheduled stale lock check — only clear locks, don't launch tasks
              if event.get("source") == "scheduled":
                  logger.info("Scheduled lock check")
                  for task_def, family in TASK_FAMILIES.items():
                      lock_key = f"lock#{family}"
                      try:
                          existing = dynamo.get_item(Key={"cache_key": lock_key}).get("Item")
                          if existing:
                              running = ecs.list_tasks(cluster=CLUSTER, family=family, desiredStatus="RUNNING").get("taskArns", [])
                              if not running:
                                  dynamo.delete_item(Key={"cache_key": lock_key})
                                  logger.info("Cleared stale lock: %s", family)
                      except Exception as e:
                          logger.warning("Lock check failed for %s: %s", family, e)
                  return {"action": "lock_check_complete"}

              # Extract unique topic names and S3 keys from records (SQS or SNS format)
              topics = set()
              s3_keys = []
              for record in event.get("Records", []):
                  # SQS format: record.body contains SNS JSON
                  if "body" in record:
                      import json as _json
                      try:
                          sns_msg = _json.loads(record["body"])
                          topic_arn = sns_msg.get("TopicArn", "")
                          # Extract S3 keys from the SNS message
                          msg = sns_msg.get("Message", "{}")
                          if isinstance(msg, str):
                              try:
                                  s3_event = _json.loads(msg)
                                  for s3_rec in s3_event.get("Records", []):
                                      s3_keys.append(s3_rec["s3"]["object"]["key"])
                              except Exception:
                                  pass
                      except Exception:
                          topic_arn = ""
                  else:
                      # Direct SNS format (dedup-complete)
                      topic_arn = record.get("Sns", {}).get("TopicArn", "")
                  if topic_arn:
                      topics.add(topic_arn.rsplit(":", 1)[-1])

              logger.info("Trigger topics: %s, keys: %d", topics, len(s3_keys))

              # Write manifest of changed files for incremental processing
              if s3_keys:
                  import json as _json
                  manifest_key = "manifests/pending.json"
                  # Merge with existing manifest
                  try:
                      resp = s3.get_object(Bucket=BUCKET, Key=manifest_key)
                      existing = _json.loads(resp["Body"].read())
                  except Exception:
                      existing = []
                  merged = list(set(existing + s3_keys))
                  s3.put_object(Bucket=BUCKET, Key=manifest_key, Body=_json.dumps(merged).encode())
                  logger.info("Manifest: %d keys", len(merged))

              for topic_name in topics:

                  # Direct mapping: content-uploaded → phase1, chapter-parsed → phase2
                  task_def = TOPIC_MAP.get(topic_name)
                  if task_def:
                      _run_task(task_def, topic_name, keys=s3_keys)
                      continue

                  # Dedup gate: entity-created → check review status before phase3
                  if topic_name == ENTITY_TOPIC:
                      if not _review_complete():
                          logger.info("Dedup review not complete, skipping phase3")
                          continue
                      _stop_phase2_tasks()
                      _run_task(PHASE3_TASK, topic_name)
                      continue

                  # Dedup complete signal → launch phase3
                  if topic_name == DEDUP_COMPLETE_TOPIC:
                      logger.info("Dedup complete, launching phase3")
                      _stop_phase2_tasks()
                      _run_task(PHASE3_TASK, topic_name)
                      continue

                  logger.warning("Unknown topic: %s", topic_name)

          def _review_complete():
              try:
                  resp = s3.get_object(Bucket=BUCKET, Key="dedup/review_status.json")
                  status = json.loads(resp["Body"].read())
                  return status.get("complete", False)
              except s3.exceptions.NoSuchKey:
                  return False
              except Exception as e:
                  logger.error("Failed to check review status: %s", e)
                  return False

          TASK_FAMILIES = {
              "${Phase1TaskDef}": "${EnvironmentName}-wwii-phase1-parse",
              "${Phase2TaskDef}": "${EnvironmentName}-wwii-phase2-extract",
              "${Phase3TaskDef}": "${EnvironmentName}-wwii-phase3-enrich",
          }

          def _stop_phase2_tasks():
              try:
                  tasks = ecs.list_tasks(cluster=CLUSTER, family="${EnvironmentName}-wwii-phase2-extract", desiredStatus="RUNNING")
                  for arn in tasks.get("taskArns", []):
                      ecs.stop_task(cluster=CLUSTER, task=arn, reason="Phase 3 starting")
                      logger.info("Stopped phase2 task: %s", arn.split("/")[-1])
              except Exception as e:
                  logger.warning("Failed to stop phase2 tasks: %s", e)

          def _run_task(task_def, source, keys=None):
              # Ensure networking stack exists (async — fire and forget if already creating)
              try:
                  boto3.client("lambda").invoke(
                      FunctionName="${EnvironmentName}-wwii-nat-manager",
                      InvocationType="Event",
                      Payload=json.dumps({"action": "create"}).encode(),
                  )
              except Exception as e:
                  logger.warning("NAT create invoke failed: %s", e)
              # Wait for networking stack to be ready (poll up to 3 min)
              _wait_for_networking()
              # Atomic DynamoDB lock — conditional put fails if key exists
              family = TASK_FAMILIES.get(task_def, "unknown")
              lock_key = f"lock#{family}"
              import time
              try:
                  dynamo.put_item(
                      Item={"cache_key": lock_key, "response": str(int(time.time())), "ttl": int(time.time()) + 86400},
                      ConditionExpression="attribute_not_exists(cache_key)",
                  )
              except dynamo.meta.client.exceptions.ConditionalCheckFailedException:
                  # Check if there's actually a running task — if not, lock is stale
                  running = ecs.list_tasks(cluster=CLUSTER, family=family, desiredStatus="RUNNING").get("taskArns", [])
                  if not running:
                      logger.info("Stale lock for %s (no running task), clearing", family)
                      dynamo.delete_item(Key={"cache_key": lock_key})
                      try:
                          dynamo.put_item(
                              Item={"cache_key": lock_key, "response": str(int(time.time())), "ttl": int(time.time()) + 86400},
                              ConditionExpression="attribute_not_exists(cache_key)",
                          )
                      except dynamo.meta.client.exceptions.ConditionalCheckFailedException:
                          logger.info("Another invocation claimed lock for %s, skipping", family)
                          return
                  else:
                      logger.info("Task %s already locked and running, skipping", family)
                      if keys and "phase1" in family:
                          _queue_pending(keys)
                      return
              logger.info("Launching ECS task %s from %s", family, source)
              ecs.run_task(
                  cluster=CLUSTER,
                  taskDefinition=task_def,
                  launchType="FARGATE",
                  count=1,
                  networkConfiguration={"awsvpcConfiguration": {
                      "subnets": SUBNETS,
                      "securityGroups": [SG],
                      "assignPublicIp": "DISABLED",
                  }},
              )

          def _wait_for_networking():
              """Poll for networking stack to be ready. Returns when ready or timeout."""
              import time as _time
              cf = boto3.client("cloudformation")
              stack_name = "${EnvironmentName}-wwii-networking"
              for _ in range(18):  # 3 min max (18 * 10s)
                  try:
                      resp = cf.describe_stacks(StackName=stack_name)
                      status = resp["Stacks"][0]["StackStatus"]
                      if status == "CREATE_COMPLETE" or status == "UPDATE_COMPLETE":
                          logger.info("Networking stack ready")
                          return
                      if "FAILED" in status or "ROLLBACK" in status:
                          logger.warning("Networking stack failed: %s", status)
                          return
                  except cf.exceptions.ClientError:
                      pass  # Stack doesn't exist yet, nat_manager is creating it
                  _time.sleep(10)
              logger.warning("Networking stack not ready after 3 min — launching task anyway")

          def _queue_pending(keys):
              """Queue new content keys in DynamoDB when pipeline is busy."""
              try:
                  resp = dynamo.get_item(Key={"cache_key": "pending#content"})
                  existing = resp.get("Item", {}).get("keys", [])
                  merged = list(set(existing + keys))
                  dynamo.put_item(Item={"cache_key": "pending#content", "keys": merged})
                  logger.info("Queued %d pending content keys (%d total)", len(keys), len(merged))
                  sns = boto3.client("sns")
                  sns.publish(
                      TopicArn=NOTIFY_TOPIC,
                      Subject="WWII Pipeline: Content queued",
                      Message=f"Pipeline is busy. {len(keys)} new files queued for processing.\nTotal pending: {len(merged)}\nFiles: {', '.join(keys[:10])}{'...' if len(keys) > 10 else ''}",
                  )
              except Exception as e:
                  logger.error("Failed to queue pending content: %s", e)

  # --- Hourly stale lock check ---
  StaleLockCheckRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub ${EnvironmentName}-wwii-stale-lock-check
      ScheduleExpression: "rate(1 hour)"
      State: ENABLED
      Targets:
        - Id: TriggerLambda
          Arn: !GetAtt TriggerFunction.Arn
          Input: '{"source": "scheduled", "action": "check_locks"}'

  StaleLockCheckPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref TriggerFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt StaleLockCheckRule.Arn

  # --- Lambda Functions (kept) ---
  OpenSerpManagerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${EnvironmentName}-wwii-openserp-manager
      Runtime: python3.12
      Handler: lambda_handlers.openserp_manager.handler
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Ref LambdaCodeKey
      MemorySize: 256
      Timeout: 120
      Role: !Ref LambdaExecutionRoleArn

  # --- NAT Gateway Manager ---
  NatManagerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${EnvironmentName}-wwii-nat-manager
      Runtime: python3.12
      Handler: lambda_handlers.nat_manager.handler
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Ref LambdaCodeKey
      MemorySize: 128
      Timeout: 300
      Role: !Ref LambdaExecutionRoleArn
      Environment:
        Variables:
          ENV_NAME: !Ref EnvironmentName
          PUBLIC_SUBNET_ID: !Ref PublicSubnet1Id
          PRIVATE_SUBNET_IDS: !Sub "${PrivateSubnet1Id},${PrivateSubnet2Id}"
          VPC_ID: !Ref VpcId
          SECURITY_GROUP_ID: !Ref LambdaSGId
          OPENSERP_SG_ID: !Ref OpenSerpSGId
          CACHE_TABLE: !Ref CacheTableName
          NOTIFICATION_TOPIC_ARN: !Sub arn:aws:sns:${AWS::Region}:${AWS::AccountId}:${EnvironmentName}-wwii-phase2-complete

  # --- Metrics API ---
  MetricsFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${EnvironmentName}-wwii-metrics
      Runtime: python3.12
      Handler: scripts.view_metrics.handler
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Ref LambdaCodeKey
      MemorySize: 256
      Timeout: 30
      Role: !Ref LambdaExecutionRoleArn
      Environment:
        Variables:
          CACHE_TABLE: !Ref CacheTableName

  MetricsApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub ${EnvironmentName}-wwii-metrics-api

  MetricsUnauthorizedResponse:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref MetricsApi
      ResponseType: UNAUTHORIZED
      StatusCode: '401'
      ResponseParameters:
        gatewayresponse.header.WWW-Authenticate: "'Basic realm=\"Metrics\"'"

  MetricsAccessDeniedResponse:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref MetricsApi
      ResponseType: ACCESS_DENIED
      StatusCode: '401'
      ResponseParameters:
        gatewayresponse.header.WWW-Authenticate: "'Basic realm=\"Metrics\"'"

  MetricsAuthorizer:
    Type: AWS::ApiGateway::Authorizer
    Properties:
      Name: BasicAuth
      RestApiId: !Ref MetricsApi
      Type: TOKEN
      AuthorizerUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DedupAuthFunction.Arn}/invocations
      IdentitySource: method.request.header.Authorization
      AuthorizerResultTtlInSeconds: 0

  MetricsAuthInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref DedupAuthFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${MetricsApi}/*

  MetricsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MetricsApi
      ParentId: !GetAtt MetricsApi.RootResourceId
      PathPart: metrics

  MetricsGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref MetricsApi
      ResourceId: !Ref MetricsResource
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref MetricsAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${MetricsFunction.Arn}/invocations

  MetricsInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref MetricsFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${MetricsApi}/*

  MetricsApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - MetricsGetMethod
      - MetricsUnauthorizedResponse
      - MetricsAccessDeniedResponse
    Properties:
      RestApiId: !Ref MetricsApi

  MetricsApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref MetricsApi
      DeploymentId: !Ref MetricsApiDeployment
      StageName: app

  # --- Dedup Review UI ---
  DedupUIFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${EnvironmentName}-wwii-dedup-ui
      Runtime: python3.12
      Handler: lambda_handlers.dedup_ui_handler.handler
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Ref LambdaCodeKey
      MemorySize: 512
      Timeout: 30
      Role: !Ref LambdaExecutionRoleArn
      Environment:
        Variables:
          S3_BUCKET: !Ref DataBucketName
          CACHE_TABLE: !Ref CacheTableName
          DEDUP_COMPLETE_TOPIC_ARN: !Sub arn:aws:sns:${AWS::Region}:${AWS::AccountId}:${EnvironmentName}-wwii-dedup-complete

  DedupGateFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${EnvironmentName}-wwii-dedup-gate
      Runtime: python3.12
      Handler: lambda_handlers.dedup_gate_handler.handler
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Ref LambdaCodeKey
      MemorySize: 256
      Timeout: 300
      Role: !Ref LambdaExecutionRoleArn
      Environment:
        Variables:
          S3_BUCKET: !Ref DataBucketName
          PHASE3_FUNCTION_NAME: !Sub ${EnvironmentName}-wwii-phase3-enrich

  DedupAuthFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${EnvironmentName}-wwii-dedup-auth
      Runtime: python3.12
      Handler: index.handler
      Code:
        ZipFile: |
          import base64
          import os
          def handler(event, context):
              token = event.get('authorizationToken', '')
              expected = os.environ.get('AUTH_TOKEN', '')
              if token.startswith('Basic '):
                  decoded = base64.b64decode(token[6:]).decode()
                  if decoded == expected:
                      return {'principalId': 'user', 'policyDocument': {
                          'Version': '2012-10-17',
                          'Statement': [{'Action': 'execute-api:Invoke', 'Effect': 'Allow',
                                         'Resource': event['methodArn']}]}}
              return {'principalId': 'user', 'policyDocument': {
                  'Version': '2012-10-17',
                  'Statement': [{'Action': 'execute-api:Invoke', 'Effect': 'Deny',
                                 'Resource': event['methodArn']}]}}
      MemorySize: 128
      Timeout: 5
      Role: !Ref LambdaExecutionRoleArn
      Environment:
        Variables:
          AUTH_TOKEN: !Sub '{{resolve:secretsmanager:${EnvironmentName}-wwii-pipeline/dedup-auth}}'

  # --- API Gateway for Dedup UI ---
  DedupApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub ${EnvironmentName}-wwii-dedup-api

  DedupUnauthorizedResponse:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref DedupApi
      ResponseType: UNAUTHORIZED
      StatusCode: '401'
      ResponseParameters:
        gatewayresponse.header.WWW-Authenticate: "'Basic realm=\"Dedup Review\"'"
      ResponseTemplates:
        application/json: '{"message":"Unauthorized"}'

  DedupAccessDeniedResponse:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref DedupApi
      ResponseType: ACCESS_DENIED
      StatusCode: '401'
      ResponseParameters:
        gatewayresponse.header.WWW-Authenticate: "'Basic realm=\"Dedup Review\"'"
      ResponseTemplates:
        application/json: '{"message":"Invalid credentials"}'

  DedupAuthorizer:
    Type: AWS::ApiGateway::Authorizer
    Properties:
      Name: BasicAuth
      RestApiId: !Ref DedupApi
      Type: TOKEN
      AuthorizerUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DedupAuthFunction.Arn}/invocations
      IdentitySource: method.request.header.Authorization
      AuthorizerResultTtlInSeconds: 0

  DedupAuthInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref DedupAuthFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${DedupApi}/*

  DedupResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref DedupApi
      ParentId: !GetAtt DedupApi.RootResourceId
      PathPart: dedup

  DedupProxyResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref DedupApi
      ParentId: !Ref DedupResource
      PathPart: '{proxy+}'

  DedupGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref DedupApi
      ResourceId: !Ref DedupResource
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref DedupAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DedupUIFunction.Arn}/invocations

  DedupProxyMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref DedupApi
      ResourceId: !Ref DedupProxyResource
      HttpMethod: ANY
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref DedupAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DedupUIFunction.Arn}/invocations

  DedupUIInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref DedupUIFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${DedupApi}/*

  DedupApiDeploymentV3:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - DedupGetMethod
      - DedupProxyMethod
      - DedupUnauthorizedResponse
      - DedupAccessDeniedResponse
    Properties:
      RestApiId: !Ref DedupApi

  DedupApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref DedupApi
      DeploymentId: !Ref DedupApiDeploymentV3
      StageName: app

  # --- OpenSERP ECS Service ---
  OpenSerpLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/${EnvironmentName}-wwii-openserp
      RetentionInDays: 14

  OpenSerpTaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub ${EnvironmentName}-wwii-openserp
      Cpu: '512'
      Memory: '1024'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      TaskRoleArn: !Ref ECSTaskRoleArn
      ExecutionRoleArn: !Ref ECSTaskExecutionRoleArn
      ContainerDefinitions:
        - Name: openserp
          Image: !Ref OpenSerpImageUri
          Command: ['serve', '--host', '0.0.0.0', '--port', '7001', '--raw']
          PortMappings:
            - ContainerPort: 7001
              Protocol: tcp
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref OpenSerpLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: openserp
          HealthCheck:
            Command:
              - CMD-SHELL
              - wget -q -O /dev/null http://localhost:7001/health || exit 1
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 60

  # --- Internal ALB for OpenSERP ---
  OpenSerpService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub ${EnvironmentName}-wwii-openserp
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref OpenSerpTaskDef
      DesiredCount: 0
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets:
            - !Ref PrivateSubnet1Id
            - !Ref PrivateSubnet2Id
          SecurityGroups:
            - !Ref OpenSerpSGId

Outputs:
  TriggerFunctionArn:
    Value: !GetAtt TriggerFunction.Arn
  OpenSerpManagerFunctionArn:
    Value: !GetAtt OpenSerpManagerFunction.Arn
  DedupGateFunctionArn:
    Value: !GetAtt DedupGateFunction.Arn
  ECSClusterName:
    Value: !Ref ECSCluster
  Phase1TaskDefArn:
    Value: !Ref Phase1TaskDef
  Phase2TaskDefArn:
    Value: !Ref Phase2TaskDef
  Phase3TaskDefArn:
    Value: !Ref Phase3TaskDef
  ImportTaskDefArn:
    Value: !Ref ImportTaskDef
  OpenSerpServiceName:
    Value: !GetAtt OpenSerpService.Name
  DedupApiUrl:
    Value: !Sub https://${DedupApi}.execute-api.${AWS::Region}.amazonaws.com/app/dedup
  MetricsApiUrl:
    Value: !Sub https://${MetricsApi}.execute-api.${AWS::Region}.amazonaws.com/app/metrics
