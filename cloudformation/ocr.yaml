AWSTemplateFormatVersion: '2010-09-09'
Description: WWII Pipeline - OCR Standalone (AWS Batch with GPU for Chandra OCR)

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
  PrivateSubnetIds:
    Type: CommaDelimitedList
    Description: Private subnet IDs in GPU-capable AZs
  SecurityGroupId:
    Type: String
  ChandraImageUri:
    Type: String
    Description: ECR image URI for Chandra OCR container
  PaddleImageUri:
    Type: String
    Default: ""
    Description: >-
      ECR image URI for the PP-StructureV3 table-recovery container. Optional:
      leave empty to skip creating the Paddle job definition (Chandra-only
      deploys). When set, a job def sharing the same GPU compute env/queue is
      created.
  DataBucketName:
    Type: String
    Default: dev-wwii-data-pipeline
  MaxvCpus:
    Type: Number
    Default: 280
    Description: Maximum vCPUs across all Batch instances
  OnDemandMaxvCpus:
    Type: Number
    Default: 96
    Description: Max vCPUs for the on-demand fallback CE (roomy 768 G/VT on-demand quota)
  LambdaCodeBucket:
    Type: String
    Default: ""
    Description: S3 bucket holding the Lambda code zip (for the OCR spot controller)
  LambdaCodeKey:
    Type: String
    Default: lambda/code.zip
    Description: S3 key of the Lambda code zip
  SpotBidPercent:
    Type: Number
    Default: 70
    Description: Max percentage of on-demand price for Spot instances
  ComputeType:
    Type: String
    Default: EC2
    AllowedValues: [EC2, SPOT]
    Description: Compute type - EC2 (on-demand) or SPOT

Conditions:
  IsSpot: !Equals [!Ref ComputeType, SPOT]
  HasLambdaCode: !Not [!Equals [!Ref LambdaCodeBucket, ""]]
  HasPaddleImage: !Not [!Equals [!Ref PaddleImageUri, ""]]

Resources:
  # --- Log Group ---
  ChandraLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/batch/${EnvironmentName}-wwii-chandra
      RetentionInDays: 14

  PaddleLogGroup:
    Condition: HasPaddleImage
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/batch/${EnvironmentName}-wwii-paddle
      RetentionInDays: 14

  # --- IAM Roles ---
  BatchServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${EnvironmentName}-wwii-batch-service-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: batch.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSBatchServiceRole

  BatchInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${EnvironmentName}-wwii-batch-instance-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEC2ContainerServiceforEC2Role
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  BatchInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub ${EnvironmentName}-wwii-batch-instance-profile
      Roles:
        - !Ref BatchInstanceRole

  BatchJobRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${EnvironmentName}-wwii-batch-job-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ChandraJobPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                Resource:
                  - !Sub arn:aws:s3:::${DataBucketName}
                  - !Sub arn:aws:s3:::${DataBucketName}/*
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/batch/${EnvironmentName}-wwii-chandra:*
                  - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/batch/${EnvironmentName}-wwii-paddle:*

  BatchExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${EnvironmentName}-wwii-batch-execution-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  # --- Launch Template (larger root volume for big Docker images) ---
  ChandraLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub ${EnvironmentName}-wwii-chandra-lt
      LaunchTemplateData:
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeSize: 100
              VolumeType: gp3
              DeleteOnTermination: true

  # --- Batch Compute Environment ---
  ChandraComputeEnv:
    Type: AWS::Batch::ComputeEnvironment
    Properties:
      # Name includes the compute type so an EC2<->SPOT switch REPLACES the CE
      # cleanly — Batch CE Type is immutable, and CFN can't in-place replace a
      # custom-named resource. Changing the name lets CFN create the new CE,
      # repoint the queue's !Ref, then delete the old one.
      ComputeEnvironmentName: !Sub
        - ${EnvironmentName}-wwii-chandra-gpu-${TypeLower}-v3
        - TypeLower: !If [IsSpot, spot, ec2]
      Type: MANAGED
      State: ENABLED
      # No ServiceRole -> AWS Batch uses the AWSServiceRoleForBatch service-linked
      # role, which is REQUIRED for SPOT_CAPACITY_OPTIMIZED spot provisioning +
      # instance tagging. A custom service role + SpotIamFleetRole is the legacy
      # spot-fleet model and does NOT reliably provision under CAPACITY_OPTIMIZED
      # (healthy CE, desired>0, but zero spot requests — the observed stall).
      ComputeResources:
        Type: !Ref ComputeType
        AllocationStrategy: !If [IsSpot, SPOT_CAPACITY_OPTIMIZED, BEST_FIT_PROGRESSIVE]
        BidPercentage: !Ref SpotBidPercent
        MaxvCpus: !Ref MaxvCpus
        MinvCpus: 0
        DesiredvCpus: 0
        InstanceTypes:
          # Forgiving GPU pool (§2): ANY instance meeting the Chandra job spec
          # (1 GPU, 4 vCPU, ~15GB) — widened beyond g5/g6 to g4dn so
          # SPOT_CAPACITY_OPTIMIZED draws from the deepest available spot pool.
          # All are 1-GPU/4-vCPU/16GB (xlarge) fitting one job; 2xlarge variants
          # fit too (Batch bin-packs, may co-locate on larger hosts).
          - g4dn.xlarge
          - g4dn.2xlarge
          - g5.xlarge
          - g5.2xlarge
          - g6.xlarge
          - g6.2xlarge
        Subnets: !Ref PrivateSubnetIds
        SecurityGroupIds:
          - !Ref SecurityGroupId
        InstanceRole: !GetAtt BatchInstanceProfile.Arn
        LaunchTemplate:
          LaunchTemplateId: !Ref ChandraLaunchTemplate
          Version: $Latest
        Ec2Configuration:
          # AL2 is EOL — Batch blocks new CEs on ECS_AL2_NVIDIA. AL2023 GPU AMI.
          - ImageType: ECS_AL2023_NVIDIA
        Tags:
          Name: !Sub ${EnvironmentName}-wwii-chandra

  # --- Job Queue ---
  ChandraJobQueue:
    Type: AWS::Batch::JobQueue
    Properties:
      JobQueueName: !Sub ${EnvironmentName}-wwii-chandra-gpu
      State: ENABLED
      Priority: 1
      ComputeEnvironmentOrder:
        - ComputeEnvironment: !Ref ChandraComputeEnv
          Order: 1

  # --- On-demand fallback CE + queue (Option B controller target) ---
  # Always on-demand (EC2), separate from the primary SPOT queue. The custom
  # controller resubmits spot-starved jobs here (roomy 768 G/VT on-demand quota),
  # capped at 48h cumulative on-demand. Kept as its own queue (not an order-2 CE
  # on the spot queue) so the controller owns the spot->on-demand decision
  # explicitly (operator chose the custom controller over native ordered fallback).
  ChandraOnDemandComputeEnv:
    Type: AWS::Batch::ComputeEnvironment
    Properties:
      ComputeEnvironmentName: !Sub ${EnvironmentName}-wwii-chandra-gpu-ondemand-v3
      Type: MANAGED
      State: ENABLED
      # No ServiceRole -> AWSServiceRoleForBatch SLR (current best practice).
      ComputeResources:
        Type: EC2
        AllocationStrategy: BEST_FIT_PROGRESSIVE
        MaxvCpus: !Ref OnDemandMaxvCpus
        MinvCpus: 0
        DesiredvCpus: 0
        InstanceTypes:
          - g4dn.xlarge
          - g4dn.2xlarge
          - g5.xlarge
          - g5.2xlarge
          - g6.xlarge
          - g6.2xlarge
        Subnets: !Ref PrivateSubnetIds
        SecurityGroupIds:
          - !Ref SecurityGroupId
        InstanceRole: !GetAtt BatchInstanceProfile.Arn
        LaunchTemplate:
          LaunchTemplateId: !Ref ChandraLaunchTemplate
          Version: $Latest
        Ec2Configuration:
          - ImageType: ECS_AL2023_NVIDIA
        Tags:
          Name: !Sub ${EnvironmentName}-wwii-chandra-ondemand

  ChandraOnDemandJobQueue:
    Type: AWS::Batch::JobQueue
    Properties:
      JobQueueName: !Sub ${EnvironmentName}-wwii-chandra-gpu-ondemand
      State: ENABLED
      Priority: 1
      ComputeEnvironmentOrder:
        - ComputeEnvironment: !Ref ChandraOnDemandComputeEnv
          Order: 1

  # --- High-VRAM escalation CE + queue (OOM recovery) ---
  # A job that OOMs on a 16GB g4dn is resubmitted here by the controller. This
  # pool is restricted to 24GB-VRAM instances (g5/g6, EXCLUDING g4dn) so the
  # retry runs with enough GPU memory. On-demand (immediate placement; OOM
  # recovery should not wait on spot). Analogous to the spot->on-demand queue —
  # a distinct queue so the controller owns the escalation decision explicitly.
  ChandraHighVramComputeEnv:
    Type: AWS::Batch::ComputeEnvironment
    Properties:
      ComputeEnvironmentName: !Sub ${EnvironmentName}-wwii-chandra-gpu-highvram-v1
      Type: MANAGED
      State: ENABLED
      ComputeResources:
        Type: EC2
        AllocationStrategy: BEST_FIT_PROGRESSIVE
        MaxvCpus: !Ref OnDemandMaxvCpus
        MinvCpus: 0
        DesiredvCpus: 0
        InstanceTypes:
          # 24GB-VRAM only — g4dn (16GB) deliberately excluded (it OOM'd).
          - g5.xlarge
          - g5.2xlarge
          - g6.xlarge
          - g6.2xlarge
        Subnets: !Ref PrivateSubnetIds
        SecurityGroupIds:
          - !Ref SecurityGroupId
        InstanceRole: !GetAtt BatchInstanceProfile.Arn
        LaunchTemplate:
          LaunchTemplateId: !Ref ChandraLaunchTemplate
          Version: $Latest
        Ec2Configuration:
          - ImageType: ECS_AL2023_NVIDIA
        Tags:
          Name: !Sub ${EnvironmentName}-wwii-chandra-highvram

  ChandraHighVramJobQueue:
    Type: AWS::Batch::JobQueue
    Properties:
      JobQueueName: !Sub ${EnvironmentName}-wwii-chandra-gpu-highvram
      State: ENABLED
      Priority: 1
      ComputeEnvironmentOrder:
        - ComputeEnvironment: !Ref ChandraHighVramComputeEnv
          Order: 1

  # --- Job Definition ---
  ChandraJobDef:
    Type: AWS::Batch::JobDefinition
    Properties:
      JobDefinitionName: !Sub ${EnvironmentName}-wwii-chandra
      Type: container
      ContainerProperties:
        Image: !Ref ChandraImageUri
        ResourceRequirements:
          - Type: VCPU
            Value: "4"
          - Type: MEMORY
            Value: "15000"
          - Type: GPU
            Value: "1"
        ExecutionRoleArn: !GetAtt BatchExecutionRole.Arn
        JobRoleArn: !GetAtt BatchJobRole.Arn
        LogConfiguration:
          LogDriver: awslogs
          Options:
            awslogs-group: !Ref ChandraLogGroup
            awslogs-region: !Ref AWS::Region
        Environment:
          - Name: AWS_REGION
            Value: !Ref AWS::Region
          - Name: DATA_BUCKET
            Value: !Ref DataBucketName
          - Name: PYTORCH_CUDA_ALLOC_CONF
            Value: expandable_segments:True
          # Progress-watchdog: fail the job if no page completes within this many
          # seconds (see scripts/ocr_watchdog.py). This — NOT the wall-clock
          # AttemptDurationSeconds below — is the primary failure detector.
          - Name: OCR_NO_PROGRESS_SECS
            Value: "900"
      RetryStrategy:
        Attempts: 2
      Timeout:
        # Loose absolute backstop / cost circuit-breaker only. Healthy-but-slow
        # dense scanned chunks legitimately exceed 1h; the progress-watchdog
        # (OCR_NO_PROGRESS_SECS) is what catches genuine stalls quickly.
        AttemptDurationSeconds: 14400

  # --- Paddle (PP-StructureV3) Job Definition ---
  # Table-recovery worker for Chandra's flattened 2-D tables. Shares the same
  # GPU compute environment and job queue as Chandra (both A10G) — only a
  # distinct job definition + log group are needed. Created only when a Paddle
  # image URI is supplied.
  PaddleJobDef:
    Condition: HasPaddleImage
    Type: AWS::Batch::JobDefinition
    Properties:
      JobDefinitionName: !Sub ${EnvironmentName}-wwii-paddle
      Type: container
      ContainerProperties:
        Image: !Ref PaddleImageUri
        ResourceRequirements:
          - Type: VCPU
            Value: "4"
          - Type: MEMORY
            Value: "15000"
          - Type: GPU
            Value: "1"
        ExecutionRoleArn: !GetAtt BatchExecutionRole.Arn
        JobRoleArn: !GetAtt BatchJobRole.Arn
        LogConfiguration:
          LogDriver: awslogs
          Options:
            awslogs-group: !Ref PaddleLogGroup
            awslogs-region: !Ref AWS::Region
        Environment:
          - Name: AWS_REGION
            Value: !Ref AWS::Region
          - Name: DATA_BUCKET
            Value: !Ref DataBucketName
      RetryStrategy:
        Attempts: 2
      Timeout:
        AttemptDurationSeconds: 3600

  # --- OCR SPOT controller (Option B): hourly spot-retry / 48h on-demand cap ---
  OcrSpotControllerRole:
    Type: AWS::IAM::Role
    Condition: HasLambdaCode
    Properties:
      RoleName: !Sub ${EnvironmentName}-wwii-ocr-controller-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ocr-controller
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - batch:ListJobs
                  - batch:DescribeJobs
                  - batch:SubmitJob
                  - batch:TerminateJob
                Resource: '*'
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:Scan]
                Resource: !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${EnvironmentName}-wwii-api-cache
              - Effect: Allow
                Action: servicequotas:GetServiceQuota
                Resource: '*'
              - Effect: Allow
                Action: sns:Publish
                Resource: !Sub arn:aws:sns:${AWS::Region}:${AWS::AccountId}:${EnvironmentName}-wwii-phase2-complete

  OcrSpotControllerFunction:
    Type: AWS::Lambda::Function
    Condition: HasLambdaCode
    Properties:
      FunctionName: !Sub ${EnvironmentName}-wwii-ocr-spot-controller
      Runtime: python3.12
      Handler: lambda_handlers.ocr_spot_controller.handler
      Role: !GetAtt OcrSpotControllerRole.Arn
      Timeout: 120
      MemorySize: 256
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Ref LambdaCodeKey
      Environment:
        Variables:
          ENV_NAME: !Ref EnvironmentName
          CACHE_TABLE: !Sub ${EnvironmentName}-wwii-api-cache
          OCR_SPOT_QUEUE: !Sub ${EnvironmentName}-wwii-chandra-gpu
          OCR_ONDEMAND_QUEUE: !Sub ${EnvironmentName}-wwii-chandra-gpu-ondemand
          OCR_HIGHVRAM_QUEUE: !Sub ${EnvironmentName}-wwii-chandra-gpu-highvram
          OCR_JOB_DEF: !Sub ${EnvironmentName}-wwii-chandra
          # Publishes free-form alerts to phase2-complete -> fans to EMAIL (direct)
          # + SLACK (via the slack-formatter -> chatbot). Both channels (§operator).
          NOTIFICATION_TOPIC_ARN: !Sub arn:aws:sns:${AWS::Region}:${AWS::AccountId}:${EnvironmentName}-wwii-phase2-complete

  OcrSpotControllerSchedule:
    Type: AWS::Events::Rule
    Condition: HasLambdaCode
    Properties:
      Name: !Sub ${EnvironmentName}-wwii-ocr-spot-controller-hourly
      ScheduleExpression: rate(1 hour)
      State: ENABLED
      Targets:
        - Arn: !GetAtt OcrSpotControllerFunction.Arn
          Id: ocr-spot-controller

  OcrSpotControllerInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: HasLambdaCode
    Properties:
      FunctionName: !Ref OcrSpotControllerFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt OcrSpotControllerSchedule.Arn

Outputs:
  JobQueueName:
    Value: !Ref ChandraJobQueue
  JobDefinitionName:
    Value: !Ref ChandraJobDef
  ComputeEnvironmentName:
    Value: !Ref ChandraComputeEnv
  PaddleJobDefinitionName:
    Condition: HasPaddleImage
    Value: !Ref PaddleJobDef
