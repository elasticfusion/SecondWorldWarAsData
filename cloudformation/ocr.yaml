AWSTemplateFormatVersion: '2010-09-09'
Description: WWII Pipeline - OCR Standalone (AWS Batch with GPU for Chandra OCR)

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
  PrivateSubnetIds:
    Type: CommaDelimitedList
    Description: Private subnet IDs in GPU-capable AZs
  SecurityGroupId:
    Type: String
  ChandraImageUri:
    Type: String
    Description: ECR image URI for Chandra OCR container
  PaddleImageUri:
    Type: String
    Default: ""
    Description: >-
      ECR image URI for the PP-StructureV3 table-recovery container. Optional:
      leave empty to skip creating the Paddle job definition (Chandra-only
      deploys). When set, a job def sharing the same GPU compute env/queue is
      created.
  DataBucketName:
    Type: String
    Default: dev-wwii-data-pipeline
  MaxvCpus:
    Type: Number
    Default: 280
    Description: Maximum vCPUs across all Batch instances
  OnDemandMaxvCpus:
    Type: Number
    Default: 96
    Description: Max vCPUs for the on-demand fallback CE (roomy 768 G/VT on-demand quota)
  LambdaCodeBucket:
    Type: String
    Default: ""
    Description: S3 bucket holding the Lambda code zip (for the OCR spot controller)
  LambdaCodeKey:
    Type: String
    Default: lambda/code.zip
    Description: S3 key of the Lambda code zip
  SpotBidPercent:
    Type: Number
    Default: 70
    Description: Max percentage of on-demand price for Spot instances
  ComputeType:
    Type: String
    Default: EC2
    AllowedValues: [EC2, SPOT]
    Description: Compute type - EC2 (on-demand) or SPOT
  # --- The Spot price ladder (task 1.1d, src/utils/gpu_ladder) ---
  # One Spot compute environment + queue per rung (Batch cannot be told an instance type, only a
  # queue). Rung 0 is the ORIGINAL type: its on-demand hourly price is the cap for every rung, and
  # the on-demand fallback holds this type only. Any type that can run the job works (one GPU of
  # 24 GB-class memory, 4 vCPU, 15000 MiB: the job definition); the controller re-checks each type
  # against describe_instance_types before using it, so an unsuitable type here is never used.
  GpuRung0Type:
    Type: String
    Default: g5.xlarge
    AllowedPattern: '^[a-z0-9]{2,12}\.[a-z0-9]{3,12}$'
    Description: ORIGINAL instance type (rung 0), the cap is its on-demand hourly price
  GpuRung1Type:
    Type: String
    Default: g6.xlarge
    AllowedPattern: '^[a-z0-9]{2,12}\.[a-z0-9]{3,12}$'
    Description: Spot rung 1 (a different capacity pool, used while its Spot price is at or under the cap)
  GpuRung2Type:
    Type: String
    Default: g5.2xlarge
    AllowedPattern: '^[a-z0-9]{2,12}\.[a-z0-9]{3,12}$'
    Description: Spot rung 2
  GpuRung3Type:
    Type: String
    Default: g6.2xlarge
    AllowedPattern: '^[a-z0-9]{2,12}\.[a-z0-9]{3,12}$'
    Description: Spot rung 3

Conditions:
  IsSpot: !Equals [!Ref ComputeType, SPOT]
  HasLambdaCode: !Not [!Equals [!Ref LambdaCodeBucket, ""]]
  HasPaddleImage: !Not [!Equals [!Ref PaddleImageUri, ""]]

Resources:
  # --- Log Group ---
  ChandraLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/batch/${EnvironmentName}-wwii-chandra
      RetentionInDays: 14

  PaddleLogGroup:
    Condition: HasPaddleImage
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/batch/${EnvironmentName}-wwii-paddle
      RetentionInDays: 14

  # --- IAM Roles ---
  BatchServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${EnvironmentName}-wwii-batch-service-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: batch.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSBatchServiceRole

  BatchInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${EnvironmentName}-wwii-batch-instance-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEC2ContainerServiceforEC2Role
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  BatchInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub ${EnvironmentName}-wwii-batch-instance-profile
      Roles:
        - !Ref BatchInstanceRole

  BatchJobRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${EnvironmentName}-wwii-batch-job-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ChandraJobPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                Resource:
                  - !Sub arn:aws:s3:::${DataBucketName}
                  - !Sub arn:aws:s3:::${DataBucketName}/*
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/batch/${EnvironmentName}-wwii-chandra:*
                  - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/batch/${EnvironmentName}-wwii-paddle:*

  BatchExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${EnvironmentName}-wwii-batch-execution-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  # --- Launch Template (larger root volume for big Docker images) ---
  ChandraLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub ${EnvironmentName}-wwii-chandra-lt
      LaunchTemplateData:
        # Enforce IMDSv2 (token-required) + minimal hop limit so a compromised process /
        # SSRF on the GPU OCR instance cannot steal the instance role credentials from the
        # metadata endpoint (IMDSv1 credential-theft class; checkov CKV_AWS_79). These
        # instances fetch untrusted scanned source documents, so the metadata surface must be
        # locked down.
        MetadataOptions:
          HttpTokens: required
          HttpEndpoint: enabled
          HttpPutResponseHopLimit: 1
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeSize: 100
              VolumeType: gp3
              DeleteOnTermination: true
              # Encrypt the GPU OCR instance volume at rest — these instances
              # write the raw scanned source documents + OCR output to local disk
              # during processing. Uses the AWS-managed EBS key (no KMS cost/mgmt),
              # consistent with the SSE-S3 choice. (Fargate tasks already auto-
              # encrypt ephemeral storage; this closes the EC2-backed GPU gap.)
              Encrypted: true

  # --- Batch Compute Environment ---
  ChandraComputeEnv:
    Type: AWS::Batch::ComputeEnvironment
    Properties:
      # Name includes the compute type so an EC2<->SPOT switch REPLACES the CE
      # cleanly — Batch CE Type is immutable, and CFN can't in-place replace a
      # custom-named resource. Changing the name lets CFN create the new CE,
      # repoint the queue's !Ref, then delete the old one.
      ComputeEnvironmentName: !Sub
        - ${EnvironmentName}-wwii-chandra-gpu-${TypeLower}-v5
        - TypeLower: !If [IsSpot, spot, ec2]
      Type: MANAGED
      State: ENABLED
      # No ServiceRole -> AWS Batch uses the AWSServiceRoleForBatch service-linked
      # role, which is REQUIRED for SPOT_CAPACITY_OPTIMIZED spot provisioning +
      # instance tagging. A custom service role + SpotIamFleetRole is the legacy
      # spot-fleet model and does NOT reliably provision under CAPACITY_OPTIMIZED
      # (healthy CE, desired>0, but zero spot requests — the observed stall).
      ComputeResources:
        Type: !Ref ComputeType
        AllocationStrategy: !If [IsSpot, SPOT_CAPACITY_OPTIMIZED, BEST_FIT_PROGRESSIVE]
        BidPercentage: !Ref SpotBidPercent
        MaxvCpus: !Ref MaxvCpus
        MinvCpus: 0
        DesiredvCpus: 0
        InstanceTypes:
          # Rung 0, the ORIGINAL type (see GpuRung0Type). 24GB-VRAM floor, EMPIRICAL: Chandra needs
          # ~9-10GB GPU per page REGARDLESS of page size - a 16GB g4dn OOMs on essentially any page
          # (B406 11-page AND B400 6-page) - so such a type is broken capacity for this model, not
          # cheaper capacity.
          - !Ref GpuRung0Type
        Subnets: !Ref PrivateSubnetIds
        SecurityGroupIds:
          - !Ref SecurityGroupId
        InstanceRole: !GetAtt BatchInstanceProfile.Arn
        LaunchTemplate:
          LaunchTemplateId: !Ref ChandraLaunchTemplate
          Version: $Latest
        Ec2Configuration:
          # AL2 is EOL — Batch blocks new CEs on ECS_AL2_NVIDIA. AL2023 GPU AMI.
          - ImageType: ECS_AL2023_NVIDIA
        Tags:
          Name: !Sub ${EnvironmentName}-wwii-chandra

  # --- Job Queue ---
  ChandraJobQueue:
    Type: AWS::Batch::JobQueue
    Properties:
      JobQueueName: !Sub ${EnvironmentName}-wwii-chandra-gpu
      State: ENABLED
      Priority: 1
      ComputeEnvironmentOrder:
        - ComputeEnvironment: !Ref ChandraComputeEnv
          Order: 1

  # --- Spot rung 1 (task 1.1d): its own compute environment + queue ---
  ChandraComputeEnvR1:
    Type: AWS::Batch::ComputeEnvironment
    Condition: IsSpot
    Properties:
      ComputeEnvironmentName: !Sub ${EnvironmentName}-wwii-chandra-gpu-spot-r1-v5
      Type: MANAGED
      State: ENABLED
      ComputeResources:
        Type: SPOT
        AllocationStrategy: SPOT_CAPACITY_OPTIMIZED
        BidPercentage: !Ref SpotBidPercent
        MaxvCpus: !Ref MaxvCpus
        MinvCpus: 0
        DesiredvCpus: 0
        InstanceTypes:
          - !Ref GpuRung1Type
        Subnets: !Ref PrivateSubnetIds
        SecurityGroupIds:
          - !Ref SecurityGroupId
        InstanceRole: !GetAtt BatchInstanceProfile.Arn
        LaunchTemplate:
          LaunchTemplateId: !Ref ChandraLaunchTemplate
          Version: $Latest
        Ec2Configuration:
          - ImageType: ECS_AL2023_NVIDIA
        Tags:
          Name: !Sub ${EnvironmentName}-wwii-chandra-r1

  ChandraJobQueueR1:
    Type: AWS::Batch::JobQueue
    Condition: IsSpot
    Properties:
      JobQueueName: !Sub ${EnvironmentName}-wwii-chandra-gpu-r1
      State: ENABLED
      Priority: 1
      ComputeEnvironmentOrder:
        - ComputeEnvironment: !Ref ChandraComputeEnvR1
          Order: 1

  # --- Spot rung 2 (task 1.1d): its own compute environment + queue ---
  ChandraComputeEnvR2:
    Type: AWS::Batch::ComputeEnvironment
    Condition: IsSpot
    Properties:
      ComputeEnvironmentName: !Sub ${EnvironmentName}-wwii-chandra-gpu-spot-r2-v5
      Type: MANAGED
      State: ENABLED
      ComputeResources:
        Type: SPOT
        AllocationStrategy: SPOT_CAPACITY_OPTIMIZED
        BidPercentage: !Ref SpotBidPercent
        MaxvCpus: !Ref MaxvCpus
        MinvCpus: 0
        DesiredvCpus: 0
        InstanceTypes:
          - !Ref GpuRung2Type
        Subnets: !Ref PrivateSubnetIds
        SecurityGroupIds:
          - !Ref SecurityGroupId
        InstanceRole: !GetAtt BatchInstanceProfile.Arn
        LaunchTemplate:
          LaunchTemplateId: !Ref ChandraLaunchTemplate
          Version: $Latest
        Ec2Configuration:
          - ImageType: ECS_AL2023_NVIDIA
        Tags:
          Name: !Sub ${EnvironmentName}-wwii-chandra-r2

  ChandraJobQueueR2:
    Type: AWS::Batch::JobQueue
    Condition: IsSpot
    Properties:
      JobQueueName: !Sub ${EnvironmentName}-wwii-chandra-gpu-r2
      State: ENABLED
      Priority: 1
      ComputeEnvironmentOrder:
        - ComputeEnvironment: !Ref ChandraComputeEnvR2
          Order: 1

  # --- Spot rung 3 (task 1.1d): its own compute environment + queue ---
  ChandraComputeEnvR3:
    Type: AWS::Batch::ComputeEnvironment
    Condition: IsSpot
    Properties:
      ComputeEnvironmentName: !Sub ${EnvironmentName}-wwii-chandra-gpu-spot-r3-v5
      Type: MANAGED
      State: ENABLED
      ComputeResources:
        Type: SPOT
        AllocationStrategy: SPOT_CAPACITY_OPTIMIZED
        BidPercentage: !Ref SpotBidPercent
        MaxvCpus: !Ref MaxvCpus
        MinvCpus: 0
        DesiredvCpus: 0
        InstanceTypes:
          - !Ref GpuRung3Type
        Subnets: !Ref PrivateSubnetIds
        SecurityGroupIds:
          - !Ref SecurityGroupId
        InstanceRole: !GetAtt BatchInstanceProfile.Arn
        LaunchTemplate:
          LaunchTemplateId: !Ref ChandraLaunchTemplate
          Version: $Latest
        Ec2Configuration:
          - ImageType: ECS_AL2023_NVIDIA
        Tags:
          Name: !Sub ${EnvironmentName}-wwii-chandra-r3

  ChandraJobQueueR3:
    Type: AWS::Batch::JobQueue
    Condition: IsSpot
    Properties:
      JobQueueName: !Sub ${EnvironmentName}-wwii-chandra-gpu-r3
      State: ENABLED
      Priority: 1
      ComputeEnvironmentOrder:
        - ComputeEnvironment: !Ref ChandraComputeEnvR3
          Order: 1

  # --- On-demand fallback CE + queue (Option B controller target) ---
  # Always on-demand (EC2), separate from the primary SPOT queue. The custom
  # controller resubmits spot-starved jobs here (roomy 768 G/VT on-demand quota),
  # capped at 48h cumulative on-demand. Kept as its own queue (not an order-2 CE
  # on the spot queue) so the controller owns the spot->on-demand decision
  # explicitly (operator chose the custom controller over native ordered fallback).
  ChandraOnDemandComputeEnv:
    Type: AWS::Batch::ComputeEnvironment
    Properties:
      ComputeEnvironmentName: !Sub ${EnvironmentName}-wwii-chandra-gpu-ondemand-v5
      Type: MANAGED
      State: ENABLED
      # No ServiceRole -> AWSServiceRoleForBatch SLR (current best practice).
      ComputeResources:
        Type: EC2
        AllocationStrategy: BEST_FIT_PROGRESSIVE
        MaxvCpus: !Ref OnDemandMaxvCpus
        MinvCpus: 0
        DesiredvCpus: 0
        InstanceTypes:
          # The ORIGINAL type only (owner 1.1d): the on-demand fallback is never priced above the
          # original type's on-demand hourly price.
          - !Ref GpuRung0Type
        Subnets: !Ref PrivateSubnetIds
        SecurityGroupIds:
          - !Ref SecurityGroupId
        InstanceRole: !GetAtt BatchInstanceProfile.Arn
        LaunchTemplate:
          LaunchTemplateId: !Ref ChandraLaunchTemplate
          Version: $Latest
        Ec2Configuration:
          - ImageType: ECS_AL2023_NVIDIA
        Tags:
          Name: !Sub ${EnvironmentName}-wwii-chandra-ondemand

  ChandraOnDemandJobQueue:
    Type: AWS::Batch::JobQueue
    Properties:
      JobQueueName: !Sub ${EnvironmentName}-wwii-chandra-gpu-ondemand
      State: ENABLED
      Priority: 1
      ComputeEnvironmentOrder:
        - ComputeEnvironment: !Ref ChandraOnDemandComputeEnv
          Order: 1

  # --- Job Definition ---
  ChandraJobDef:
    Type: AWS::Batch::JobDefinition
    Properties:
      JobDefinitionName: !Sub ${EnvironmentName}-wwii-chandra
      Type: container
      ContainerProperties:
        Image: !Ref ChandraImageUri
        ResourceRequirements:
          - Type: VCPU
            Value: "4"
          - Type: MEMORY
            Value: "15000"
          - Type: GPU
            Value: "1"
        ExecutionRoleArn: !GetAtt BatchExecutionRole.Arn
        JobRoleArn: !GetAtt BatchJobRole.Arn
        LogConfiguration:
          LogDriver: awslogs
          Options:
            awslogs-group: !Ref ChandraLogGroup
            awslogs-region: !Ref AWS::Region
        Environment:
          - Name: AWS_REGION
            Value: !Ref AWS::Region
          - Name: DATA_BUCKET
            Value: !Ref DataBucketName
          - Name: PYTORCH_CUDA_ALLOC_CONF
            Value: expandable_segments:True
          # Progress-watchdog: fail the job if no page completes within this many
          # seconds (see scripts/ocr_watchdog.py). This — NOT the wall-clock
          # AttemptDurationSeconds below — is the primary failure detector.
          - Name: OCR_NO_PROGRESS_SECS
            Value: "900"
      # Task 1.1d: with the OCR spot controller, a Spot RECLAIM ("Host EC2 ... terminated") is not
      # retried on the same queue: the job fails and the controller resubmits it one rung up the
      # price ladder (or on-demand). Every other failure keeps the 2 attempts.
      RetryStrategy: !If
        - HasLambdaCode
        - Attempts: 2
          EvaluateOnExit:
            - Action: EXIT
              OnStatusReason: 'Host EC2*'
        - Attempts: 2
      Timeout:
        # Loose absolute backstop / cost circuit-breaker only. Healthy-but-slow
        # dense scanned chunks legitimately exceed 1h; the progress-watchdog
        # (OCR_NO_PROGRESS_SECS) is what catches genuine stalls quickly.
        AttemptDurationSeconds: 14400

  # --- Paddle (PP-StructureV3) Job Definition ---
  # Table-recovery worker for Chandra's flattened 2-D tables. Shares the same
  # GPU compute environment and job queue as Chandra (both A10G) — only a
  # distinct job definition + log group are needed. Created only when a Paddle
  # image URI is supplied.
  PaddleJobDef:
    Condition: HasPaddleImage
    Type: AWS::Batch::JobDefinition
    Properties:
      JobDefinitionName: !Sub ${EnvironmentName}-wwii-paddle
      Type: container
      ContainerProperties:
        Image: !Ref PaddleImageUri
        ResourceRequirements:
          - Type: VCPU
            Value: "4"
          - Type: MEMORY
            Value: "15000"
          - Type: GPU
            Value: "1"
        ExecutionRoleArn: !GetAtt BatchExecutionRole.Arn
        JobRoleArn: !GetAtt BatchJobRole.Arn
        LogConfiguration:
          LogDriver: awslogs
          Options:
            awslogs-group: !Ref PaddleLogGroup
            awslogs-region: !Ref AWS::Region
        Environment:
          - Name: AWS_REGION
            Value: !Ref AWS::Region
          - Name: DATA_BUCKET
            Value: !Ref DataBucketName
      RetryStrategy:
        Attempts: 2
      Timeout:
        AttemptDurationSeconds: 3600

  # --- OCR SPOT controller (Option B): hourly spot-retry / 48h on-demand cap ---
  OcrSpotControllerRole:
    Type: AWS::IAM::Role
    Condition: HasLambdaCode
    Properties:
      RoleName: !Sub ${EnvironmentName}-wwii-ocr-controller-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ocr-controller
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # ListJobs/DescribeJobs are read-only and do not support resource-level scoping
              # (DescribeJobs takes job IDs; ListJobs filters by queue in the request) — keep '*'.
              - Effect: Allow
                Action:
                  - batch:ListJobs
                  - batch:DescribeJobs
                Resource: '*'
              # SubmitJob is the privileged write: scope it to THIS env's job queues + job
              # definitions so the controller cannot submit into arbitrary account-wide queues
              # (checkov CKV_AWS_111). SubmitJob authorizes against both the queue and the
              # job-definition ARN, so both are listed.
              - Effect: Allow
                Action: batch:SubmitJob
                Resource:
                  - !Sub arn:aws:batch:${AWS::Region}:${AWS::AccountId}:job-queue/${EnvironmentName}-wwii-chandra-gpu
                  - !Sub arn:aws:batch:${AWS::Region}:${AWS::AccountId}:job-queue/${EnvironmentName}-wwii-chandra-gpu-ondemand
                  - !Sub arn:aws:batch:${AWS::Region}:${AWS::AccountId}:job-queue/${EnvironmentName}-wwii-chandra-gpu-r1
                  - !Sub arn:aws:batch:${AWS::Region}:${AWS::AccountId}:job-queue/${EnvironmentName}-wwii-chandra-gpu-r2
                  - !Sub arn:aws:batch:${AWS::Region}:${AWS::AccountId}:job-queue/${EnvironmentName}-wwii-chandra-gpu-r3
                  - !Sub arn:aws:batch:${AWS::Region}:${AWS::AccountId}:job-definition/${EnvironmentName}-wwii-chandra:*
              # TerminateJob targets a job by its server-assigned job ID (job/*), which cannot be
              # restricted by queue/name; scope it to this account+region's Batch jobs.
              - Effect: Allow
                Action: batch:TerminateJob
                Resource: !Sub arn:aws:batch:${AWS::Region}:${AWS::AccountId}:job/*
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:Scan]
                Resource: !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${EnvironmentName}-wwii-api-cache
              - Sid: NoCreditGateWrites
                # task 1.1e: the trigger trusts these items for launch decisions; this role has no reason to write them
                Effect: Deny
                Action: [dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:BatchWriteItem]
                Resource: !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${EnvironmentName}-wwii-api-cache
                Condition:
                  ForAnyValue:StringLike:
                    dynamodb:LeadingKeys:
                      - credit#holds#*
                      - credit#balance
                      - credit#hold_alerted
              - Sid: NoRoundApprovalWrites
                # Group 2: operator-only batch-round approval rows (scripts/approve_batch_rounds.py)
                Effect: Deny
                Action: [dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:BatchWriteItem]
                Resource: !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${EnvironmentName}-wwii-api-cache
                Condition:
                  ForAnyValue:StringLike:
                    dynamodb:LeadingKeys:
                      - rounds#*
              - Effect: Allow
                Action: servicequotas:GetServiceQuota
                Resource: '*'
              # 1.1d ladder: read-only price/shape lookups. None supports resource-level scoping.
              - Sid: LadderPriceReads
                Effect: Allow
                Action:
                  - pricing:GetProducts
                  - ec2:DescribeSpotPriceHistory
                  - ec2:DescribeSubnets
                  - ec2:DescribeInstanceTypes
                Resource: '*'
              - Effect: Allow
                Action: sns:Publish
                Resource: !Sub arn:aws:sns:${AWS::Region}:${AWS::AccountId}:${EnvironmentName}-wwii-phase2-complete

  OcrSpotControllerFunction:
    Type: AWS::Lambda::Function
    Condition: HasLambdaCode
    Properties:
      FunctionName: !Sub ${EnvironmentName}-wwii-ocr-spot-controller
      Runtime: python3.12
      Handler: lambda_handlers.ocr_spot_controller.handler
      Role: !GetAtt OcrSpotControllerRole.Arn
      Timeout: 180
      MemorySize: 256
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Ref LambdaCodeKey
      Environment:
        Variables:
          ENV_NAME: !Ref EnvironmentName
          CACHE_TABLE: !Sub ${EnvironmentName}-wwii-api-cache
          # 1.1d: ladder types in order (rung 0 = ORIGINAL type, its on-demand price is the cap).
          OCR_GPU_LADDER: !If
            - IsSpot
            - !Join [',', [!Ref GpuRung0Type, !Ref GpuRung1Type, !Ref GpuRung2Type, !Ref GpuRung3Type]]
            - !Ref GpuRung0Type
          OCR_MAX_FRACTION: '1.0'
          PRIVATE_SUBNET_IDS: !Join [',', !Ref PrivateSubnetIds]
          OCR_ONDEMAND_QUEUE: !Sub ${EnvironmentName}-wwii-chandra-gpu-ondemand
          OCR_JOB_DEF: !Sub ${EnvironmentName}-wwii-chandra
          # Publishes free-form alerts to phase2-complete -> fans to EMAIL (direct)
          # + SLACK (via the slack-formatter -> chatbot). Both channels (§operator).
          NOTIFICATION_TOPIC_ARN: !Sub arn:aws:sns:${AWS::Region}:${AWS::AccountId}:${EnvironmentName}-wwii-phase2-complete

  OcrSpotControllerSchedule:
    Type: AWS::Events::Rule
    Condition: HasLambdaCode
    Properties:
      Name: !Sub ${EnvironmentName}-wwii-ocr-spot-controller-hourly
      ScheduleExpression: rate(1 hour)
      State: ENABLED
      Targets:
        - Arn: !GetAtt OcrSpotControllerFunction.Arn
          Id: ocr-spot-controller

  # 1.1d: a Spot reclaim (status reason 'Host EC2*') is handled the moment Batch reports it;
  # the hourly schedule above is the backstop sweep.
  OcrSpotControllerFailedRule:
    Type: AWS::Events::Rule
    Condition: HasLambdaCode
    Properties:
      Name: !Sub ${EnvironmentName}-wwii-ocr-spot-failed
      Description: On a Chandra GPU job FAILED, let the controller climb the Spot price ladder
      EventPattern:
        source: [aws.batch]
        detail-type: [Batch Job State Change]
        detail:
          status: [FAILED]
          jobQueue:
            - prefix: !Sub arn:aws:batch:${AWS::Region}:${AWS::AccountId}:job-queue/${EnvironmentName}-wwii-chandra-gpu
      State: ENABLED
      Targets:
        - Arn: !GetAtt OcrSpotControllerFunction.Arn
          Id: ocr-spot-controller-failed

  OcrSpotControllerFailedPermission:
    Type: AWS::Lambda::Permission
    Condition: HasLambdaCode
    Properties:
      FunctionName: !Ref OcrSpotControllerFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt OcrSpotControllerFailedRule.Arn

  OcrSpotControllerInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: HasLambdaCode
    Properties:
      FunctionName: !Ref OcrSpotControllerFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt OcrSpotControllerSchedule.Arn

Outputs:
  JobQueueName:
    Value: !Ref ChandraJobQueue
  JobDefinitionName:
    Value: !Ref ChandraJobDef
  ComputeEnvironmentName:
    Value: !Ref ChandraComputeEnv
  PaddleJobDefinitionName:
    Condition: HasPaddleImage
    Value: !Ref PaddleJobDef
