AWSTemplateFormatVersion: '2010-09-09'
Description: WWII Pipeline - Network (VPC, subnets, NAT GW, security groups, VPC endpoints)

Parameters:
  EnvironmentName:
    Type: String
    Default: dev

Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-wwii-vpc

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-private-1

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-private-2

  PrivateSubnet3:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.3.0/24
      AvailabilityZone: !Select [2, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-private-3

  PrivateSubnet4:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.4.0/24
      AvailabilityZone: !Select [3, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-private-4

  PrivateSubnet5:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.5.0/24
      AvailabilityZone: !Select [4, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-private-5

  PrivateSubnet6:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.6.0/24
      AvailabilityZone: !Select [5, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-private-6

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.10.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-public-1

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  IGWAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: IGWAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RTA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-private-rt

  PrivateSubnet1RTA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnet2RTA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnet3RTA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet3
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnet4RTA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet4
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnet5RTA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet5
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnet6RTA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet6
      RouteTableId: !Ref PrivateRouteTable

  # Security Groups
  LambdaSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Lambda functions and ECS pipeline tasks
      VpcId: !Ref VPC
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  LambdaSGSelfIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref LambdaSG
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !Ref LambdaSG

  OpenSerpSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: OpenSERP ECS service
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 7001
          ToPort: 7001
          SourceSecurityGroupId: !Ref LambdaSG
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  OpenSerpSGSelfIngress443:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref OpenSerpSG
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !Ref OpenSerpSG
      Description: Allow VPC endpoint access for ECR image pull

  # VPC Endpoints (avoid NAT for AWS services)
  S3Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub com.amazonaws.${AWS::Region}.s3
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref PrivateRouteTable

  DynamoDBEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub com.amazonaws.${AWS::Region}.dynamodb
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref PrivateRouteTable

  # SSM Parameters for dynamic networking stack
  SSMVpcId:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${EnvironmentName}-wwii-pipeline/VpcId
      Type: String
      Value: !Ref VPC
  SSMPublicSubnet1:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${EnvironmentName}-wwii-pipeline/PublicSubnet1Id
      Type: String
      Value: !Ref PublicSubnet1
  SSMPrivateSubnet1:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${EnvironmentName}-wwii-pipeline/PrivateSubnet1Id
      Type: String
      Value: !Ref PrivateSubnet1
  SSMPrivateSubnet2:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${EnvironmentName}-wwii-pipeline/PrivateSubnet2Id
      Type: String
      Value: !Ref PrivateSubnet2
  SSMPrivateSubnet3:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${EnvironmentName}-wwii-pipeline/PrivateSubnet3Id
      Type: String
      Value: !Ref PrivateSubnet3
  SSMPrivateSubnet4:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${EnvironmentName}-wwii-pipeline/PrivateSubnet4Id
      Type: String
      Value: !Ref PrivateSubnet4
  SSMPrivateSubnet5:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${EnvironmentName}-wwii-pipeline/PrivateSubnet5Id
      Type: String
      Value: !Ref PrivateSubnet5
  SSMPrivateSubnet6:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${EnvironmentName}-wwii-pipeline/PrivateSubnet6Id
      Type: String
      Value: !Ref PrivateSubnet6
  SSMPrivateRouteTable:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${EnvironmentName}-wwii-pipeline/PrivateRouteTableId
      Type: String
      Value: !Ref PrivateRouteTable
  SSMLambdaSG:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${EnvironmentName}-wwii-pipeline/LambdaSGId
      Type: String
      Value: !Ref LambdaSG

Outputs:
  VpcId:
    Value: !Ref VPC
  PrivateSubnet1Id:
    Value: !Ref PrivateSubnet1
  PrivateSubnet2Id:
    Value: !Ref PrivateSubnet2
  PrivateSubnet3Id:
    Value: !Ref PrivateSubnet3
  PrivateSubnet4Id:
    Value: !Ref PrivateSubnet4
  PrivateSubnet5Id:
    Value: !Ref PrivateSubnet5
  PrivateSubnet6Id:
    Value: !Ref PrivateSubnet6
  PublicSubnet1Id:
    Value: !Ref PublicSubnet1
  LambdaSGId:
    Value: !Ref LambdaSG
  OpenSerpSGId:
    Value: !Ref OpenSerpSG
  PrivateRouteTableId:
    Value: !Ref PrivateRouteTable
