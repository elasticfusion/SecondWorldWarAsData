AWSTemplateFormatVersion: '2010-09-09'
Description: WWII Pipeline - Network (VPC, subnets, NAT GW, security groups, VPC endpoints)

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
  GpuAz1:
    Type: String
    Default: ""
    Description: >
      First GPU-capable AZ for PrivateSubnet1 (deploy-time probe supplies it).
      Empty -> fall back to the first AZ (!GetAZs). The 2 canonical private subnets
      carry GPU Batch + CPU Fargate + all interface endpoints + NAT, so both MUST
      be GPU-capable AZs (fixes the OCR-stall AZ misalignment).
  GpuAz2:
    Type: String
    Default: ""
    Description: Second GPU-capable AZ for PrivateSubnet2 (empty -> second !GetAZs).

Conditions:
  HasGpuAz1: !Not [!Equals [!Ref GpuAz1, ""]]
  HasGpuAz2: !Not [!Equals [!Ref GpuAz2, ""]]

Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-wwii-vpc

  # --- 2 AZs (both GPU-capable), 1 public + 1 private each. Compute + endpoints
  # live in the PRIVATE subnets; NAT gateways in the PUBLIC subnets. AZs come from
  # the deploy-time GPU probe (GpuAz1/2); empty -> !GetAZs fallback. ---
  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.21.0/24
      AvailabilityZone: !If [HasGpuAz1, !Ref GpuAz1, !Select [0, !GetAZs '']]
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-private-1

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.22.0/24
      AvailabilityZone: !If [HasGpuAz2, !Ref GpuAz2, !Select [1, !GetAZs '']]
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-private-2

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.30.0/24
      AvailabilityZone: !If [HasGpuAz1, !Ref GpuAz1, !Select [0, !GetAZs '']]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-public-1

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.31.0/24
      AvailabilityZone: !If [HasGpuAz2, !Ref GpuAz2, !Select [1, !GetAZs '']]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-public-2

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  IGWAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: IGWAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RTA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RTA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-private-rt

  PrivateSubnet1RTA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnet2RTA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable

  # Security Groups
  LambdaSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Lambda functions and ECS pipeline tasks
      VpcId: !Ref VPC
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  LambdaSGSelfIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref LambdaSG
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !Ref LambdaSG

  # Container status API (option 3): the in-VPC nat_teardown Lambda polls each pipeline
  # task's /status on 8077. Lambdas + phase tasks share LambdaSG, so allow 8077 from the
  # same SG (self-ingress), mirroring the 443 rule above.
  LambdaSGStatusIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref LambdaSG
      IpProtocol: tcp
      FromPort: 8077
      ToPort: 8077
      SourceSecurityGroupId: !Ref LambdaSG
      Description: nat_teardown Lambda to container status API (port 8077)

  OpenSerpSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: OpenSERP ECS service
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 7001
          ToPort: 7001
          SourceSecurityGroupId: !Ref LambdaSG
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  OpenSerpSGSelfIngress443:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref OpenSerpSG
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !Ref OpenSerpSG
      Description: Allow VPC endpoint access for ECR image pull

  # VPC Endpoints (avoid NAT for AWS services)
  S3Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub com.amazonaws.${AWS::Region}.s3
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref PrivateRouteTable

  DynamoDBEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub com.amazonaws.${AWS::Region}.dynamodb
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref PrivateRouteTable

  # --- Interface endpoints so ECS task STARTUP (ECR image pull, Secrets Manager,
  # CloudWatch Logs) does NOT depend on the NAT gateway being routable yet. Without
  # these, a Fargate task in the private subnets (assignPublicIp DISABLED) can only
  # reach ECR via NAT; if NAT isn't fully routable at launch the task fails with
  # ResourceInitializationError (ECR GetAuthorizationToken i/o timeout) before any
  # phase code runs. These interface endpoints keep startup entirely on private AWS
  # networking; NAT is then only needed for genuine internet calls (Grok/Wikipedia/
  # geocode) INSIDE a running phase, by which time it is long since up. ---
  VpcEndpointSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HTTPS (443) to the interface VPC endpoints from pipeline tasks
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !Ref LambdaSG
          Description: ECS pipeline tasks + Lambdas (LambdaSG) reach the endpoints
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !Ref OpenSerpSG
          Description: OpenSERP tasks reach the endpoints for their own ECR pull
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 127.0.0.1/32
          Description: No egress needed from the endpoint ENIs (deny-all placeholder)

  EcrApiEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub com.amazonaws.${AWS::Region}.ecr.api
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      SecurityGroupIds:
        - !Ref VpcEndpointSG
      # Defense-in-depth: only this account's ECR (GetAuthorizationToken has no
      # resource, so it stays "*"); IAM remains the primary control.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: '*'
            Action:
              - ecr:GetAuthorizationToken
              - ecr:BatchCheckLayerAvailability
              - ecr:GetDownloadUrlForLayer
              - ecr:BatchGetImage
            Resource: '*'
            Condition:
              StringEquals:
                aws:PrincipalAccount: !Ref AWS::AccountId

  EcrDkrEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub com.amazonaws.${AWS::Region}.ecr.dkr
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      SecurityGroupIds:
        - !Ref VpcEndpointSG
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: '*'
            Action:
              - ecr:GetAuthorizationToken
              - ecr:BatchCheckLayerAvailability
              - ecr:GetDownloadUrlForLayer
              - ecr:BatchGetImage
            Resource: '*'
            Condition:
              StringEquals:
                aws:PrincipalAccount: !Ref AWS::AccountId

  LogsEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub com.amazonaws.${AWS::Region}.logs
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      SecurityGroupIds:
        - !Ref VpcEndpointSG

  SecretsManagerEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub com.amazonaws.${AWS::Region}.secretsmanager
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      SecurityGroupIds:
        - !Ref VpcEndpointSG
      # Defense-in-depth: this endpoint vends the Grok key; restrict it to this
      # env's secrets by ARN prefix so a compromised task cannot read arbitrary
      # account secrets over the private path. IAM remains the primary control.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: '*'
            Action:
              - secretsmanager:GetSecretValue
              - secretsmanager:DescribeSecret
            Resource:
              - !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${EnvironmentName}-wwii-pipeline/*

  # --- Always-on interface endpoints for the IN-VPC nat_teardown decider's control
  # plane. It must call ec2:DescribeNatGateways FIRST to decide whether NAT exists —
  # a call that cannot route through NAT (which may be down). Without these it times out
  # (~90s) on every run when NAT is idle. ecs (task/demand check), lambda (invoke
  # nat-manager delete), and scheduler (10-min self-recheck) likewise need a private
  # path. STS is intentionally avoided in code (account id read from the Lambda context),
  # so no sts endpoint is needed.
  Ec2Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub com.amazonaws.${AWS::Region}.ec2
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      SecurityGroupIds:
        - !Ref VpcEndpointSG

  EcsEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub com.amazonaws.${AWS::Region}.ecs
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      SecurityGroupIds:
        - !Ref VpcEndpointSG

  LambdaEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub com.amazonaws.${AWS::Region}.lambda
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      SecurityGroupIds:
        - !Ref VpcEndpointSG

  SchedulerEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub com.amazonaws.${AWS::Region}.scheduler
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      SecurityGroupIds:
        - !Ref VpcEndpointSG

  # SSM Parameters for dynamic networking stack
  SSMVpcId:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${EnvironmentName}-wwii-pipeline/VpcId
      Type: String
      Value: !Ref VPC
  SSMPublicSubnet1:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${EnvironmentName}-wwii-pipeline/PublicSubnet1Id
      Type: String
      Value: !Ref PublicSubnet1
  SSMPrivateSubnet1:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${EnvironmentName}-wwii-pipeline/PrivateSubnet1Id
      Type: String
      Value: !Ref PrivateSubnet1
  SSMPrivateSubnet2:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${EnvironmentName}-wwii-pipeline/PrivateSubnet2Id
      Type: String
      Value: !Ref PrivateSubnet2
  SSMPublicSubnet2:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${EnvironmentName}-wwii-pipeline/PublicSubnet2Id
      Type: String
      Value: !Ref PublicSubnet2
  SSMPrivateRouteTable:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${EnvironmentName}-wwii-pipeline/PrivateRouteTableId
      Type: String
      Value: !Ref PrivateRouteTable
  SSMLambdaSG:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${EnvironmentName}-wwii-pipeline/LambdaSGId
      Type: String
      Value: !Ref LambdaSG

Outputs:
  VpcId:
    Value: !Ref VPC
  PrivateSubnet1Id:
    Value: !Ref PrivateSubnet1
  PrivateSubnet2Id:
    Value: !Ref PrivateSubnet2
  PublicSubnet1Id:
    Value: !Ref PublicSubnet1
  PublicSubnet2Id:
    Value: !Ref PublicSubnet2
  LambdaSGId:
    Value: !Ref LambdaSG
  OpenSerpSGId:
    Value: !Ref OpenSerpSG
  PrivateRouteTableId:
    Value: !Ref PrivateRouteTable
