AWSTemplateFormatVersion: '2010-09-09'
Description: WWII Pipeline - Storage (S3 bucket, DynamoDB tables)

Parameters:
  EnvironmentName:
    Type: String
    Default: dev

Resources:
  DataBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub ${EnvironmentName}-wwii-data-pipeline
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      # Encryption at rest. SSE-S3 (AES256) rather than KMS: no per-request KMS
      # cost or key management, which suits the cost-conscious design; the data is
      # historical/public-domain, not regulated. BucketKeyEnabled reduces calls.
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: CleanupTempFiles
            Prefix: tmp/
            Status: Enabled
            ExpirationInDays: 7
          - Id: CleanupCacheFiles
            Prefix: cache/
            Status: Enabled
            ExpirationInDays: 90
          - Id: TransitionOldOutputToIA
            Prefix: output/
            Status: Enabled
            Transitions:
              - StorageClass: STANDARD_IA
                TransitionInDays: 30
              - StorageClass: GLACIER_IR
                TransitionInDays: 90
          # source/ holds the original scanned PDFs (write-once, read-rarely —
          # kept only for citation + re-OCR). Glacier Instant Retrieval keeps
          # millisecond access for the occasional re-OCR at ~1/4 the STANDARD cost.
          - Id: SourcePdfsToGlacierIR
            Prefix: source/
            Status: Enabled
            Transitions:
              - StorageClass: GLACIER_IR
                TransitionInDays: 30
          # NOTE: contentrepository/ (6.25GB) mixes small ACTIVE chapter markdown
          # (re-read every parse trigger — must stay STANDARD) with large cold
          # binaries. Transitioning only the large ones by SIZE needs a prefix+size
          # Filter, which THIS template's lifecycle rule schema (top-level Prefix,
          # not Filter) does not support. Instead we transition the identifiable
          # pure-binary SUB-prefixes by prefix (verified to contain NO markdown):
          #   contentrepository/NARA/ = 92 scanned source PDFs, 3.29GB, already
          #   OCR'd (terminal; kept for citation/re-OCR). These are read ONLY during
          #   ingestion (OCR/convert) — never during serving. Glacier IR chosen over
          #   deeper tiers deliberately: the auto-trigger (_submit_ocr) reads the
          #   object IMMEDIATELY on re-upload (download_file + byte-range sniff), so a
          #   deep-Glacier/Deep-Archive object would fail that read (InvalidObjectState,
          #   needs a multi-hour restore first). Glacier IR is ~83% cheaper than
          #   STANDARD AND stays transparently readable (ms, no restore) — so it saves
          #   cost without breaking an auto-triggered re-OCR. Transition at 1 day:
          #   these are already-processed terminal artifacts, no reason to wait.
          #   (Deep Archive would save ~13pp more but is NOT worth breaking the
          #   ingestion read path; revisit only if re-OCR becomes restore-then-read.)
          - Id: NaraSourcePdfsToGlacierIR
            Prefix: contentrepository/NARA/
            Status: Enabled
            Transitions:
              - StorageClass: GLACIER_IR
                TransitionInDays: 1
          # Consumed source media/binaries (video, large images, converted
          # epub/docx) are tagged archive=cold by the ingestion handlers once their
          # chapter output is written (src/ingestion/archive_tag). They live in
          # unpredictable per-title dirs mixed with active markdown, so TAG-based
          # (not prefix/size) transition is the only safe wholesale mechanism — and
          # unlike a size Filter, TagFilters ARE supported by this template's rule
          # schema. Glacier IR keeps them instantly readable for re-processing.
          - Id: ColdArchiveTaggedToGlacierIR
            Status: Enabled
            TagFilters:
              - Key: archive
                Value: cold
            Transitions:
              - StorageClass: GLACIER_IR
                TransitionInDays: 1
          # Expire the EICAR/AV test artifacts + any scratch under av-test/ fast.
          - Id: CleanupAvTest
            Prefix: av-test/
            Status: Enabled
            ExpirationInDays: 1
          - Id: ExpireOldVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  # TLS-only: deny any request made over plain HTTP (aws:SecureTransport=false).
  # Standard S3 hardening — enforces encryption in transit for all principals.
  DataBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DataBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt DataBucket.Arn
              - !Sub '${DataBucket.Arn}/*'
            Condition:
              Bool:
                'aws:SecureTransport': 'false'

  # API response cache
  CacheTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub ${EnvironmentName}-wwii-api-cache
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: cache_key
          AttributeType: S
      KeySchema:
        - AttributeName: cache_key
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # Entity tables
  PeopleTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub ${EnvironmentName}-wwii-people
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PersonID
          AttributeType: S
      KeySchema:
        - AttributeName: PersonID
          KeyType: HASH

  GroupsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub ${EnvironmentName}-wwii-groups
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: GroupID
          AttributeType: S
      KeySchema:
        - AttributeName: GroupID
          KeyType: HASH

  PlacesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub ${EnvironmentName}-wwii-places
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PlaceID
          AttributeType: S
      KeySchema:
        - AttributeName: PlaceID
          KeyType: HASH

  DatesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub ${EnvironmentName}-wwii-dates
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: DateID
          AttributeType: S
      KeySchema:
        - AttributeName: DateID
          KeyType: HASH

  EquipmentTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub ${EnvironmentName}-wwii-equipment
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: EquipmentID
          AttributeType: S
      KeySchema:
        - AttributeName: EquipmentID
          KeyType: HASH

  WeatherTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub ${EnvironmentName}-wwii-weather
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: WeatherID
          AttributeType: S
      KeySchema:
        - AttributeName: WeatherID
          KeyType: HASH

  LogisticsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub ${EnvironmentName}-wwii-logistics
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: LogisticsID
          AttributeType: S
      KeySchema:
        - AttributeName: LogisticsID
          KeyType: HASH

  CasualtiesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub ${EnvironmentName}-wwii-casualties
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: CasualtyID
          AttributeType: S
      KeySchema:
        - AttributeName: CasualtyID
          KeyType: HASH

  MapsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub ${EnvironmentName}-wwii-maps
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: MapID
          AttributeType: S
      KeySchema:
        - AttributeName: MapID
          KeyType: HASH

  BibliographyTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub ${EnvironmentName}-wwii-bibliography
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: BibliographyID
          AttributeType: S
      KeySchema:
        - AttributeName: BibliographyID
          KeyType: HASH

  # --- Cost Monitoring ---
  PipelineBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub ${EnvironmentName}-wwii-pipeline-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: 75
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
          Subscribers:
            - SubscriptionType: SNS
              Address: !Sub arn:aws:sns:${AWS::Region}:${AWS::AccountId}:${EnvironmentName}-wwii-alarms

Outputs:
  DataBucketName:
    Value: !Ref DataBucket
  DataBucketArn:
    Value: !GetAtt DataBucket.Arn
  CacheTableName:
    Value: !Ref CacheTable
  CacheTableArn:
    Value: !GetAtt CacheTable.Arn
