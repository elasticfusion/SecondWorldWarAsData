AWSTemplateFormatVersion: '2010-09-09'
Description: >
  WWII Pipeline - AWS Chatbot Slack alerting. Deployed to us-east-1 (SAME region
  as the SNS topics). AWS Chatbot only DELIVERS from SNS topics in a region it
  serves, so the former us-east-2 deploy (chosen when Chatbot's CFN endpoint was
  us-east-2-only) referenced the us-east-1 topics cross-region and silently never
  delivered — breaking Slack. Collapsing into us-east-1 (verified 2026-10-29 that
  AWS::Chatbot::SlackChannelConfiguration provisions here) fixes delivery.
  Replaces the fragile email-confirmation path for operator alerts with Slack.

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
  SlackTeamId:
    Type: String
    Description: Slack workspace / team ID (e.g. T1D8E0ZGT for CirrusNine)
  SlackChannelId:
    Type: String
    Description: Slack channel ID (e.g. C0C4BK472DD for wwii-pipeline-alerts)
  TopicRegion:
    Type: String
    Default: us-east-1
    Description: Region where the SNS topics live
  AccountId:
    Type: String
    Description: AWS account ID that owns the SNS topics

Resources:
  # IAM role Chatbot assumes to read notification context. Least-privilege:
  # CloudWatch read for alarm context; no write. SNS delivery is handled by the
  # Chatbot service, not this role.
  ChatbotRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${EnvironmentName}-wwii-chatbot-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: chatbot.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: chatbot-notification-read
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cloudwatch:Describe*
                  - cloudwatch:Get*
                  - cloudwatch:List*
                Resource: '*'

  SlackChannelConfig:
    Type: AWS::Chatbot::SlackChannelConfiguration
    Properties:
      ConfigurationName: !Sub ${EnvironmentName}-wwii-pipeline-alerts
      IamRoleArn: !GetAtt ChatbotRole.Arn
      SlackChannelId: !Ref SlackChannelId
      SlackWorkspaceId: !Ref SlackTeamId
      LoggingLevel: ERROR
      # Channel permission ceiling. Without this, Chatbot defaults the guardrail
      # to the AdminAccess managed policy — an unnecessary admin blast radius for a
      # notifications-only channel. Cap it at ReadOnlyAccess (the ChatbotRole is
      # already read-only; alerts never need write/command actions). CFN security
      # review 2026-10-11, HIGH.
      GuardrailPolicies:
        - arn:aws:iam::aws:policy/ReadOnlyAccess
      SnsTopicArns:
        - !Sub arn:aws:sns:${TopicRegion}:${AccountId}:${EnvironmentName}-wwii-alarms
        - !Sub arn:aws:sns:${TopicRegion}:${AccountId}:${EnvironmentName}-wwii-slack

Outputs:
  ChatbotConfigArn:
    Description: ARN of the Slack channel configuration
    Value: !Ref SlackChannelConfig
  ChatbotRoleArn:
    Value: !GetAtt ChatbotRole.Arn
