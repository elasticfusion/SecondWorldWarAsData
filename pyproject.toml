[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "secondworldwarasdata"
version = "2.0.0"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
include = ["src*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Put the repo root on sys.path so tests can import root-level modules
# (phase0_ingest, phase1_parse, phase3_retry, ecs_entrypoint, ...) whether the
# suite is run as a whole or a single file in isolation.
pythonpath = ["."]

# Show extra test summary info
# Skip API/slow/integration tests by default so `pytest tests/` runs the fast
# offline suite (~18s). Run them explicitly with, e.g.:
#   pytest -m requires_api      (real API-credentialed tests)
#   pytest -m slow              (real-API/slow tests)
#   pytest -m integration       (multi-component integration)
#   pytest -m ""                (everything, overriding this filter)
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "-m",
    "not requires_api and not slow and not integration",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--log-cli-level=INFO",
    "--log-file=logs/test.log",
    "--log-file-level=DEBUG",
]

# Logging configuration
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%%(asctime)s [%%(levelname)8s] %%(message)s"
log_cli_date_format = "%%Y-%%m-%%d %%H:%%M:%%S"

log_file = "logs/test.log"
log_file_level = "DEBUG"
log_file_format = "%%(asctime)s [%%(levelname)8s] [%%(filename)s:%%(lineno)d] %%(message)s"
log_file_date_format = "%%Y-%%m-%%d %%H:%%M:%%S"

# Markers for organizing tests
markers = [
    "unit: Unit tests (fast, isolated)",
    "integration: Integration tests (slower, multi-component)",
    "slow: Slow tests that make real API calls",
    "requires_api: Tests that require API credentials",
]

# Coverage settings
[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.black]
target-version = ["py312"]

[tool.vulture]
exclude = ["scripts/archive", "ecs_modules", "src/extraction/equipment_ext", ".venv"]
min_confidence = 80
