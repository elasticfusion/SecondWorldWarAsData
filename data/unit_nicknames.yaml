# Unit nickname / sobriquet -> canonical unit name.
#
# WWII units are frequently referred to by nickname with NO number ("Screaming Eagles",
# "Big Red One") — the canonical unit key (which needs a number) can't derive these, so
# this curated map resolves a nickname to the unit's canonical name, which then yields
# the usual (number + service + arm + echelon) key. Used by BOTH the person->group
# linker and the group deduper so a nickname and its numbered unit resolve identically.
#
# PROVENANCE / SCOPE: OUR OWN curated, growable list (not an authoritative registry).
# Seeded with well-known US (and a few Allied) WWII division nicknames. Add entries as
# they appear in sources. Keys are lowercased nicknames; values are canonical names
# that derive_unit_key can parse.

