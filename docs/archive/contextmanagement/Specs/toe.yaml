TOE:
	- Unit(s) Name:
        - link to  output/people_groups ULID
	- Unit_Nationality
      - link to output/people_groups ULID
    - People
      - 
	  - Commander_Name with ULID link to output/people JSON
	  - Commander_Rank, this is date sensitive
	    - TOE Commmand Structure Commander End_Status = Relieved, WIA or KIA:
		  -If the the commander status did not change during the event, ignore the field
		  - TOE.Commmand Structure.Commander.End_Date = last day of command
		  - List multiple commanders, if a commander is relieved, wounded or killed.
		  - Link to output/people_groups ULID
		  - A feature of European Theater is that sub-units might be shifted around within larger commands, note this if available.  
            - So they are date sensitive. Link to dates ULID
		  - Include the commander of higher unit if it can be determined, from either the text or people_groups or output/people
	- Equipment:
        - the schema should note equipment used as mentioned in the text.
        - it should include both it's common name, like 'Sherman' and it's technical identifier 'M4'
    - Personnel:
        - Note any military award


    Note uni
