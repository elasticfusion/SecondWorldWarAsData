system_prompt: |
  You are a WWII military logistics analysis specialist.

prompt_template: |
  Extract ALL logistics facts from these WWII sub-events — both POSITIVE/ROUTINE logistics
  ACTIVITIES (supplies issued, loading/embarkation, marshaling, movement/transport of units,
  reinforcement, resupply delivered) AND logistics PROBLEMS (shortages, delays, disruptions,
  capacity constraints). Logistics is the movement and supply of men and materiel — a successful
  supply/embarkation/movement is a logistics fact just as much as a shortage is. Do NOT limit to
  problems.

  Sub-events:
  {sub_event_block}

  Return JSON keyed by Sub-eventID matching this structure:
  {schema}

schema: |
  {
    "SUB_EVENT_ID": [
      {
        "type": "supply_shortage",
        "category": "ammunition",
        "description": "Ammunition supplies critically low for VII Corps",
        "severity": "critical",
        "date_string": "1944-07-15",
        "delivery_method": "truck convoy",
        "status": "unresolved",
        "quantity": {"amount": 500, "unit": "tons", "shortfall": 200},
        "impacted_organizations": [{"name": "VII Corps", "nationality": "USA", "role": "recipient"}],
        "impacted_people": [],
        "impacted_places": [{"name": "St. Lô"}],
        "weather_impact": "Rain delayed supply convoys",
        "resolution": null,
        "context": "Breakout operations stalled due to ammunition shortage",
        "paragraph_numbers": [23, 24]
      }
    ]
  }

rules:
  - |
    Type values (logistics_type): PROBLEM types — supply_shortage, supply_excess, delivery_delay,
    transport_disruption, capacity_constraint, production_delay; POSITIVE/ROUTINE types —
    supply_issue (supplies/rations/ammunition issued or distributed), embarkation (loading men/
    materiel onto ships/craft), marshaling (assembling/staging units for movement), movement
    (transport of units/materiel), reinforcement (reinforcements brought forward), resupply
    (delivery of supplies). Extract positive activities too — they are logistics facts.
  - |
    POSITIVE / ROUTINE LOGISTICS — a successful supply/movement/embarkation chain is a logistics
    fact, not just problems. A passage like "they moved to marshaling areas near the embarkation
    points; final supplies were issued for the voyage, maps distributed, ... units broken down into
    boatloads to await the move down to the ships" contains SEVERAL positive logistics facts —
    emit records for the marshaling (type "marshaling"), the supply issue (type "supply_issue",
    category "supplies"/"maps"), and the embarkation/loading into boatloads (type "embarkation").
    severity "low"/null for routine activities (no problem is being asserted).
  - |
    SHORTAGE / ABSENCE PER ITEM — a statement that a unit LACKED or had too FEW of something is a
    logistics fact (type "supply_shortage", severity by the calibration below). When MULTIPLE items
    are listed as short/absent, emit ONE record PER item — do NOT merge them. Examples:
    - "lacking vehicles, supplies, ammunition, artillery, and armored support" -> FIVE
      supply_shortage records (category: vehicles / supplies / ammunition / artillery /
      armored_support), each with the verbatim original_text.
    - "very few heavy weapons, no supporting artillery, ... little prospect of ... large-scale
      supplies or reinforcements" -> separate shortage records for heavy_weapons (few), artillery
      (none), supplies (prospect limited), reinforcements (prospect limited).
    "no X" / "lacking X" / "very few X" are all valid shortages — do NOT drop them for being an
    absence; set a qualifier (none / very_few / limited) in description. original_text MANDATORY.
  - Severity values: critical, high, medium, low
  - DEFAULT TO MEDIUM. Only use high/critical when text explicitly states operations were halted, postponed, or impossible.
  - Severity calibration:
    - critical: Operations completely halted or impossible (e.g., army cannot advance due to zero fuel, entire division immobilized)
    - high: Significant degradation requiring workarounds (e.g., ammunition rationing, attack delayed by days, alternate routes needed)
    - medium: Noticeable constraint but operations continue (e.g., resupply delayed 1-2 days, substitutions needed, reduced tempo)
    - low: Minor inconvenience with minimal operational impact (e.g., comfort items unavailable, slight delay, administrative friction)
  - "Severity examples:"
  - "  'Ammunition supply was limited' = medium (constraint noted, operations continue)"
  - "  'The division was forced to halt its advance due to complete lack of fuel' = critical (explicitly halted)"
  - "  'Supply trucks were delayed by muddy roads, requiring an extra day' = medium (delay, operations continue)"
  - "  'Artillery units rationed shells to 10 per gun per day instead of 25' = high (significant degradation, workaround in place)"
  - Status values: resolved, unresolved, in_progress, worsened
  - Country codes use ISO 3166-1 alpha-3
  - If no logistics issues found for a sub-event, return empty array for that key
  - |
    CONJUNCTIONS = SEPARATE ENTITIES. Within a logistics issue, when distinct organizations,
    places, or people are joined by "and"/"or" or in a comma list, emit ONE object per item in
    the relevant list (impacted_organizations, impacted_places, impacted_people) — NEVER a single
    merged entry. Examples:
    - "VII Corps and V Corps were short of ammunition" -> impacted_organizations has TWO entries:
      {"name": "VII Corps", ...} and {"name": "V Corps", ...}.
    - "supplies ran low at St. Lô, Carentan, and Isigny" -> impacted_places has THREE entries,
      one per place.
    Likewise, two genuinely distinct logistics problems in one sub-event are TWO array items,
    not one.
