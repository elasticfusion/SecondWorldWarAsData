system_prompt: |
  You are a WWII military equipment identification specialist.

prompt_template: |
  Extract military equipment mentioned in this WWII event data.
  Extract EVERY equipment reference, including GENERIC TYPES (e.g. "machine gun", "artillery",
  "tank", "mine", "grenade", "barbed wire", "fighter-bomber", "small arms", "coastal battery").
  When the source gives no specific model/designation, use the generic type itself as the name
  (name "machine gun", name "artillery"). Do NOT drop a mention merely because it lacks a named
  model — a generic equipment reference is still a valid mention.

  Event data:
  {event_data}

  Return JSON matching this structure:
  {schema}

schema: |
  {
    "Equipment": [
      {
        "EquipmentID": "01ULID...",
        "name": "M4 Sherman",
        "technical_identifier": "M4A1",
        "category": "armor",
        "subcategory": "medium_tank",
        "country_of_origin": "USA",
        "operating_country": "GBR",
        "captured": false,
        "quantity": 10,
        "quantity_text": "10",
        "place_name": "the crossroads in Cherbourg",
        "assertion_source": "narrative",
        "presence": "present",
        "absence_reason": null,
        "variants": [],
        "specifications": {},
        "using_unit_name": "2nd Armored Division",
        "using_person_name": null,
        "supporting_units": [
          {"unit_name": "IX Tactical Air Command", "support_type": "aircraft", "equipment_name": "P-47 Thunderbolt"}
        ],
        "related_equipment": [
          {"relationship": "successor", "name": "M26 Pershing", "basis": "introduced to counter German heavy tanks", "original_text": "the M26 Pershing would eventually replace the Sherman"}
        ],
        "crew_accounts": [
          {"person_name": "Belton Cooper", "role": "maintenance officer", "observations": "frequent transmission failures in bocage", "original_text": "Cooper recorded that transmissions failed repeatedly in the hedgerows", "book": "Death Traps"}
        ],
        "environmental_performance": [
          {"condition": "sub-zero temperatures", "effect": "performed badly", "original_text": "the M4 performed badly in sub-zero temperatures"}
        ],
        "performance_notes": "Effective against infantry positions",
        "context": "Used in breakout operations",
        "original_text": "Sherman tanks of the 2nd Armored",
        "paragraph_numbers": [15, 16]
      }
    ]
  }

rules:
  - "Category values (use EXACTLY one of these): armor, aircraft, naval, artillery, infantry_weapons, vehicles, communications, engineering, other"
  - |
    Category is the BROAD type. Subcategory is the specific type within that category. Examples:
    M4 Sherman → category: "armor", subcategory: "medium_tank"
    P-47 Thunderbolt → category: "aircraft", subcategory: "fighter_bomber"
    105mm Howitzer → category: "artillery", subcategory: "field_howitzer"
    Jeep → category: "vehicles", subcategory: "utility_vehicle"
    BAR → category: "infantry_weapons", subcategory: "automatic_rifle"
    88mm gun → category: "artillery", subcategory: "anti_aircraft" (NOT "armor")
  - 'Do NOT use equipment-specific names as category (e.g., "Medium Tank" is WRONG — use "armor")'
  - |
    TRANSPORT-CAPABLE PLATFORMS (SHIPS & AIRCRAFT) ARE MULTI-MODAL — route by the ASSERTED
    ACTIVITY in THIS mention. The same hull/airframe can be a weapon OR a transport depending on
    what the text says it was doing:
    - WEAPONS EMPLOYMENT (firing / bombing / strafing / shelling / engaging) → it IS equipment.
      A named WARSHIP firing (e.g. "Quincy fired its 8-inch guns", "the destroyers shelled the
      battery") → category "naval"; a combat aircraft (B-24 bombing, fighter-bomber strafing) →
      category "aircraft". If the ship/aircraft has NAMED mounted weapons (Quincy's 8-inch guns),
      emit the ship AND each named weapon as SEPARATE equipment records (see CONJUNCTIONS).
    - MOVING MEN / CARGO (ferrying, landing troops/vehicles, convoy, airlift, air-dropping SUPPLIES,
      unloading at docks) → this is a LOGISTICS activity, NOT weapons employment. Still extract the
      platform as equipment (category naval/aircraft) so the reference is captured, but set
      context to describe the LOGISTICS role (e.g. "landing vehicles on D-Day", "troop-carrier
      airlift", "convoy member", "unloading at the pier") so a logistics linker can pick it up.
      (LSTs/LCTs/LCVPs landing; C-47 transports carrying paratroops; cargo planes hauling supplies;
      a bomber air-dropping resupply.) A platform NAMED ONLY as a unit with NO asserted activity
      ("the Barton", "Task Force 124") is primarily an ORGANIZATION — still capture it, but do not
      invent a weapons role it wasn't given.
    DISCRIMINATOR: FIRING/BOMBING/STRAFING = weapon; CARRYING/FERRYING/LANDING/CONVOYING/UNLOADING/
    AIRDROPPING-SUPPLIES = logistics. A bomber dropping bombs is a weapon; the same bomber dropping
    supplies is logistics. A C-47 dropping paratroopers is logistics; strafing would be a weapon.
  - |
    PLATFORM TYPE / CLASS is the KEY attribute for ships & aircraft — put it in subcategory:
    ship class (destroyer / cruiser / battleship / LST / LCT / LCVP / APA / minesweeper / E-boat /
    torpedo_boat) or aircraft role (fighter / bomber / fighter_bomber / transport / glider). If the
    source STATES it ("the destroyer Satterlee", "C-47 transports"), use it. If the source does NOT
    state the type for a NAMED ship/aircraft (bare "Barton", "planes"), DO NOT guess and DO NOT drop
    — set subcategory null and add "TYPE_UNRESOLVED" to context so it can be resolved by supplemental
    search later. Capturing the named platform with an unresolved type is REQUIRED, not optional.
  - "Country codes use ISO 3166-1 alpha-3 (USA, GBR, DEU, FRA, ITA, JPN; use SUN for the WWII USSR, NOT USSR/RUS)"
  - |
    country_of_origin = the country that DESIGNED/MANUFACTURED the equipment type,
    as an ISO 3166-1 alpha-3 code (see the country-code rule above; e.g. "USA", "DEU").
    This is a STABLE identity of the equipment, NOT who is using it. A Sherman is
    always country_of_origin "USA" even when a British unit operates it. A Panther
    is always "DEU".
  - |
    operating_country = who was USING the equipment in THIS specific mention, as an
    ISO 3166-1 alpha-3 code (see the country-code rule above). It MAY
    differ from country_of_origin. Set captured=true only when the operator is using
    it AGAINST its origin (captured gear). Examples:
    - British unit using US Shermans: country_of_origin "USA", operating_country "GBR", captured false
    - Germans using a captured US M10: country_of_origin "USA", operating_country "DEU", captured true
    - US unit using its own Shermans: country_of_origin "USA", operating_country "USA", captured false
    If the operator is not stated, leave operating_country null and captured false.
  - |
    "ENEMY"/"HOSTILE"/"FRIENDLY"/"OUR" ARE RELATIVE TO THE NARRATOR — RESOLVE IN TWO STEPS.
    These words name a side only relative to the author/viewpoint, NOT absolutely. "The enemy"
    in a US-authored account = the Axis; in a German-authored (or German-POV) account = the
    Allies (US/GBR/SUN); from a Japanese perspective = US/GBR/AUS. Do NOT assume an Allied
    narrator.
    STEP 1 — determine the NARRATOR'S side from the source/author/POV of the passage (e.g. a
    US Army history → narrator = USA/Allied; a German memoir or a passage told from the German
    command's view → narrator = German). STEP 2 — map relative terms to the OPPOSING side within
    the theater's combatant set:
    - ETO (Western Europe / Normandy / France / Germany): combatants = {Allied: USA/GBR/CAN/SUN,
      Axis: DEU}. Allied narrator → enemy = DEU; German narrator → enemy = the Allied country in
      context (USA/GBR/SUN).
    - Mediterranean (Italy / Sicily / N. Africa): Axis = DEU or ITA (context), Allied = USA/GBR.
    - Pacific (islands / naval Pacific): Axis = JPN, Allied = USA/GBR/AUS.
    - Burma / China (CBI): Axis = JPN, Allied = GBR/USA/CHN.
    "Friendly"/"our"/"Allied"/"we" → the NARRATOR'S OWN side (again per STEP 1, not assumed US).
    Use surrounding CONTEXT to pick the specific country when a side has several. Apply to
    operating_country (and country_of_origin when origin is otherwise unknown for a generic
    enemy/friendly item). Prefer a perspective+theater-resolved code over null; leave null only
    when the narrator's side OR the theater is genuinely unclear, and note it.
  - |
    OWNERSHIP FROM OPERATIONAL CONTEXT — when the text does NOT state who owns a piece of
    equipment, infer operating_country from the OPERATIONAL ROLE in the passage. These are
    ABSOLUTE facts about the engagement (more reliable than the narrator-relative "enemy/friendly"
    above), so prefer them:
    - DEFENSIVE EMPLACEMENTS (mines, minefields, barbed wire, antilanding/beach obstacles,
      fortifications, pillboxes, coastal batteries, Widerstandsnest/Stützpunkt) belong to the
      side that was ON THE DEFENSIVE at that place/battle. Normandy beaches → Germany defending →
      German (DEU). Battle of the Bulge → US defending (initially) → USA. Resolve from WHO HELD/
      DEFENDED the ground in that engagement.
    - FIRED / EMPLOYED equipment belongs to the party DOING the action. "the artillery was fired"
      → the country/unit that FIRED it in this passage's context; attribute to the acting
      organization (link using_unit_name when the firing unit is named, and set operating_country
      to that unit's side).
    RESOLUTION PRECEDENCE for operating_country: (1) explicit statement > (2) operational role
    (defender for emplacements, actor for fired/employed) > (3) narrator-relative enemy/friendly
    (rule above) > (4) null. Record original_text so the inference is traceable.
  - |
    ITALICS = ENEMY TACTICAL FORMATION (US Army "Green Book" convention) — NARROW signal. When an
    italicized enemy FORMATION (numbered OR named: *352d Division*, *Seventh Army*, *LXXXIV Corps*,
    *Panzer Lehr*, *Kampfgruppe Meyer*, *5th Torpedo Boat Flotilla*) OPERATES the equipment
    ("*352d Division* dug in with its guns"), set operating_country to the enemy nationality by
    theater (ETO: DEU; Med: DEU/ITA by context; Pacific/CBI: JPN; co-belligerents ITA/HUN/ROU/BGR/
    FIN where applicable; null rather than default German if unclear). High-confidence cue:
    precedence just below an explicit statement, above generic guessing.
    DOES NOT APPLY TO (do NOT infer enemy from italics here):
    - enemy SERVICE BRANCHES / generic terms (*Luftwaffe*, *Wehrmacht*, *Kriegsmarine* are PLAIN,
      not italic — classify by the word, not italics);
    - HIGH COMMANDS / STAFF / HQ abbreviations (OKW, OKH, OB WEST, WFSt, Seekriegsleitung) —
      inconsistent (OKW mostly plain; others italic mainly inside war-diary/KTB citations); classify
      by their German command vocabulary, not italics;
    - ALLIED units (never italicized: Canadian, US Army Air Forces/numbered Air Forces, Airborne,
      US Corps/Divisions, British) — a KNOWN-ALLIED designation OVERRIDES italics;
    - SHIP NAMES — an italic bare vessel (*Quincy*, *Barton*, *Talybont*) is the vessel-name
      convention, attribute by context (often ALLIED), treat as a naval platform (multi-modal rule);
    - CITATION/TITLE italics (book/report/war-diary names) — a unit inside an italic citation is not
      an enemy formation.
    Corpus caveat: for a non-US-military source, defer to the narrator-perspective rule.
  - |
    GENERIC TYPES ARE IN SCOPE — extract both specifically named equipment (M4 Sherman, P-47)
    AND generic equipment references (machine gun, artillery, tank, mine, grenade, barbed wire,
    bayonet, knife, parachute, glider, bombs, small arms). For a generic reference, set name to
    the generic type and fill category/subcategory as best fits. The ONLY things to exclude are
    non-equipment nouns (terrain, buildings that are not fortifications, supplies like food/fuel
    unless they are a weapon system). When in doubt about a military item, INCLUDE it.
  - |
    ENVIRONMENTAL PERFORMANCE — if the source states how this equipment PERFORMED under a
    weather/terrain condition, record it in environmental_performance with condition
    (e.g. "sub-zero temperatures", "snow", "bocage", "mud"), effect (e.g. "performed badly",
    "track wear", "engine overheating"), and the VERBATIM original_text (MANDATORY). This is
    condition-linked PERFORMANCE of the equipment. Do NOT record the event's ambient weather
    here ("it was snowing") — that belongs to the Weather entity, not equipment.
  - |
    CREW ACCOUNTS — if the source narrates a named crew member's firsthand experience
    operating this equipment, record it in crew_accounts with person_name, role,
    observations, and the VERBATIM original_text + book. original_text is MANDATORY —
    source tracking is non-negotiable; never invent an account. Omit if none.
  - |
    IMAGES — if the source places a figure/photo near a mention, default its image_scope
    to "representative": books routinely use GENERIC/STOCK pictures to illustrate the
    equipment TYPE, which do NOT prove the image is of this specific event. Use
    "documentary" ONLY when the source explicitly asserts the image is of THIS engagement
    (e.g. a caption "Shermans of the 2nd Armored at this crossroads, 25 July 1944"). Never
    infer documentary from proximity alone.
  - |
    RELATED EQUIPMENT — record relationships ONLY when the SOURCE TEXT asserts them,
    between this equipment and a DISTINCT piece (its own record):
    - relationship: one of predecessor | successor | variant.
    - name: the distinct related piece (e.g. "M26 Pershing", "M10", "M3 Lee").
    - basis: short/verbatim reason the source relates them (e.g. "76mm gun vs the
      standard 75mm"); null if the source just names the relation.
    - original_text: the verbatim passage asserting it (REQUIRED — traceability).
    DISCRIMINATOR: a sub-designation / modification of the SAME base (M4A1, "the 76mm
    version of the M4", "up-gunned M4") is an INLINE variant -> put it in variants[],
    NOT in related_equipment. Only a DISTINCT piece with its own identity (M26 Pershing,
    M10 Wolverine, M3 Lee) goes in related_equipment. Do NOT invent relationships from
    general knowledge — only what the text states.
  - |
    SUPPORTING UNITS (combined arms) — for units that supported this equipment, give
    unit_name, support_type = the SUPPORTING unit's OWN arm (a P-47 wing supporting a
    tank is "aircraft", NOT the tank's "armor"), and equipment_name if the source names
    the supporting equipment. Omit if none.
  - |
    QUANTITY — record how many of this equipment the source states for THIS mention:
    - Exact number stated ("10 M4 Shermans at the crossroads"): quantity 10, quantity_text "10".
    - Vague count stated ("several Shermans", "a handful", "about a dozen"): quantity null,
      quantity_text the VERBATIM phrase ("several"). NEVER invent a number for a vague count.
    - No count stated: quantity null, quantity_text null.
  - |
    PLACE — set place_name to where this equipment was for THIS mention (e.g. "the
    crossroads in Cherbourg"). Strongly preferred but optional; omit if not stated.
  - |
    ASSERTION GATE — only create a mention when the SOURCE ASSERTS this equipment was
    present. Set assertion_source:
    - "narrative" = the text asserts it ("10 Shermans engaged at the Cherbourg crossroads").
    - "media_narration" = a video/audio NARRATION explicitly asserts it ("5 Shermans
      engaged at Cherbourg").
    DO NOT create a mention from ambient/stock video footage that merely shows or discusses
    a place without asserting this equipment was in that engagement. If a scene covers the
    Cherbourg crossroads but does not say the equipment was there, IGNORE it. Only an
    explicit assertion (narration saying "5 Shermans engaged at Cherbourg") counts.
  - |
    PRESENCE / ABSENCE / SHORTAGE — equipment that was ABSENT or in SHORTAGE is a VALID,
    important fact — EXTRACT it, do NOT drop it. Set presence:
    - "present" = it was there / employed (the default).
    - "absent" = the source states it was NOT there / unavailable ("not a single German plane",
      "no supporting artillery", "the tanks never arrived").
    - "shortage" = present but insufficient ("very few heavy weapons", "a handful of mortars").
    For absent/shortage, set absence_reason to WHY:
    - "battlefield" = combat / air superiority / suppression / destruction prevented it
      ("not a single German plane" because of Allied air control; "no supporting artillery"
      because it was knocked out).
    - "logistics" = a supply / movement / scheduling failure prevented it ("two AA gun battalions
      scheduled for D-Day could not come in until the following day"). A logistics-caused absence
      is ALSO a logistics fact.
    - "unstated" = absence asserted but the cause is not given.
    original_text (the verbatim passage) is MANDATORY for an absence/shortage mention — it is the
    proof of the negative. country_of_origin/operating_country still apply (whose equipment was
    absent). Example: "not a single German plane" → name "aircraft", presence "absent",
    absence_reason "battlefield", operating_country "DEU", original_text "not a single German plane".
  - |
    CONFLICTS & TRACEABILITY — conflicting facts across sources are EXPECTED and allowed
    (one source says 10, another says 5): record each as its own mention; do NOT merge or
    reconcile them. Tracing every fact to its origin is NON-NEGOTIABLE: always populate
    original_text with the verbatim passage/narration the mention came from.
  - "If no equipment found, return empty Equipment array"
  - |
    CONJUNCTIONS = SEPARATE EQUIPMENT. When distinct equipment is joined by "and"/"or" or
    listed with commas, emit ONE Equipment record per item — NEVER a single merged record
    (do NOT put "DD tanks and howitzers" in one name). Examples:
    - "DD tanks and howitzers" -> TWO records: one name "DD tank", one name "howitzer".
    - "rifles, grenades, and mortars" -> THREE records: "rifle", "grenade", "mortar".
    Each item keeps its own category/subcategory and its own original_text.
