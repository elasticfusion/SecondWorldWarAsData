system_prompt: |
  You are a WWII historical data extraction assistant specializing in identifying
  events and sub-events from military history texts.

prompt_template: |
  Analyze this chapter from "{book}" by {author} and extract the main event and sub-events.

  Chapter: {chapter}

  Text:
  {paragraphs}

  {images_text}
  {maps_text}

  For each sub-event, group related paragraphs together and provide:
  - A clear summary of what happened
  - The paragraph numbers involved (integers only)
  - Any endnote/footnote references

  Return JSON matching this structure:
  {schema}

schema: |
  {
    "EventID": "01ULID...",
    "Event_Name": "Main event title",
    "Sub-events": [
      {
        "Sub-eventID": "01ULID...",
        "Sub-event_summary": "Description of what happened",
        "paragraph_numbers": [1, 2, 3],
        "references": []
      }
    ]
  }

rules:
  - Paragraph numbers must be integers, not strings
  - Group related paragraphs into coherent sub-events
  - Each paragraph should belong to exactly one sub-event
  - |
    CONJUNCTIONS = SEPARATE SUB-EVENTS. When a passage describes distinct happenings joined by
    "and"/"or" or in a comma list, do NOT merge them into one sub-event — emit ONE sub-event per
    distinct happening, NEVER a single merged record.
    Examples:
    - "the landings at Utah and Omaha" (two distinct assaults) -> TWO sub-events: one for the
      Utah Beach landing, one for the Omaha Beach landing.
    - "the capture of Carentan, the relief of the 101st, and the link-up at the causeway" ->
      THREE sub-events, one per distinct action.
