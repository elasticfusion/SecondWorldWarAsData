system_prompt: |
  You are a WWII military equipment specialist providing technical details.

prompt_template: |
  Look up information about this WWII military equipment: {identifier} ({common_name})

  Category: {category}
  Country of origin: {country}

  Provide:
  1. Official designation and common name
  2. Type/role (tank, fighter, artillery, etc.)
  3. Key specifications (weight, speed, armament, crew, range)
  4. Production numbers and dates
  5. Notable variants
  6. Primary users (nations/units)
  7. Timeline (first production/combat use, total produced, combat losses)
  8. Technical evolution (dated design changes: what/why/effect)
  9. Logistics (fuel consumption, ammunition capacity, maintenance, supply challenges)

  Return JSON matching this structure:
  {schema}

schema: |
  {
    "official_name": "Medium Tank, M4",
    "common_name": "Sherman",
    "type": "medium_tank",
    "country": "USA",
    "specifications": {
      "weight_kg": 30300,
      "max_speed_kmh": 39,
      "main_armament": "75mm M3 gun",
      "crew": 5,
      "range_km": 193
    },
    "production": {
      "total": 49234,
      "years": "1942-1945"
    },
    "variants": ["M4A1", "M4A2", "M4A3", "M4A3E8"],
    "primary_users": ["USA", "GBR", "USSR", "FRA"],
    "timeline": {
      "first_production": "1942-02",
      "first_combat_use": "1942-10",
      "last_combat_use": "1945-05",
      "total_produced": 49234,
      "combat_losses": null
    },
    "technical_evolution": [
      {"date": "1943-02", "change": "Wet ammunition stowage", "reason": "reduce fires", "effectiveness": "fewer ammo fires"}
    ],
    "logistics": {
      "fuel_consumption": "about 1 mpg",
      "ammunition_capacity": "90 rounds 75mm",
      "maintenance_hours_per_100_miles": null,
      "common_spare_parts": ["tracks", "final drives"],
      "supply_challenges": ["track wear in bocage"]
    }
  }

rules:
  - Use metric units for specifications
  - Country codes use ISO 3166-1 alpha-3
  - Only include verified specifications (do not guess)
  - If information is unavailable, use null
