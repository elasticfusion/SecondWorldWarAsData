system_prompt: |
  You are a WWII bibliography and citation extraction specialist.

prompt_template: |
  Classify and SPLIT each endnote/footnote into its narrative-prose part and its
  bibliographic-citation part(s).

  Event: {event_title} (ID: {event_id})
  Sub-event: {sub_event_summary} (ID: {sub_event_id})

  Text:
  {text}

  Endnote references: {endnote_refs}
  Footnote references: {footnote_refs}
  Endnote content: {endnote_block}
  Reference type: {ref_type_hint}

  For EACH reference, decide its class and SPLIT accordingly:
    - "citation"  — strictly a document reference (book, report, letter, memo, MS #, AAR,
      interview, archival file). Emit ONE entry per cited document with citation metadata.
    - "prose"     — strictly narrative/factual commentary (no document cited). Emit ONE
      entry with the narrative text in "prose_content" (citation left null/omitted).
    - "hybrid"    — narrative commentary AND a cited document in the SAME note. Emit BOTH:
      a "prose" entry carrying the narrative half in "prose_content", AND a separate
      "citation" entry per cited document. Example:
        "Casualties were understated in early reports; see AAR, 9th Inf Div, 15 Nov 44,
         FUSA G-1 file."
      ->  {"classification":"prose",    "prose_content":"Casualties were understated in early reports"}
          {"classification":"citation", "citation":{"title":"AAR, 9th Inf Div, 15 Nov 44, FUSA G-1 file"}}

  For citation entries, extract full citation metadata. For prose entries, set prose_content
  to the narrative text and leave citation fields null.

  Return JSON matching this structure:
  {schema}

schema: |
  {
    "Supplemental_Material": [
      {
        "MaterialID": "01ULID...",
        "classification": "citation",
        "prose_content": null,
        "citation": {
          "author": "Harrison, Gordon A.",
          "title": "Cross-Channel Attack",
          "alt_title": null,
          "publisher": "Center of Military History",
          "publication_date": "1951",
          "first_edition_date": "1951",
          "location": "Washington, D.C.",
          "country": "USA",
          "ISBN": null,
          "pages": "pp. 120-125",
          "volume": null,
          "edition": null,
          "document_type": "book",
          "author_death_date": null
        },
        "availability": "online",
        "resource_urls": ["https://..."],
        "archive_reference": null,
        "license_status": "public_domain"
      },
      {
        "MaterialID": "01ULID...",
        "classification": "prose",
        "prose_content": "Narrative commentary from the note (no document cited).",
        "citation": null,
        "availability": "unknown",
        "resource_urls": [],
        "archive_reference": null,
        "license_status": "unknown"
      }
    ]
  }

rules:
  - Generate 26-character ULIDs using only: 0-9 A-H J-K M-N P-T V-Z
  - "classification is one of citation (document only), prose (narrative only), hybrid (both)"
  - >-
    For a HYBRID note, emit SEPARATE entries: one "prose" entry (prose_content set, citation
    null) AND one "citation" entry per cited document. Never put narrative text in a citation
    entry.
  - prose_content holds the narrative/factual commentary ONLY; null for pure "citation" entries
  - Do NOT fabricate references — only extract what is explicitly cited
  - Distinguish resource URLs (where to find the document) from source URLs (where the text came from)
  - Country codes use ISO 3166-1 alpha-3
  - Availability values: online, offline, archive, unknown
  - License status values: public_domain, copyright, unknown
  - Document type values: book, article, report, letter, memo, periodical, government_document, other
  - Handle mixed entries by splitting into separate items
  - >-
    CRITICAL: When a single footnote/endnote cites MULTIPLE documents separated by semicolons (;)
    or "and", split each into a SEPARATE Supplemental_Material entry. Each entry must reference
    exactly ONE document. Example: "12th AGp Ltr of Instrs 5, 17 Aug; Telecon, Patton to Haislip,
    19 Aug; Sylvan Diary, 19 Aug." becomes THREE separate entries.
  - Do NOT combine multiple documents into one entry just because they appear in the same footnote
  - >-
    For edited volumes (chapters in collected works), use the BOOK title as "title" and the
    chapter title as "alt_title". Example: 'David Ryelandt, "The Resistance Movement," in
    Jan Albert Goris, ed., Belgium under Occupation (New York, 1947)' → title: "Belgium under
    Occupation", alt_title: "The Resistance Movement", author: "Goris, Jan Albert" (editor).
    The book is what we search for, not the chapter.
  - >-
    For ARCHIVAL / primary-source citations written in military shorthand (US Army "Green Book"
    footnotes), expand the abbreviations into a full, human-readable "alt_title" that a catalog
    search could match. Expand unit, document-type, and organizational abbreviations, and where
    you confidently know the person, give their full name. This is semantic interpretation — do
    NOT invent facts; if unsure, expand only what is certain. Examples:
    "See Interv with Collins, 25 Jan 54." → alt_title: "Interview with J. Lawton Collins, 25
    January 1954"; "VII Corps Opns Memo 101, 1 Oct" → "VII Corps Operations Memorandum 101, 1
    October"; "Ltr, Hodges to Gerow, 11 Sep 44, FUSA G-3 file" → "Letter, Courtney Hodges to
    Leonard Gerow, 11 September 1944, First U.S. Army G-3 file"; "MS # B-810" → "Foreign Military
    Studies Manuscript B-810". Keep "title" as the work/series when identifiable, else leave the
    deterministic value; the expanded shorthand goes in "alt_title".
