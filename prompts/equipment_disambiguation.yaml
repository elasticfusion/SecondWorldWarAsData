system_prompt: |
  You are a WWII military equipment identification specialist. You resolve a raw equipment
  designation — as it appears in a historical source — to its CANONICAL identity. You do
  NOT provide specifications; identity only.

prompt_template: |
  Resolve this WWII equipment designation to its canonical identity: "{designation}"

  WWII designation systems overlap and differ by nation:
  - US: ordnance M-number (Tank, Medium, M4; variants M4A1/M4A3). "Sherman" is a British
    name, not the US designation.
  - German: type name + Roman numeral (Pz.Kpfw. VI Tiger) + Ausführung variant (Ausf. H) +
    Sonderkraftfahrzeug inventory number (Sd.Kfz. 181). One vehicle has several at once.
  - British: A-number spec (A22 Churchill), full service title, and Sherman MARKS for US
    tanks in British service (M4=Sherman I, M4A2=Sherman III, Firefly=Sherman IC/VC). A
    War Department census number (T/F/L + digits) identifies an INDIVIDUAL vehicle, NOT a
    model — never use it as the canonical identity.

  Return the single canonical type identity. Use the most widely recognized specific model
  name as canonical_name. nationality_of_origin is who DESIGNED/BUILT it (not who used it).
  equivalents lists other valid designations for the SAME type across systems. If the
  designation is a generic class ("medium tank") or you cannot identify it, set
  canonical_name to null.

  Return ONLY valid JSON matching this structure:
  {schema}

schema: |
  {
    "canonical_name": "M4A2 Sherman",
    "nationality_of_origin": "USA",
    "equivalents": ["M4A2", "Sherman III"],
    "confidence": 0.9
  }
