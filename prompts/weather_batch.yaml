system_prompt: |
  You are a WWII historical weather data extraction specialist. You extract weather and
  sea/light conditions from WWII historical texts, exactly as the text states them.

prompt_template: |
  Extract weather and environmental-condition mentions from these WWII event sub-events.

  Event: {event_name}
  EventID: {event_id}

  {sub_event_blocks}

  WHAT COUNTS (land, air AND sea): sky / cloud and cloud ceiling, visibility (fog, haze,
  smoke-free or not), precipitation, temperature, wind (speed, direction, gusts), sea state
  (heavy seas, swell, surf, choppy water, currents), tide (high/low/rising/falling, rate,
  height), and light conditions ONLY where the text treats the light itself as a condition that
  helped or hindered (moonlight for the drops, darkness that hid a move, sunshine). A time of day
  used as a time ("before dawn the town fell", "at dusk the gliders landed", "with daylight the
  fire grew") is NOT a weather mention. Amphibious and naval narratives describe the weather
  mostly as sea state, wind and tide - extract those.

  For each mention provide:
  - place_name: the place as the text gives it ("Omaha Beach", "off Utah Beach", "the
    Channel", "Portsmouth"); PlaceMentionID ONLY if a places list is given with the text and
    that place is in it - otherwise null
  - date (YYYY-MM-DD) and DateMentionID - see DATES below
  - observation_type:
      "observed"             - conditions that actually occurred
      "forecast"             - a forecast or prediction ("the forecast for 5 June called for...")
      "planning_requirement" - conditions the planners required or assumed ("a late-rising
                               moon and a low tide at dawn were needed")
  - weather_description: what the SOURCE TEXT says, in the document's own terms
  - wind_text: the wind phrase as written ("gusty wind 15-20 knots from the northwest");
    wind_speed_low / wind_speed_high / wind_speed_unit ("knots", "mph", "kmh", "ms",
    "beaufort") and wind_direction ONLY if the text states them ("15-20 knots" -> low 15,
    high 20, unit "knots"; a single value -> low = high)
  - sea_state_text: sea / surf / swell as written ("waves of five to six feet")
  - visibility_text, cloud_text, tide_text, light_text: each as written, when stated
  - temperature, temperature_unit: ONLY if the text explicitly states a temperature
  - precipitation_text: the verbatim precipitation phrase if stated; precipitation_amount /
    unit / type ONLY if the text states a number
  - notable_impact: the operational impact the text describes (e.g. "swamped DD tanks",
    "bombs fell inland of the beach")
  - original_text: {quote_rule}

  CRITICAL RULE - EXTRACT, NEVER INFER: report a specific (temperature, wind speed, wave
  height, precipitation amount, ...) ONLY when the source text states it. Copy what the
  document says; do NOT guess, convert units, average, or invent a value. Unstated
  quantitative specifics come from the deterministic weather APIs (Open-Meteo / NOAA), not
  from you. If the text gives no number, leave the numeric fields null and keep the words.

  DATES - NEVER DROP A MENTION FOR ITS DATE:
  - An exact date stated or unambiguous in context ("D Day" in a Normandy chapter; "that night"
    after the text dates the day) -> that YYYY-MM-DD, and its DateMentionID ONLY if a dates
    list is given with the text (otherwise null).
  - Otherwise (no date, or only an approximate one like "early June") -> date null, and keep
    the mention.
  - A forecast's date is the date it is a forecast FOR.

  Return JSON object keyed by Sub-eventID (shape only - every value in it is a placeholder;
  take every value from the text):
  {schema}

schema: |
  {
    "<Sub-eventID>": [
      {
        "WeatherMentionID": "<ULID>",
        "place_name": "<place as written>",
        "PlaceMentionID": "<ULID from the list, or null>",
        "date": "<YYYY-MM-DD or null>",
        "DateMentionID": "<ULID from the list, or null>",
        "observation_type": "<observed | forecast | planning_requirement>",
        "weather_description": "<what the text says>",
        "wind_text": "<wind phrase as written, or null>",
        "wind_speed_low": "<number stated, or null>",
        "wind_speed_high": "<number stated, or null>",
        "wind_speed_unit": "<knots | mph | kmh | ms | beaufort, or null>",
        "wind_direction": "<as stated, or null>",
        "sea_state_text": "<as written, or null>",
        "visibility_text": "<as written, or null>",
        "cloud_text": "<as written, or null>",
        "tide_text": "<as written, or null>",
        "light_text": "<as written, or null>",
        "temperature": "<number stated, or null>",
        "temperature_unit": "<C | F, or null>",
        "measurement_system": "<metric | imperial, or null>",
        "precipitation_text": "<as written, or null>",
        "precipitation_amount": "<number stated, or null>",
        "precipitation_unit": "<in | cm | mm, or null>",
        "precipitation_type": "<rain | snow | sleet | hail | mixed, or null>",
        "notable_impact": "<impact the text describes, or null>",
        "original_text": "<exact sentence from the document>"
      }
    ]
  }

rules:
  - Sea state, wind, tide, cloud ceiling, visibility and light conditions ARE weather mentions
  - Mark every mention observed / forecast / planning_requirement; a forecast or a planning
    requirement is NEVER reported as observed
  - Keep a mention whose date is missing or approximate (date null); never drop it for the date
  - Link PlaceMentionID and DateMentionID only from lists given with the text; with no list,
    null
  - EXTRACT specifics only when the TEXT STATES them (verbatim-grounded); NEVER infer,
    convert, or invent a number — unstated specifics come from the weather APIs
  - temperature_unit is "C" or "F"; measurement_system is "metric" or "imperial"
  - Return empty arrays for sub-events with no weather mentions
  - |
    CONJUNCTIONS = SEPARATE WEATHER MENTIONS. When distinct places or dates are joined by
    "and"/"or" or in a comma list, emit ONE weather mention per place/date — NEVER a single
    merged record spanning several. Examples:
    - "snow fell on Bastogne and Noville" -> TWO mentions, one place_name "Bastogne", one
      "Noville" (each with its own PlaceMentionID).
    - "heavy surf off Omaha and Utah Beaches" -> TWO mentions, one per beach.
