system_prompt: |
  You are a WWII military organization and people group extraction specialist.
  Extract military units, countries, alliances, and organizations from historical texts.

prompt_template: |
  Extract all people groups mentioned in these events.

  For each group, provide:
  - group_name: Official name
  - group_type: One of: country, alliance, military_unit, political_party, government_organization, anti_government_organization, religious_organization
  - military_hierarchy: (if military_unit) squad/platoon/company/battalion/regiment/brigade/division/corps/army/army_group
  - country_of_origin: ISO 3166-1 alpha-3 country code (e.g., USA, GBR, DEU, FRA, ITA, JPN)
  - alliance_membership: List of alliances (e.g., ["Axis Powers"], ["Allied Powers"])
  - description: Brief description
  - parent_organization: (if applicable) Parent unit/organization
  - member_countries: (if alliance) List of member countries
  - sub_organizations: (if applicable) List of sub-organizations
  - common_name: (if different from official name)
  - members: List of people associated with this group (commanders, leaders, key personnel)

  For each member, include:
  - PersonID: ULID of the person (if mentioned in events)
  - name: Person's name
  - role: Their role/position/rank in the group (e.g., "Commander", "Member", "Leader", "Major", "General")
  - date_range: When they held this position (if mentioned)

  For each mention, include:
  - Event_Name, EventID, Sub-event_Name, Sub-eventID
  - date (if mentioned)
  - context: Role/action in this event
  - original_text: Exact quote mentioning the group

  Events:
  {text}

  Return ONLY valid JSON matching this structure:
  {schema}

schema: |
  {
    "People_Groups": [
      {
        "group_name": "2nd Infantry Division",
        "group_type": "military_unit",
        "military_hierarchy": "division",
        "country_of_origin": "USA",
        "alliance_membership": ["Allied Powers"],
        "source_language": "English",
        "description": "US Army infantry division",
        "parent_organization": "V Corps",
        "member_countries": null,
        "sub_organizations": [],
        "common_name": "Indianhead Division",
        "members": [
          {
            "name": "Maj. Gen. Walter M. Robertson",
            "role": "Commander",
            "date_range": "1943-1945"
          }
        ],
        "event_mentions": [
          {
            "Event_Name": "Battle of the Bulge",
            "EventID": "01ULID...",
            "Sub-event_Name": "Defense of Elsenborn Ridge",
            "Sub-eventID": "01ULID...",
            "date": "1944-12-17",
            "context": "defending_force",
            "original_text": "The 2nd Infantry Division held its positions on Elsenborn Ridge"
          }
        ]
      }
    ]
  }

rules:
  - group_type values: country, alliance, military_unit, political_party, government_organization, anti_government_organization, religious_organization
  - military_hierarchy values: squad, platoon, company, battalion, regiment, brigade, division, corps, army, army_group
  - Country codes use ISO 3166-1 alpha-3 (USA, GBR, DEU, FRA, ITA, JPN, etc.)
  - Use official military designations (e.g., "80th Infantry Division" not "80th Division")
  - Include both Allied and Axis organizations
  - |
    ITALICS = ENEMY TACTICAL FORMATION (US Army "Green Book" typographic convention). In US-military-
    authored histories, a SPECIFIC ENEMY ORDER-OF-BATTLE FORMATION is printed in *italics* (markdown
    `*...*`). This is a STRONG, DETERMINISTIC signal — BUT it is NARROW. Confirmed by the corpus:
    - IT MARKS: numbered OR named enemy TACTICAL FIELD formations — *352d Division*, *Seventh Army*,
      *LXXXIV Corps*, *12th SS Panzer Division*, *6th Parachute Regiment*, *5th Torpedo Boat
      Flotilla*, and NAMED battlegroups/divisions like *Panzer Lehr*, *Kampfgruppe Meyer*. (In the
      corpus these are ~100% italic / 0% plain — a rock-solid cue.) Extract EVERY such italic
      formation as its own group, alliance_membership ["Axis Powers"].
    - IT DOES **NOT** reliably MARK (do NOT infer enemy/Axis from italics for these — classify them
      by their WORDS, not by italics):
      * ENEMY SERVICE BRANCHES / generic national terms — *Luftwaffe*, *Wehrmacht*, *Kriegsmarine*,
        "German Army/Navy", "the Germans" are PLAIN even though German. (Verified: Luftwaffe is NOT
        italicized.)
      * HIGH COMMANDS / STAFF / HQ abbreviations — OKW, OKH, OB WEST, WFSt, Seekriegsleitung,
        Generalquartiermeister are INCONSISTENT (OKW is mostly plain; others appear italic mainly
        inside war-diary/KTB CITATIONS, not as the formation convention). Treat these as enemy by
        their German command vocabulary, NOT by italics.
      * ALLIED units of ANY kind — they are NEVER italicized by this convention: 3d Canadian
        Division, Eighth/Ninth Air Force (US Army Air Forces), 82d/101st Airborne, US Corps/Divisions,
        British units. If you see a KNOWN-ALLIED designation, it is friendly regardless of any italics
        around it (any italics there are a CITATION/title, not the enemy convention).
      * SHIP NAMES — an italic bare vessel proper-noun (*Quincy*, *Augusta*, *Barton*, *Talybont*,
        *Satterlee*) is the separate ship-name convention, NOT an enemy marker; attribute by context
        (often ALLIED) and handle as a naval platform (see the multi-modal ship rule).
      * CITATION / TITLE italics — book titles, report names, and war-diary citations (KTB …,
        "V Corps History", "My Three Years with Eisenhower") are also italic. A US/Allied unit name
        appearing INSIDE an italic citation is NOT an enemy formation.
    - NATIONALITY: resolve the specific enemy country by theater + context — do NOT default to German.
      ETO: DEU. Med: DEU or ITA by context. Pacific/CBI: JPN. Co-belligerents ITA/HUN/ROU/BGR/FIN
      where applicable. If the specific Axis nationality is unclear, mark alliance ["Axis Powers"] and
      leave country_of_origin null rather than guessing.
    - PRECEDENCE: an EXPLICIT nationality statement wins; a KNOWN-ALLIED designation OVERRIDES italics
      (never tag it Axis); otherwise an italic FORMATION is a high-confidence enemy cue above generic
      guessing. Do NOT drop italic enemy formations — they are frequently under-extracted; extract all.
    - Corpus caveat: the convention is US-Green-Book-specific. For a non-US-military source, defer to
      the narrator-perspective rule rather than assuming italics = Axis.
  - If no people groups found, return empty People_Groups array
  - |
    CONJUNCTIONS = SEPARATE GROUPS. When distinct units/organizations are joined by "and"/"or"
    or in a comma list — including a SHARED trailing noun ("Divisions") — emit ONE People_Groups
    record per unit with its FULL official group_name, NEVER a single merged record. Examples:
    - "101st and 82d Airborne Divisions" -> TWO groups: group_name "101st Airborne Division" and
      group_name "82d Airborne Division" (distribute the shared "Airborne Division" to each).
    - "Force U, Force O, and Force B" -> THREE groups, one per force.
