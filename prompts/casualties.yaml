system_prompt: |
  You are a WWII casualty data extraction specialist.
  Casualties are about PEOPLE — killed, wounded, missing, captured.
  Do NOT include equipment or materiel losses. Those belong in a separate entity.

prompt_template: |
  Extract personnel casualty information from these WWII sub-events.
  Casualties are about PEOPLE only — not equipment, vehicles, or materiel.

  Available entities (COPY these IDs exactly — do NOT generate new ones):
  {entity_context}

  Sub-events:
  {sub_event_block}

  Return JSON keyed by Sub-eventID matching this structure:
  {schema}

schema: |
  {
    "SUB_EVENT_ID": [
      {
        "type": "casualties",
        "side": "allied",
        "nationality": "USA",
        "description": "Heavy losses during assault on Hill 192",
        "count": {
          "killed": {"value": 45, "qualifier": "exact"},
          "wounded": {"value": 120, "qualifier": "approximately"},
          "missing": {"value": 10, "qualifier": "exact"},
          "captured": {"value": 0, "qualifier": "exact"},
          "total": {"value": 175, "qualifier": "exact"}
        },
        "date_string": "1944-07-11",
        "impacted_organizations": [
          {"name": "2nd Infantry Division", "PeopleGroupID": "<COPY from Available entities > Organizations, or null>", "nationality": "USA", "role": "attacking_force"}
        ],
        "impacted_people": [
          {"name": "Colonel Smith", "PersonID": "<COPY from Available entities > People, or null>", "casualty_type": "wounded"}
        ],
        "impacted_places": [{"name": "Hill 192", "PlaceID": "<COPY from Available entities > Places, or null>"}],
        "impacted_equipment": [{"name": "M4 Sherman", "EquipmentID": "<COPY from Available entities > Equipment, or null>", "relation": "causative"}]
      },
      {
        "type": "non_battle",
        "cause": "weather_exposure",
        "description": "45 men suffered trench foot and frostbite",
        "count": {"affected": {"value": 45, "qualifier": "approximately"}},
        "date_string": "1944-12-21",
        "PlaceID": "<COPY from Available entities > Places, or null>",
        "original_text": "Forty-five men of the company were evacuated with trench foot and frostbite",
        "impacted_places": [{"name": "Bastogne", "PlaceID": "<COPY ...>"}]
      },
      {
        "type": "non_battle",
        "cause": "weather_exposure",
        "description": "frostbite",
        "PersonID": "<COPY from Available entities > People, or null>",
        "PlaceID": "<COPY from Available entities > Places, or null>",
        "date_string": "1944-12-21",
        "original_text": "Sergeant Smith suffered frostbite at Bastogne",
        "impacted_people": [{"name": "Sergeant Smith", "PersonID": "<COPY ...>", "casualty_type": "non_battle"}]
      }
    ]
  }

rules:
  - CRITICAL: For PeopleGroupID, match the organization name to "Available entities > Organizations" and COPY the ID. If no exact match, try partial match (e.g., "80th Division" matches "80th Infantry Division"). If no match, use null.
  - CRITICAL: For PersonID, match the person name to "Available entities > People" and COPY the ID. If no match, use null.
  - CRITICAL: For PlaceID, match the place name to "Available entities > Places" and COPY the ID. If no match, use null.
  - Type values: wounded, killed, casualties, pow, missing, non_battle
  - |
    CAUSE — classify HOW the casualty occurred: combat, weather_exposure, disease,
    accident, or other. Weather/environmental injuries (frostbite, trench foot, exposure,
    hypothermia) are type "non_battle" + cause "weather_exposure". This applies at BOTH
    granularities and both are relevant:
    - AGGREGATE: "45 men had trench foot and frostbite" -> non_battle, weather_exposure,
      count {affected: 45}, PlaceID + date (no PersonID — it's a group).
    - INDIVIDUAL: "Sergeant Smith had frostbite" -> non_battle, weather_exposure, PersonID
      (match from Available entities), PlaceID + date.
    Set original_text to the VERBATIM passage (traceability). Set PlaceID + date when stated
    so the casualty can be joined to weather/location.
  - Side values: allied, axis, civilian, unknown — reflects who SUFFERED the casualties
  - >-
    nationality: the ISO 3166-1 alpha-3 code of WHO suffered the casualties when the text names
    a specific country ("200 Americans killed" -> "USA"; "400 Germans" -> "DEU"). This is the
    primary attribution; side is the coarse fallback. If only a coalition is identifiable
    ("Allied losses") leave nationality null and set side. If neither is stated, leave both
    null/unknown.
  - >-
    ONE casualty record PER side/nationality. If a single sub-event reports BOTH sides' losses
    (e.g. "200 Americans were killed as compared to 400 Germans"), emit TWO separate records —
    one (nationality "USA", side "allied", killed 200) and one (nationality "DEU", side "axis",
    killed 400) — never combine opposing losses into one record.
  - POW entries MUST include both "captured" (the prisoners) and "captor" (who captured them) organizations
  - Country codes use ISO 3166-1 alpha-3
  - If no casualties found for a sub-event, return empty array for that key
  - |
    CONJUNCTIONS = SEPARATE ENTITIES. Within a casualty record, when distinct organizations,
    people, places, or equipment are joined by "and"/"or" or in a comma list, emit ONE object per
    item in the relevant list (impacted_organizations, impacted_people, impacted_places,
    impacted_equipment) — NEVER a single merged entry. Examples:
    - "losses in the 101st and 82d Airborne Divisions" -> impacted_organizations has TWO entries:
      {"name": "101st Airborne Division", ...} and {"name": "82d Airborne Division", ...}.
    - "casualties at St. Lô, Carentan, and Isigny" -> impacted_places has THREE entries, one per
      place. (This is distinct from the per-side/nationality rule above, which still applies.)
  - Do NOT include equipment or materiel losses — only personnel casualties
  - The impacted_equipment field is CONTEXT only -- equipment INVOLVED in a PERSONNEL
    casualty. Set relation to causative (the vehicle/weapon that caused it), medical
    (ambulance/surgical/evacuation equipment responding), or other. This is NOT a list of
    destroyed equipment (that is the Equipment entity's job). Omit when no specific
    equipment is tied to the casualty.
  - The impacted_logistics field links a casualty to a supply/transport failure the SOURCE
    explicitly ties to it (e.g. deaths from a fuel/ammo shortage or no winter clothing).
    Provide a LogisticsID if known, else a short description. Omit when the text does not
    tie the casualty to a logistics problem (co-occurring links are inferred automatically).
  - Count qualifier values: exact, approximately, greater_than, less_than, unknown
  - |
    CASUALTY GRANULARITY — casualties come at MULTIPLE levels of specificity and EACH is a
    separate, valid record. Do NOT require a number, and do NOT collapse different-scope facts.
    Extract ALL of these (a chapter describing an assault has many):
    - NUMERIC count ("eighteen casualties", "about four thousand", "only two casualties from
      enemy fire") -> count fields as usual, scoped to the stated unit.
    - QUALITATIVE / COMPARATIVE (NO number) -> still a record. Put the verbatim phrase in
      description + set magnitude ("heavy","light","moderate","severe") and is_comparative true
      when it compares groups. Examples: "casualties generally were heavier among those who delayed
      in getting up onto the beach" (magnitude "heavy", comparative); "extraordinarily light
      casualties on UTAH Beach" (magnitude "light").
    - PERCENTAGE / RATE ("Casualties to the engineers amounted to about 40 percent for the day")
      -> record with count.rate {value: 40, unit: "percent", basis: "the engineers", period:
      "for the day"} (or put the rate in description if the structure doesn't fit) — a rate is a
      valid casualty magnitude even without an absolute number.
    - MULTIPLE PER PASSAGE / NESTED SCOPE — one passage often states casualties at DIFFERENT unit
      scopes; emit ONE record PER scope. E.g. "scattered landings and heavy casualties left the
      first boat sections [of the 16th Infantry] incapable ... [but] Four boat sections of the 2d
      Battalion, 16th Infantry ... crossed the beach with only two casualties from enemy fire" ->
      TWO records: (a) 16th Infantry, magnitude "heavy", qualitative; (b) 2d Battalion 16th
      Infantry, count 2, cause "combat"/enemy fire, magnitude "light". Different unit, number,
      cause, and magnitude — never merge them.
    - ABSENCE / NEGATION ("they had suffered no casualties", "no losses") -> a VALID record:
      magnitude "none", count.total {value: 0, qualifier: "exact"}, with original_text. Do NOT drop.
    - IMPLIED / EUPHEMISTIC loss language — casualties are OFTEN stated WITHOUT the word
      "casualty" and WITHOUT a number; these STILL count. "virtually knocked Company A out of the
      battle" (Company A, magnitude "severe"); "hard hit ... took two hours to assemble survivors"
      (heavy weapons company, magnitude "heavy" — "survivors" implies losses); "decimated", "wiped
      out", "cut to pieces", "only one company survived as an organized group". Extract each as a
      casualty record scoped to its unit. A passage describing an assault that lists SEVERAL units
      at different fates (one knocked out, one pinned, one hard hit, one with few casualties) =
      ONE record PER unit — e.g. right-flank passage -> separate records for Company A (severe),
      the battalion HQ company (pinned by small-arms fire), the heavy weapons company (heavy), and
      Company C ("with few casualties" -> magnitude "light"). Do not reduce a multi-unit passage to
      one record.
    original_text (verbatim) is MANDATORY on every casualty record — it is the provenance anchor;
    a casualty with no source text/linkable event is an ORPHAN and will be rejected.
