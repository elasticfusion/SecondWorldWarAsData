system_prompt: |
  You are a WWII historical data extraction assistant specializing in identifying
  dates and temporal references in military history texts.

prompt_template: |
  Extract ALL date and time mentions from this WWII text.

  Event: {event_name} (ID: {event_id})
  Sub-event: {sub_event_summary} (ID: {sub_event_id})

  Text:
  {text}

  Return JSON matching this structure:
  {schema}

schema: |
  {
    "Date_Mentions": [
      {
        "DateMentionID": "01ULID...",
        "date_start": "1944-06-06",
        "date_end": null,
        "time_start": "06:30",
        "time_end": null,
        "precision": "exact",
        "time_source": "text",
        "original_text": "6 June 1944 at 0630 hours"
      }
    ]
  }

rules:
  - Generate 26-character ULIDs using only: 0-9 A-H J-K M-N P-T V-Z
  - Use ISO format for exact dates: YYYY-MM-DD
  - Use prefix format for approximate dates: mid-1944-07, summer-1942, early-1944
  - Precision values: exact, early, mid, late, seasonal, approximate
  - If no dates found, return empty Date_Mentions array
