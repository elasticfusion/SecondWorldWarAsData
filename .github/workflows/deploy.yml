name: Build & Deploy

on:
  # NOTE: the automatic push trigger is DISABLED (2026-10-02). This CI deploy path
  # requires AWS OIDC that is not yet provisioned in the account (no GitHub OIDC
  # provider, no repo-scoped deploy role, AWS_DEPLOY_ROLE_ARN secret unset), so it
  # failed at "Configure AWS credentials" on every push. Deploys currently run via
  # the local operator script (scripts/deploy_all.sh + the `wwii` AWS profile).
  # To RE-ENABLE: provision the OIDC provider + a least-privilege role scoped to
  # repo:elasticfusion/SecondWorldWarAsData (ideally the main branch), set the
  # AWS_DEPLOY_ROLE_ARN secret, then restore the `push:` block below.
  #
  # push:
  #   branches: [main]
  #   paths:
  #     - "src/**"
  #     - "scripts/**"
  #     - "prompts/**"
  #     - "lambda_handlers/**"
  #     - "cloudformation/**"
  #     - "Dockerfile"
  #     - "config.yaml"
  #     - "requirements.txt"
  #     - "requirements-lambda.txt"
  #     - "ecs_entrypoint.py"
  #     - "phase*.py"
  workflow_dispatch:
    inputs:
      deploy_target:
        description: "What to deploy"
        required: true
        type: choice
        options:
          - all
          - container-only
          - lambdas-only
          - cloudformation-only

env:
  AWS_REGION: us-east-1
  ECR_REPO: wwii-pipeline
  ECS_CLUSTER: dev-wwii-pipeline
  TEMPLATE_BUCKET: wwii-pipeline-deploy
  ENV_NAME: dev

permissions:
  id-token: write
  contents: read

jobs:
  # ─── Gate: tests must pass before any deploy ───
  test:
    uses: ./.github/workflows/tests.yml

  # ─── Build container image ───
  build-container:
    needs: test
    if: >
      github.event_name == 'push' ||
      github.event.inputs.deploy_target == 'all' ||
      github.event.inputs.deploy_target == 'container-only'
    runs-on: ubuntu-latest
    outputs:
      image_uri: ${{ steps.push.outputs.image_uri }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        run: docker build --no-cache --build-arg GIT_SHA=${{ github.sha }} -t ${{ env.ECR_REPO }}:${{ github.sha }} .

      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ECR_REPO }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: 1
          format: table

      - name: Push to ECR
        id: push
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          # the stack gets the image by digest, pinned through the run's unique deploy- tag
          # (scripts/image_pin.sh, shared with scripts/deploy_all.sh). PREREQUISITE: this role cannot
          # set the repos' lifecycle policy; scripts/deploy_all.sh must have run once to set it.
          DEPLOY_TAG="deploy-$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_SHA:0:12}"
          docker tag ${{ env.ECR_REPO }}:${{ github.sha }} "$REGISTRY/${{ env.ECR_REPO }}:$DEPLOY_TAG"
          docker tag ${{ env.ECR_REPO }}:${{ github.sha }} "$REGISTRY/${{ env.ECR_REPO }}:latest"
          docker push "$REGISTRY/${{ env.ECR_REPO }}:$DEPLOY_TAG"
          docker push "$REGISTRY/${{ env.ECR_REPO }}:latest"
          REGION="$AWS_REGION" ECR_REPO="$REGISTRY"
          source scripts/image_pin.sh
          note_built "${{ env.ECR_REPO }}"
          IMAGE_URI=$(pin_image "${{ env.ECR_REPO }}")
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

  # ─── Build and deploy Lambda code ───
  deploy-lambdas:
    needs: test
    if: >
      github.event_name == 'push' ||
      github.event.inputs.deploy_target == 'all' ||
      github.event.inputs.deploy_target == 'lambdas-only'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build Lambda package
        run: |
          pip install -r requirements-lambda.txt -t lambda_package/ -q
          cp -r src/ lambda_handlers/ scripts/ prompts/ config.yaml lambda_package/
          cd lambda_package && zip -r ../lambda-code.zip . -x "*.pyc" "*__pycache__*" > /dev/null

      - name: Upload to S3
        run: aws s3 cp lambda-code.zip "s3://${{ env.TEMPLATE_BUCKET }}/lambda/code.zip"

      - name: Update Lambda functions
        run: |
          for fn in dedup-gate dedup-ui openserp-manager nat-manager metrics batch-poller; do
            echo "Updating ${{ env.ENV_NAME }}-wwii-${fn}..."
            aws lambda update-function-code \
              --function-name "${{ env.ENV_NAME }}-wwii-${fn}" \
              --s3-bucket "${{ env.TEMPLATE_BUCKET }}" \
              --s3-key lambda/code.zip > /dev/null
          done

  # ─── Deploy CloudFormation ───
  deploy-cloudformation:
    needs: [build-container, deploy-lambdas]
    if: >
      always() &&
      (github.event_name == 'push' ||
       github.event.inputs.deploy_target == 'all' ||
       github.event.inputs.deploy_target == 'cloudformation-only') &&
      !contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Lint CloudFormation
        run: |
          pip install cfn-lint==1.48.1
          cfn-lint cloudformation/*.yaml

      - name: Upload templates to S3
        run: aws s3 sync cloudformation/ "s3://${{ env.TEMPLATE_BUCKET }}/cloudformation/"

      - name: Deploy stack
        env:
          PIPE: ${{ needs.build-container.outputs.image_uri }}
        run: |
          # ClamAV is mandatory (AvImageUri has no default): the scanner image in this account's ECR
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGION="$AWS_REGION" ECR_REPO="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          DEPLOY_TAG="deploy-$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_SHA:0:12}"
          source scripts/image_pin.sh
          AV_IMAGE_URI=$(pin_image wwii-clamav)
          aws cloudformation deploy \
            --stack-name "wwii-pipeline-${{ env.ENV_NAME }}" \
            --template-file cloudformation/main.yaml \
            --parameter-overrides \
              EnvironmentName=${{ env.ENV_NAME }} \
              TemplateBucket=${{ env.TEMPLATE_BUCKET }} \
              LambdaCodeBucket=${{ env.TEMPLATE_BUCKET }} \
              LambdaCodeKey=lambda/code.zip \
              PipelineImageUri=${{ needs.build-container.outputs.image_uri || '' }} \
              AvImageUri="$AV_IMAGE_URI" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset
          # the stack must run the pins; only then are they live-<env> (no lifecycle rule selects it)
          PINS=("AvImageUri=$AV_IMAGE_URI")
          [ -n "$PIPE" ] && PINS+=("PipelineImageUri=$PIPE")
          verify_stack_images "wwii-pipeline-${{ env.ENV_NAME }}" "${PINS[@]}"
          mark_live "${{ env.ENV_NAME }}" "${PINS[@]#*=}"
