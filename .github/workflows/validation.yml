name: Data Validation

on:
  push:
    branches: [main, master]
    paths:
      - "output/**"
      - "src/json_schemas.py"
      - "src/schemas/**"
      - "scripts/validation_report.py"
  pull_request:
    branches: [main, master]
    paths:
      - "output/**"
      - "src/json_schemas.py"
      - "src/schemas/**"
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate People Data
        if: hashFiles('output/people/*.json') != ''
        run: |
          python scripts/validation_report.py validate output/people \
            --schema people --format html \
            --output reports/people_validation.html --save-history

      - name: Validate Equipment Data
        if: hashFiles('output/equipment/*.json') != ''
        run: |
          python scripts/validation_report.py validate output/equipment \
            --schema equipment --format html \
            --output reports/equipment_validation.html --save-history

      - name: Validate Events Data
        if: hashFiles('output/content/**/events_*.json') != ''
        run: |
          python scripts/validation_report.py validate output/content \
            --schema event --format html \
            --output reports/events_validation.html --save-history

      - name: Validate Places Data
        if: hashFiles('output/places/*.json') != ''
        run: |
          python scripts/validation_report.py validate output/places \
            --schema places --format html \
            --output reports/places_validation.html --save-history

      - name: Validate Dates Data
        if: hashFiles('output/dates/*.json') != ''
        run: |
          python scripts/validation_report.py validate output/dates \
            --schema dates --format html \
            --output reports/dates_validation.html --save-history

      - name: Validate Logistics Data
        if: hashFiles('output/logistics/*.json') != ''
        run: |
          python scripts/validation_report.py validate output/logistics \
            --schema logistics --format html \
            --output reports/logistics_validation.html --save-history

      - name: Validate Casualties Data
        if: hashFiles('output/casualties/*.json') != ''
        run: |
          python scripts/validation_report.py validate output/casualties \
            --schema casualties --format html \
            --output reports/casualties_validation.html --save-history

      - name: Validate Weather Data
        if: hashFiles('output/weather/*.json') != ''
        run: |
          python scripts/validation_report.py validate output/weather \
            --schema weather --format html \
            --output reports/weather_validation.html --save-history

      - name: Validate Bibliography Data
        if: hashFiles('output/bibliography/*.json') != ''
        run: |
          python scripts/validation_report.py validate output/bibliography \
            --schema bibliography --format html \
            --output reports/bibliography_validation.html --save-history

      - name: Validate Maps Data
        if: hashFiles('output/maps/*.json') != ''
        run: |
          python scripts/validation_report.py validate output/maps \
            --schema maps --format html \
            --output reports/maps_validation.html --save-history

      - name: Validate People Groups Data
        if: hashFiles('output/people_groups/*.json') != ''
        run: |
          python scripts/validation_report.py validate output/people_groups \
            --schema people_groups --format html \
            --output reports/people_groups_validation.html --save-history

      - name: Generate Trends Report
        if: always() && hashFiles('validation_history.json') != ''
        run: |
          python scripts/validation_report.py trends --output reports/trends.html

      - name: Upload Validation Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: reports/*.html
          retention-days: 30

      - name: Upload Validation History
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-history
          path: validation_history.json
          retention-days: 90

      - name: Comment PR with Results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            let comment = '## 📊 Data Validation Report\n\n';
            try {
              const history = JSON.parse(fs.readFileSync('validation_history.json', 'utf8'));
              const latest = history[history.length - 1];
              comment += `| Schema | Total | Valid | Invalid |\n|--------|-------|-------|--------|\n`;
              comment += `| ${latest.schema} | ${latest.total} | ✅ ${latest.valid} | ❌ ${latest.invalid} |\n`;
              comment += `\n**Success Rate:** ${(latest.valid / latest.total * 100).toFixed(1)}%\n`;
            } catch (e) {
              comment += 'No validation data available for this run.';
            }
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
