name: Data Validation

on:
  push:
    branches: [main, master]
    paths:
      - "tests/fixtures/validation/**"
      - "src/json_schemas.py"
      - "src/schemas/**"
      - "src/utils/schema_registry.py"
      - "scripts/validation_report.py"
  pull_request:
    branches: [main, master]
    paths:
      - "tests/fixtures/validation/**"
      - "src/json_schemas.py"
      - "src/schemas/**"
      - "src/utils/schema_registry.py"
      - "scripts/validation_report.py"
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write # required for the "Comment PR with Results" step

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Validate the committed sample fixtures (one minimal + one fully-expanded
      # record per classification). The real output/** dataset is git-ignored
      # (S3-backed, disposable), so these fixtures are what CI validates against.
      # Data-driven: every tests/fixtures/validation/<schema>/ dir is validated,
      # so adding a category needs no workflow edit.
      - name: Validate sample fixtures against schemas
        env:
          PYTHONPATH: . # make 'src' importable when running the script directly
        run: |
          set -euo pipefail
          mkdir -p reports
          status=0
          for dir in tests/fixtures/validation/*/; do
            schema="$(basename "$dir")"
            [ -f "$dir/sample.json" ] || continue
            echo "::group::validate $schema"
            if ! python scripts/validation_report.py validate "$dir" \
                --schema "$schema" --format html \
                --output "reports/${schema}_validation.html" --save-history; then
              echo "::error::validation failed for schema '$schema'"
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status

      - name: Generate Trends Report
        if: always() && hashFiles('validation_history.json') != ''
        run: |
          python scripts/validation_report.py trends --output reports/trends.html

      - name: Upload Validation Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: reports/*.html
          retention-days: 30

      - name: Upload Validation History
        if: always() && hashFiles('validation_history.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: validation-history
          path: validation_history.json
          retention-days: 90

      - name: Comment PR with Results
        if: github.event_name == 'pull_request'
        continue-on-error: true # cosmetic report; never fail validation on comment errors
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let comment = '## 📊 Data Validation Report\n\n';
            try {
              const history = JSON.parse(fs.readFileSync('validation_history.json', 'utf8'));
              comment += `| Schema | Total | Valid | Invalid |\n|--------|-------|-------|--------|\n`;
              // Summarize the latest entry per schema.
              const latestBySchema = {};
              for (const h of history) { latestBySchema[h.schema] = h; }
              for (const schema of Object.keys(latestBySchema).sort()) {
                const h = latestBySchema[schema];
                comment += `| ${schema} | ${h.total} | ✅ ${h.valid} | ❌ ${h.invalid} |\n`;
              }
            } catch (e) {
              comment += 'No validation data available for this run.';
            }
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
