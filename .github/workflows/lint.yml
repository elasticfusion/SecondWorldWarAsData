name: Lint

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-ci.txt

      - name: Black (formatting)
        run: python -m black --check --diff src/ tests/ scripts/ lambda_handlers/ *.py

      - name: Pylint
        run: |
          python -m pylint \
            --disable=C0301,C0103,R0913,R0914,R0915,W0511,R0917,W0718,W0212,W1203,C0415 \
            --fail-under=5.0 \
            src/

      - name: Mypy (type checking)
        run: python -m mypy src/ --ignore-missing-imports --no-strict-optional

      - name: Bandit (security)
        run: python -m bandit -r src/ lambda_handlers/ -ll -q

      - name: Radon (complexity)
        run: python -m radon cc src/ --min C --show-complexity --total-average

      - name: Vulture (dead code)
        run: python -m vulture src/ .vulture_whitelist.py --min-confidence 80

      - name: CloudFormation lint
        run: cfn-lint cloudformation/*.yaml

      - name: pip-audit (dependency vulnerabilities)
        run: |
          pip install pip-audit
          # Ignore PYSEC-2026-2447 (CVE-2025-69872, GHSA-w8v5-vhqr-4h9v): diskcache
          # <=5.6.3 pickle-deserialization RCE. No fixed version exists (5.6.3 is
          # latest), and the threat model — attacker WRITE access to the cache
          # directory — does not apply here (caches live in app-owned local dirs /
          # ECS ephemeral /tmp / private S3, not attacker-writable). Re-evaluate if
          # diskcache ships a fix or the cache backend changes.
          pip-audit -r requirements.txt --ignore-vuln PYSEC-2026-2447
          pip-audit -r requirements-lambda.txt --ignore-vuln PYSEC-2026-2447
