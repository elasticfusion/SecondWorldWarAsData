# Country-specific award-citation source registry.
#
# This is the EDITABLE catalog of authoritative award sources per country. Add a
# country / fix a URL / tune a crawl-delay HERE (data), not in code. The fetch +
# parse logic lives in src/enrichment/award_*source.py adapters keyed by `adapter`.
#
# Fields per source:
#   id            unique id (used in provenance source_name if name absent)
#   name          human-readable source name (stored in MilitaryAward.source_name)
#   nationality   ISO-ish nationality gate; the source runs only for people of this
#                 nationality (USA|GBR|DEU|...). Matched case-insensitively.
#   adapter       which fetch/parse adapter implements it:
#                   hall_of_valor | london_gazette | victoria_cross_online | offline
#   base_url      site root
#   search_path   search path template; {q} = URL-encoded person name
#   crawl_delay   seconds between requests (politeness; honor site robots)
#   awards        award types this source carries citation TEXT for (hint/doc)
#   language      source citation language (English|German|French|...). Non-English
#                 citation text is translated to English on attach (original kept in
#                 MilitaryAward.citation_text_original + citation_language).
#   accessible    from AWS with the full browser header profile? (probe result)
#   enabled       whether the source is active
#   dataset_path  (offline adapter only) local JSON dataset of citations
#   notes         freeform
#
# Access facts verified 2026-10-02 from AWS Lambda + full browser headers
# (src/utils/http_pool.browser_headers). valor.defense.gov EXCLUDED: Akamai 403s
# the AWS IP even with full headers AND it carries name-lists only (no citations).

sources:
  # ---------------- United States ----------------
  - id: us_hall_of_valor
    name: Military Times Hall of Valor
    nationality: USA
    language: English
    adapter: hall_of_valor
    base_url: https://valor.militarytimes.com
    search_path: "/?s={q}"
    crawl_delay: 1.1
    awards: [Medal of Honor, Distinguished Service Cross, Navy Cross, Silver Star]
    accessible: true
    enabled: true
    notes: >-
      Largest US valor citation DB. MoH + all service crosses complete; Silver Star
      partial. Primary US source. Recipient pages at /recipient/recipient-<id>/.

  # ---------------- United Kingdom ----------------
  - id: uk_london_gazette
    name: The London Gazette
    nationality: GBR
    language: English
    adapter: london_gazette
    base_url: https://www.thegazette.co.uk
    search_path: "/all-notices/notice?text={q}"
    crawl_delay: 10          # robots Crawl-delay: 10 — honor it
    awards: [Victoria Cross, George Cross, Distinguished Service Order, Distinguished Flying Cross, George Medal]
    accessible: true         # 200 from AWS with full headers
    enabled: true
    notes: >-
      Official citation wording. Fetch the HTML notice page only — robots DISALLOWS
      /notice/*/data.xml, /notice/*/data.pdf, /notice/*/version/*. VC/GC/DSO/DFC
      usually carry a citation; DCM/MM are often name-only (full text in WO 373).

  - id: uk_victoria_cross_online
    name: Victoria Cross Online
    nationality: GBR
    language: English
    adapter: victoria_cross_online
    base_url: https://victoriacrossonline.co.uk
    search_path: "/?s={q}"
    crawl_delay: 2
    awards: [Victoria Cross, George Cross]
    accessible: true
    enabled: true
    notes: VC/GC per-recipient citation pages. Secondary to the Gazette for GB.

  # ---------------- France ----------------
  # Verified 2026-10-02 (AWS + full headers): all FR sites serve 200. French-
  # language citations are translated to English on attach (original preserved).
  # Only the Ordre de la Libération carries citation-like TEXT; Croix de guerre,
  # Médaille militaire, and Légion d'honneur citations live in the Journal
  # officiel / SHD Vincennes / Léonore dossiers → offline/dossier (OfflineAwardDataset).
  - id: fr_ordre_liberation
    name: Ordre de la Libération (Compagnons)
    nationality: FRA
    language: French
    adapter: ordre_liberation
    base_url: https://www.ordredelaliberation.fr
    search_path: "/fr/recherche-compagnons?q={q}"
    crawl_delay: 3
    awards: [Ordre de la Libération, Croix de la Libération]
    accessible: true
    enabled: true
    notes: >-
      1,038 Compagnons; each has a biographical notice (decree date, unit/network,
      services justifying the cross) ≈ the citation for this award. French → text
      is translated to English, original kept. NOT a Croix-de-guerre/Médaille-
      militaire source (no public citation roll for those).

  # ---------------- Canada ----------------
  # Verified 2026-10-02 (AWS + full headers). English. DHH overseas recommendation
  # files are the full citations; Veterans Affairs quotes the Gazette VC citations.
  - id: ca_dhh_overseas
    name: Canadian Army Overseas Honours and Awards (DHH)
    nationality: CAN
    language: English
    adapter: dhh_canada
    base_url: https://dhh-dhp.forces.gc.ca
    search_path: "/cao-aco/?q={q}"
    crawl_delay: 3
    awards: [Distinguished Service Order, Military Cross, Distinguished Conduct Medal, Military Medal]
    accessible: true
    enabled: true
    notes: >-
      Original overseas recommendation files (54 vols, searchable by name) = full
      theatre citations (officers, other ranks, nursing sisters, civilians). Army
      only; VC paperwork + Canada-only recommendations excluded. RCAF/RCN not here
      (RCAFA transcripts / London Gazette for those). Pair with the Gazette for the
      published citation + Blatherwick rolls as a finding aid.

  # ---------------- Italy ----------------
  # Verified 2026-10-02 (AWS + full headers). Italian → translated. Quirinale carries
  # the full motivazione (citation) for the GOLD medal; silver/bronze thin.
  - id: it_quirinale
    name: Quirinale — Onorificenze (Medaglia d'Oro al Valor Militare)
    nationality: ITA
    language: Italian
    adapter: quirinale
    base_url: https://www.quirinale.it
    search_path: "/onorificenze?cognome={q}"
    crawl_delay: 3
    awards: [Medaglia d'Oro al Valor Militare, Ordine Militare d'Italia]
    accessible: true
    enabled: true
    notes: >-
      Each record = grade, rank, decree date, and the full motivazione (citation).
      Gold medal of military valor (~2,607 across all wars; search needs >=2 surname
      letters). Silver/bronze NOT complete here → offline. Italian → translated,
      original kept. Gazzetta Ufficiale (gazzettaufficiale.it) is the legal primary
      if a Quirinale sheet is missing → offline.

  # ---------------- Belgium ----------------
  # Verified 2026-10-02 (AWS + full headers). NO accessible official citation text:
  # Belgium never published narrative citations (the palm/lion IS the citation level);
  # the 2012 Defence Minister confirmed no systematic War Cross roll exists. Real
  # citations are offline (War Heritage Institute Brussels / State Archives). The one
  # reachable NAME source (TracesOfWar) is selective + rarely carries the official
  # citation → registered but DISABLED (do not auto-run a name-list as a citation src).
  - id: be_tracesofwar
    name: TracesOfWar — Belgium (Croix de Guerre 1940 et al.)
    nationality: BEL
    language: null            # FR/NL notes when present; translated if used
    adapter: tracesofwar
    base_url: https://www.tracesofwar.com
    search_path: "/awards/country.asp?countryid=427"
    crawl_delay: 2
    awards: [Croix de Guerre 1940, Order of Leopold, Order of the Crown]
    accessible: true
    enabled: false            # name-list + partial deed notes, NOT official citations
    notes: >-
      Largest public BE name DB (selective: notable Belgians, Allied commanders,
      contributor entries). Pages sometimes note WHY an award was given but not the
      official citation. Decree name-lists in Moniteur belge (ejustice) carry stock
      phrases, not narratives. Citation text → War Heritage Institute / State Archives
      (offline). Allied-to-Belgian awards may appear in UK WO 373 / US GOs.

  # ---------------- Netherlands ----------------
  # Verified 2026-10-02 (AWS + full headers). Name lists online; full official
  # citations NOT in one public DB. TracesOfWar = practical WWII name entry point
  # with PARTIAL deed/citation notes on better pages; rmwo.nl = MWO biographies (not
  # decree transcripts); real citations in Nationaal Archief / NIMH + Meijer rolls.
  - id: nl_tracesofwar
    name: TracesOfWar — Netherlands (Bronzen Leeuw / Bronzen Kruis et al.)
    nationality: NLD
    language: null            # NL notes when present; translated if used
    adapter: tracesofwar
    base_url: https://www.tracesofwar.com
    search_path: "/awards/200/Bronzen-Leeuw-BL.htm"
    crawl_delay: 2
    awards: [Militaire Willems-Orde, Bronzen Leeuw, Bronzen Kruis, Vliegerkruis, Kruis van Verdienste, Verzetskruis]
    accessible: true
    enabled: false            # pages vary; better ones give deed/citation, many don't
    notes: >-
      Alphabetical recipient lists; better pages give rank/unit/date/place + Royal
      Decree + a short deed account, sometimes the recommendation/citation, many do
      not. Strongest for higher awards. rmwo.nl = ~6,000 MWO biographies (WWII cohort
      ~169; biographical, not decree transcripts). Official 1815-1963 index = Databank
      Dapperheidsonderscheidingen (Defence/NIMH; name index, not released as data).
      Citation text → Nationaal Archief / NIMH files + Meijer printed rolls (offline).

  # ---------------- Germany ----------------
  # No accessible direct citation-text source: invenio is catalog-only; the proposals
  # (Begründung) are offline at Bundesarchiv (Freiburg = army RH series; Berlin = SS
  # files incl. Waffen-SS "Charlemagne"). RH 7 Verleihungslisten are name rolls+dates,
  # NOT the reason. Routed by AWARDING POWER: an Iron Cross / Knight's Cross goes here
  # even for a FRENCH recipient (LVF / Infanterie-Regiment 638 / Waffen-SS), whose file
  # may instead be on the French side (SHD) — still German-award provenance.
  - id: de_offline
    name: German award citations (Bundesarchiv — offline)
    nationality: DEU
    language: German          # Begründung text → translated to English on attach
    adapter: offline
    dataset_path: data/award_citations_de.json
    crawl_delay: 0
    awards: [Iron Cross, Knight's Cross of the Iron Cross, German Cross, War Merit Cross]
    accessible: true          # local dataset, no network
    enabled: false            # enable when a transcribed dataset is provided
    notes: >-
      Feed transcribed Begründung from Bundesarchiv Freiburg (RH 7 / Pers 6 / division
      + regiment files) or, for Waffen-SS, Bundesarchiv Berlin SS files. Foreign
      volunteers (French LVF / Charlemagne): German file hit-and-miss (Soldbücher lost
      1944-45; thin Berlin card index) → SHD engagement lists / collaboration dossiers
      are the fallback source for the same German award. German → translated.

  # ---------------- Romania ----------------
  # Verified 2026-10-02 (AWS + full headers). Names online (Order of Michael the Brave);
  # citation prose only in the per-recipient BREVET (diploma) — a few online (e.g. the
  # Dicezare brevet), the rest offline. Monitorul Oficial decrees are conferral lists
  # (name/rank/unit/class), not the deed. Romanian → translated.
  - id: ro_worldwar2
    name: WorldWar2.ro — Ordinul Mihai Viteazul
    nationality: ROU
    language: Romanian
    adapter: tracesofwar          # generic name-roll adapter shape; disabled
    base_url: https://www.worldwar2.ro
    search_path: "/decoratii/?article=119"
    crawl_delay: 3
    awards: [Order of Michael the Brave]
    accessible: true
    enabled: false                # names + decree refs, citation only in brevets (offline)
    notes: >-
      Officers by class with rank/unit/decree no.+date. Lower grades (Military Virtue
      Medal, Aeronautical Virtue) have no comparable roll. Full citation = the brevet
      or decoration file at the military archives → offline. Romanian Wikipedia has
      compiled MO lists (names + decree nos). Illésfalvi-style print has the deed.

  # ---------------- Hungary ----------------
  # Verified 2026-10-02 (AWS + full headers). Complete name rolls for the top grades
  # (Officer Gold ~22+3, Enlisted Gold ~39, single Maria Theresa knight Oszlányi);
  # citation prose online only for Oszlányi in full + a handful of gold cases. Lower
  # Vitézségi Érem grades (silver/bronze, tens of thousands) have no roll. Hungarian → translated.
  - id: hu_name_rolls
    name: Hungary — Gold Medal of Bravery rolls (huWiki / rendjel / armedforces)
    nationality: HUN
    language: Hungarian
    adapter: tracesofwar
    base_url: http://www.hungarianarmedforces.com
    search_path: "/magyarerdemrend/index.html"
    crawl_delay: 3
    awards: [Officer Gold Medal of Bravery, Enlisted Gold Medal of Bravery, Military Order of Maria Theresa]
    accessible: true
    enabled: false                # names online; citation prose only for Oszlányi + a few
    notes: >-
      Full citation source = Illésfalvi/Kovács/Maruzs 'For Valour' (2010, print) +
      scattered articles (Corvinák, Kitörés 1945). Oszlányi's Maria Theresa appointment
      text is online (archived rendjel). Signum Laudis / Order of Merit with swords: a
      searchable index exists (hungarianarmedforces.com) but no citation files → offline.

  # ---------------- Finland ----------------
  # Verified 2026-10-02 (AWS + full headers). Mannerheim Cross roll is COMPLETE +
  # wartime-only (191, 1941-1945). Names/rank/unit online; the citation (GHQ
  # nimitysperustelut) is in print (Hurmerinta & Viitanen ritarimatrikkeli). Finnish → translated.
  - id: fi_marskinritarit
    name: Mannerheim Cross Knights (marskinritarit.fi)
    nationality: FIN
    language: Finnish
    adapter: tracesofwar
    base_url: https://www.marskinritarit.fi
    search_path: "/"
    crawl_delay: 3
    awards: [Mannerheim Cross]
    accessible: true
    enabled: false                # roll + short bios online; citation text is in print
    notes: >-
      191 knights (complete, wartime-only). en/fi Wikipedia carry the roll (knight no.,
      name, rank, service, date, unit, short note) — NOT the official citation. Citation
      = GHQ nimitysperustelut in Hurmerinta & Viitanen, 'Mannerheim-ristin ritarit:
      ritarimatrikkeli' (1994/2004/2006, print) → offline. Lower Liberty crosses/medals
      too numerous for a public citation roll.

  # ---------------- Spain ----------------
  # Verified 2026-10-02 (AWS + full headers). WWII-relevant set = División Azul (1941-43):
  # ~8 Cruces Laureadas de San Fernando + ~42-54 Medallas Militares. esWiki annex lists
  # Laureadas by year with a ONE-LINE merit note, not the formal citation. Spanish → translated.
  - id: es_wiki_laureada
    name: Spain — Cruz Laureada de San Fernando (esWiki annex)
    nationality: ESP
    language: Spanish
    adapter: tracesofwar
    base_url: https://es.wikipedia.org
    search_path: "/wiki/Anexo:Condecorados_con_la_Cruz_Laureada_de_San_Fernando"
    crawl_delay: 2
    awards: [Cruz Laureada de San Fernando, Medalla Militar Individual]
    accessible: true
    enabled: false                # names + one-line merit; formal citation in Diario Oficial (offline)
    notes: >-
      División Azul (Eastern Front 1941-43) is the WWII set. Formal citation = the award
      order in the Diario Oficial del Ministerio del Ejército (not on one free site) +
      the juicio contradictorio for the Laureada → offline. Blue Division Medallas
      Militares / Cruces de Guerra have NO online citation roll. Print: Prieto Barrio &
      Pérez Rubio, 'Condecoraciones y distintivos de la División Azul'.

  # ---------------- Offline / request-based (any country) ----------------
    name: Offline award dataset
    nationality: ANY
    language: null   # per-record; non-English citations are translated to English (original preserved)
    adapter: offline
    dataset_path: data/award_citations.json
    crawl_delay: 0
    awards: []
    accessible: true          # local, no network
    enabled: false            # enable when a dataset is provided
    notes: >-
      Local recipients+citations dataset (zero scraping) for material behind
      subscription/offline walls: US Silver Star (NARA/Fold3), UK DCM/MM (WO 373,
      Fold3 register), German Begründung (Bundesarchiv Freiburg / RH 7); French Croix de guerre /
      Médaille militaire / Légion d'honneur citations (Journal officiel via Gallica,
      SHD Vincennes homologation files, Base Léonore dossiers). Feed it a
      curated/transcribed JSON; see award_offline_source.OfflineAwardDataset.
