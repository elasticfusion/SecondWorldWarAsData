      - pattern: '\b2a\b'
        replacement: 2d
        description: OCR 2a for 2d ordinal
      - pattern: '\bAth\b'
        replacement: 4th
        description: OCR Ath for 4th
      - pattern: '\b(\d)l(\d)(st|d|th)\b'
        replacement: '\1\2\3'
        description: OCR digit-l-digit ordinal (e.g. 9l4th to 94th)
      - pattern: '112feh'
        replacement: 112th
        description: OCR 112feh for 112th
      - pattern: '5t h'
        replacement: 5th
        description: OCR spaced 5t h for 5th

  unit_name_squadron_misc_ocr:
