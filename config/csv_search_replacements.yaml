# CSV search-and-replace rules for post-processing extracted tabular data.
# Rules are applied in file order, then rule order within each set.
# Patterns are Python regular expressions (re.sub). Use raw-string escaping in YAML.

rule_sets:
  unit_name_expansions:
    description: >-
      Expand U.S. Army unit abbreviations and OCR fixes in unit-like text columns.
      Apply after OCR cleanup; order matters (.AA before AAA).
    columns:
      - unit_name
      - parent_unit_name
      - position
      - attached_to_organization
      - metric
    rules:
      - pattern: '-'
        replacement: ' '
        description: Normalize hyphens to spaces
      - pattern: '\.AA(?!A)'
        replacement: AAA
        description: OCR ".AA" abbreviation (skip ".AAug" date fragments)
      - pattern: 'AAA(?!A)'
        replacement: Antiaircraft Artillery
        description: Antiaircraft Artillery (skip "AAAug" date fragments)
      - pattern: '\bAW\b'
        replacement: Automatic Weapons
        description: Automatic Weapons battalion suffix
      - pattern: '\bBtry\b'
        replacement: Battery
        description: Battery
      - pattern: 'Bn~'
        replacement: Battalion
        description: OCR "Bn~" abbreviation
      - pattern: '\bBn\b'
        replacement: Battalion
        description: Battalion
      - pattern: '\bBtrys\b'
        replacement: Batteries
        description: Batteries (plural battery)
      - pattern: 'llbl'
        replacement: Mobile
        description: OCR "(llbl)" mobility designation
      - pattern: '\bMbl\b'
        replacement: Mobile
        description: Mobile (OCR "Mbl")
      - pattern: 'AI\^'
        replacement: Automatic Weapons
        description: OCR "AI^" for Automatic Weapons
      - pattern: '\bEn\b'
        replacement: Battalion
        description: OCR "En" for Battalion
      - pattern: ' J \.\.\.'
        replacement: )
        description: OCR trailing " J ..." before closing paren
      - pattern: ' • \* » « • « •'
        replacement: ''
        description: OCR junk punctuation cluster
      - pattern: '\bTk\b'
        replacement: Tank
        description: Tank
      - pattern: '\bAmid\b'
        replacement: Armored
        description: OCR "Amid" for Armored
      - pattern: '\bArmd\.?[''"]+'
        replacement: Armored
        description: OCR "Armd'" (optional dot, trailing quote) for Armored
      - pattern: '\bArmd\b'
        replacement: Armored
        description: Armd abbreviation for Armored
      - pattern: '\bGp\b'
        replacement: Group
        description: Group abbreviation
      - pattern: ' • '
        replacement: ' '
        description: Normalize spaced bullet to single space
      - pattern: '(?:\.\s*){3,}[''"]?'
        replacement: ''
        description: OCR spaced dot runs with optional trailing quote
      - pattern: '(?:\s\.\s*)+[''"]+[.,;:\s]*$'
        replacement: ''
        description: Trailing OCR " .'" dot-quote junk at end of field

  unit_name_9tli_arrid:
    description: OCR 9tli Arrid to 9th Armored (unit_name only).
    columns:
      - unit_name
    rules:
      - pattern: '9tli"Arrid'
        replacement: 9th Armored
        description: OCR 9tli"Arrid for 9th Armored (e.g. 9th Armored Division)

  unit_name_llbt:
    description: OCR Mobile designation variants (unit_name only).
    columns:
      - unit_name
    rules:
      - pattern: 'llbT'
        replacement: Mobile
        description: OCR llbT for Mobile (e.g. Automatic Weapons Battalion (llbT))
      - pattern: 'Ilbl'
        replacement: Mobile
        description: OCR Ilbl for Mobile (e.g. Antiaircraft Artillery Gun (Ilbl))
      - pattern: 'TlbX"'
        replacement: Mobile
        description: OCR TlbX" for Mobile (e.g. Automatic Weapons Battalion (TlbX"))
      - pattern: '"\(Mobile\)'
        replacement: ' (Mobile)'
        description: OCR stray quote before (Mobile) (CSV ""(Mobile)"")

  unit_name_amd_regt:
    description: OCR spaced "A m d R e g t" to Armored Regiment (unit_name only).
    columns:
      - unit_name
    rules:
      - pattern: 'A\s*m\s*d\s*(?:R\s*e\s*g\s*t|Regt)\.?[''"]*'
        replacement: Armored Regiment
        description: OCR spaced Amd Regt (optional trailing quote) for Armored Regiment

  unit_name_amd:
    description: OCR spaced "A m d" to Armored (unit_name only).
    columns:
      - unit_name
    rules:
      - pattern: '&±md'
        replacement: Armored
        description: OCR &±md for Armored (e.g. 3d &±md Div)
      - pattern: '\bA\s*m\s*d\b(?!\s*(?:R\s*e\s*g\s*t|Regt))\.?[''"]*'
        replacement: Armored
        description: OCR spaced A m d (not A m d Regt) for Armored

  unit_name_amd_bdiv:
    description: OCR AmdBBiv to Armored Division (unit_name only).
    columns:
      - unit_name
    rules:
      - pattern: 'AmdBBiv'
        replacement: Armored Division
        description: OCR AmdBBiv for Armored Division (e.g. 3d AmdBBiv)

  unit_name_treadway_br:
    description: Treadway Br is Bridge Company, not British (unit_name only).
    columns:
      - unit_name
    rules:
      - pattern: '(?i)(Tread\w*way|ATreadway)\s+Br\.?\b'
        replacement: '\1 Bridge'
        description: Engineer Treadway Bridge Company before Br->British expansion
      - pattern: '(?i)(Tread\w*way|ATreadway)\s+British\b'
        replacement: '\1 Bridge'
        description: Undo Br->British on Treadway rows already processed

  unit_name_br:
    description: Expand Br abbreviation to British (unit_name only).
    columns:
      - unit_name
    rules:
      - pattern: '\bBr\.?\b'
        replacement: British
        description: British unit prefix (e.g. Br 74th AT Battery)

  unit_name_inf:
    description: Expand Inf abbreviations to Infantry (unit_name only).
    columns:
      - unit_name
    rules:
      - pattern: '(?i)I\s+n\s+f\b(?!\s*a)'
        replacement: Infantry
        description: OCR spaced I n f for Infantry (not I n f a n t r y)
      - pattern: '\bInf\.?[''"]+'
        replacement: Infantry
        description: OCR "Inf'" (optional dot, trailing quote) for Infantry
      - pattern: '\bInf\b'
        replacement: Infantry
        description: Inf abbreviation for Infantry

  unit_name_fa:
    description: Expand FA abbreviations to Field Artillery (unit_name only).
    columns:
      - unit_name
    rules:
      - pattern: 'FA\.?[''"]+'
        replacement: Field Artillery
        description: OCR "FA'" (optional dot, trailing quote) for Field Artillery
      - pattern: '\bFA\b'
        replacement: Field Artillery
        description: FA abbreviation for Field Artillery

  unit_name_f_field_artillery:
    description: >-
      Expand OCR "F Battalion" / "F v Battalion" to Field Artillery Battalion (unit_name only).
      Run after unit_name_fa.
    columns:
      - unit_name
    rules:
      - pattern: '\b(\d+(?:st|nd|rd|th)?)\s+F[,;]+\s*Battalion\b'
        replacement: '\1 Field Artillery Battalion'
        description: F with comma/semicolon before Battalion (e.g. 529th F, Battalion)
      - pattern: '\b(\d+(?:st|nd|rd|th)?)\s+F\s+v?\s+Battalion\b'
        replacement: '\1 Field Artillery Battalion'
        description: Ordinal F or F v Battalion (e.g. 730th F Battalion)
      - pattern: '\b(\d+)\s+d\s+F\s+Battalion\b'
        replacement: '\1d Field Artillery Battalion'
        description: Spaced ordinal before F Battalion (e.g. 42 d F Battalion)
      - pattern: '\b(\d+(?:st|nd|rd|th)?)\s+F\s+Battalion(?=\d)'
        replacement: '\1 Field Artillery Battalion '
        description: Glued division after F Battalion (e.g. 131st F Battalion100th)
      - pattern: '\bF\s*[,;]+\s*Battalion\b'
        replacement: Field Artillery Battalion
        description: F;, Battalion without leading ordinal (e.g. 522d F;, Battalion)

  parent_unit_name_annd:
    description: OCR "Annd" misread to Armored (unit_name and parent_unit_name).
    columns:
      - unit_name
      - parent_unit_name
    rules:
      - pattern: 'Annd'
        replacement: Armored
        description: OCR Annd for Armored

  parent_unit_name_ccr_ocr:
    description: OCR CCR parenthetical junk to 3d Armored Division (parent_unit_name and unit_name).
    columns:
      - parent_unit_name
      - unit_name
    rules:
      - pattern: ' \( 3 d : i \^ r m d \^ D i v \) \} '
        replacement: ' (3d Armored Division)'
        description: 'OCR CCR parenthetical junk with trailing brace for (3d Armored Division)'
      - pattern: '\( 3 d : i \^ r m d \^ D i v \)'
        replacement: ' (3d Armored Division)'
        description: 'OCR CCR parenthetical junk for (3d Armored Division)'
      - pattern: '^CCR 3d Armored Division$'
        replacement: CCR (3d Armored Division)
        description: Normalize CCR parent after prior junk cleanup

  unit_name_div:
    description: Expand Div abbreviations to Division (unit_name only).
    columns:
      - unit_name
      - parent_unit_name
    rules:
      - pattern: 'Div\.?[''"]+'
        replacement: Division
        description: OCR "Div'" (optional dot, trailing quote) for Division
      - pattern: '\bDiv\b'
        replacement: Division
        description: Div abbreviation for Division
      - pattern: '\bPiv\b'
        replacement: Division
        description: OCR Piv for Division

  unit_name_ren:
    description: Expand Ren abbreviations to Reconnaissance (unit_name only).
    columns:
      - unit_name
    rules:
      - pattern: 'Ren\.?[''"]+'
        replacement: Reconnaissance
        description: OCR "Ren'" (optional dot, trailing quote) for Reconnaissance
      - pattern: '\bRen\b'
        replacement: Reconnaissance
        description: Ren abbreviation for Reconnaissance

  unit_name_tr:
    description: Expand Tr abbreviation to Troop (unit_name only).
    columns:
      - unit_name
    rules:
      - pattern: '\bTr\b'
        replacement: Troop
        description: Tr abbreviation for Troop (e.g. Reconnaissance Tr, Tr A)

  unit_name_det:
    description: Expand det abbreviation to detachment (unit_name only).
    columns:
      - unit_name
    rules:
      - pattern: '(?i)\bdet\b'
        replacement: detachment
        description: det abbreviation for detachment (e.g. 1 det 29th Reconnaissance Troop)

  unit_name_plat:
    description: Expand plat/Plat abbreviations to Platoon (unit_name only).
    columns:
      - unit_name
    rules:
      - pattern: '\bP\s*l\s*a\s*t\b\.?[''"]*'
        replacement: Platoon
        description: OCR spaced P l a t / Plat (optional dot, trailing quote) for Platoon
      - pattern: '(?i)\bplat\b'
        replacement: Platoon
        description: plat abbreviation for Platoon (e.g. 1 plat, 3d Plat)
      - pattern: '(?i)\bplats\b'
        replacement: Platoons
        description: plats abbreviation for Platoons (e.g. 2 plats)
      - pattern: 'p l a t s'
        replacement: Platoon
        description: OCR spaced p l a t s for Platoon

  unit_name_equip:
    description: Expand Equip abbreviation to Equipment (unit_name only).
    columns:
      - unit_name
    rules:
      - pattern: '(?i)\bEquip\b'
        replacement: Equipment
        description: Equip abbreviation for Equipment (e.g. Light Equip Platoon)

  unit_name_pon:
    description: Expand Pon abbreviation to Pontoon (unit_name only).
    columns:
      - unit_name
    rules:
      - pattern: '(?i)\bPon\b'
        replacement: Pontoon
        description: Pon abbreviation for Pontoon (e.g. Light Pon Company)

  unit_name_155_how:
    description: Expand 155 How abbreviation to 155 Howitzer (unit_name only).
    columns:
      - unit_name
    rules:
      - pattern: '(?i)155\s+How\b'
        replacement: 155 Howitzer
        description: 155 How abbreviation for 155 Howitzer (e.g. FA Battalion (155 How))
      - pattern: '(?i)155\s+Howp[a-z]*'
        replacement: 155 Howitzer)
        description: OCR 155 HowpT etc. for 155 Howitzer)

  unit_name_155_gun:
    description: Expand 155 Gun to 155 Howitzer (unit_name only).
    columns:
      - unit_name
    rules:
      - pattern: '(?i)155\s+Gun\b'
        replacement: 155 Howitzer
        description: 155 Gun abbreviation for 155 Howitzer (e.g. FA Battalion (155 Gun))

  unit_name_155_hon:
    description: Expand 155 Hon OCR to 155 Howitzer (unit_name only).
    columns:
      - unit_name
    rules:
      - pattern: '(?i)155\s+Hon\b'
        replacement: 155 Howitzer
        description: OCR 155 Hon for 155 Howitzer (e.g. FA Battalion (155 Hon))

  unit_name_105_how:
    description: Expand 105 How abbreviation to 105 Howitzer (unit_name only).
    columns:
      - unit_name
    rules:
      - pattern: '(?i)105\s+How\b'
        replacement: 105 Howitzer
        description: 105 How abbreviation for 105 Howitzer (e.g. FA Battalion (105 How))
      - pattern: '105 Hov'
        replacement: 105 Howitzer
        description: OCR 105 Hov for 105 Howitzer (e.g. FA Battalion (105 Hov))
      - pattern: '(?i)105\s+''How\b'
        replacement: 105 Howitzer
        description: OCR 105 'How for 105 Howitzer (e.g. FA Battalion (105 'How))
      - pattern: '\.105 Howitzer'
        replacement: 105 Howitzer
        description: OCR .105 Howitzer for 105 Howitzer
      - pattern: '\(105 IIOVJ\)?'
        replacement: (105 Howitzer)
        description: OCR (105 IIOVJ for (105 Howitzer)

  unit_name_ho_star:
    description: OCR Ho*' to Howitzer (unit_name only).
    columns:
      - unit_name
    rules:
      - pattern: 'Ho\*'''
        replacement: Howitzer
        description: OCR Ho*' for Howitzer

  unit_name_ocr_155_howitzer:
    description: OCR spaced 155 Howitzer junk to (155 Howitzer) (unit_name only).
    columns:
      - unit_name
    rules:
      - pattern: '\^ 5 5 10T'
        replacement: (155 Howitzer)
        description: OCR ^ 5 5 10T for (155 Howitzer)

  unit_name_etry_e:
    description: OCR Etry E to Battery B (unit_name only).
    columns:
      - unit_name
    rules:
      - pattern: '(?i)Etry\s+E\b'
        replacement: Battery B
        description: OCR Etry E for Battery B

  unit_name_etry:
    description: OCR Etry to Battery (unit_name only).
    columns:
      - unit_name
    rules:
      - pattern: '(?i)\bEtry\b'
        replacement: Battery
        description: OCR Etry for Battery (e.g. Hq & Hq Etry, Etry C)

  unit_name_loth:
    description: OCR loth to 13th (unit_name only).
    columns:
      - unit_name
    rules:
      - pattern: '(?i)\bloth\b'
        replacement: 13th
        description: OCR loth for 13th (e.g. loth FA Obsn Battalion)

  unit_name_obsn:
    description: Expand Obsn abbreviation to Observation (unit_name only).
    columns:
      - unit_name
    rules:
      - pattern: '(?i)\bObsn\b'
        replacement: Observation
        description: Obsn abbreviation for Observation (e.g. FA Obsn Battalion)

  unit_name_hq:
    description: Expand Hq abbreviation to Headquarters (unit_name only).
    columns:
      - unit_name
    rules:
      - pattern: '(?i)\bHq\b'
        replacement: Headquarters
        description: Hq abbreviation for Headquarters (e.g. Hq & Hq Battery)

  unit_name_iln:
    description: OCR Iln to Headquarters (unit_name only).
    columns:
      - unit_name
    rules:
      - pattern: '(?i)\bIln\b'
        replacement: Headquarters
        description: OCR Iln for Headquarters (e.g. Hq & Iln Etry)

  unit_name_he_battery:
    description: OCR He Battery to Headquarters Battery (unit_name only).
    columns:
      - unit_name
    rules:
      - pattern: '(?i)He Battery'
        replacement: Headquarters Battery
        description: OCR He Battery for Headquarters Battery (e.g. Hq & He Battery)

  unit_name_155_dm:
    description: OCR 155 dm to 155 Howitzer (unit_name only).
    columns:
      - unit_name
    rules:
      - pattern: '(?i)155\s+dm\b'
        replacement: 155 Howitzer
        description: OCR 155 dm for 155 Howitzer (e.g. FA Battalion (155 dm))

  unit_name_ct:
    description: Expand CT abbreviation to Combat Team (unit_name only).
    columns:
      - unit_name
    rules:
      - pattern: '\bCT\b'
        replacement: Combat Team
        description: CT abbreviation for Combat Team (e.g. 116th CT 29th Division)
      - pattern: 'C\?'
        replacement: Combat Team
        description: OCR C? for Combat Team

  unit_name_29th_division_paren:
    description: Fix missing open paren before 29th Division) (unit_name only).
    columns:
      - unit_name
    rules:
      - pattern: '(?<![(])29th Division\)'
        replacement: (29th Division)
        description: 29th Division) to (29th Division) when opening paren is missing

  unit_name_9th_division_paren:
    description: Add parens around bare 9th Division references (unit_name only).
    columns:
      - unit_name
    rules:
      - pattern: ' 9th Division\b'
        replacement: ' (9th Division)'
        description: Bare 9th Division after space to (9th Division)
      - pattern: '^9th Division\b'
        replacement: (9th Division)
        description: unit_name starting with 9th Division
      - pattern: '\(9th$'
        replacement: (9th Division)
        description: Truncated (9th at end of unit_name

  unit_name_1st_division_paren:
    description: Add parens around bare 1st Division references (unit_name only).
    columns:
      - unit_name
    rules:
      - pattern: '\{1st Division'
        replacement: (1st Division)
        description: OCR {1st Division to (1st Division)
      - pattern: '(?<![0-9(])1st Division\)'
        replacement: (1st Division)
        description: 1st Division) to (1st Division) when opening paren is missing (skip 71st etc.)
      - pattern: '(?<!\()\b1st Division\b(?!\s+Artillery\b)(?!\))'
        replacement: (1st Division)
        description: Bare 1st Division to (1st Division); skip Artillery organic unit and existing parens

  unit_name_division_close:
    description: >-
      Strip stray Division) to Division in unit_name (keeps balanced (N Division)).
    columns:
      - unit_name
    rules:
      - pattern: '__python__:strip_stray_division_close_paren'
        replacement: ''
        description: Remove stray Division) close paren without removing (N Division)

  unit_name_155_imr:
    description: OCR 155 Imr to 155 Howitzer (unit_name only).
    columns:
      - unit_name
    rules:
      - pattern: '(?i)155\s+Imr\b'
        replacement: 155 Howitzer
        description: OCR 155 Imr for 155 Howitzer (e.g. FA Battalion (155 Imr))

  unit_name_f_slash:
    description: Expand F/ abbreviation to Field Artillery (unit_name only).
    columns:
      - unit_name
    rules:
      - pattern: 'F/'
        replacement: Field Artillery
        description: F/ abbreviation for Field Artillery (e.g. Armored F/ Battalion)

  unit_name_tank_battalion_slash:
    description: Fix OCR Tank/Battalion slash in unit_name.
    columns:
      - unit_name
    rules:
      - pattern: 'Tank/Battalion'
        replacement: Tank Battalion
        description: OCR Tank/Battalion for Tank Battalion

  unit_name_btrys:
    description: OCR spaced "B t r y s" to Batteries (unit_name only).
    columns:
      - unit_name
    rules:
      - pattern: '\bB\s*t\s*r\s*y\s*s\b\.?[''"]*'
        replacement: Batteries
        description: OCR spaced B t r y s / Btrys (optional dot, trailing quote) for Batteries

  unit_name_btry:
    description: OCR spaced "B t r y" to Battery (unit_name only).
    columns:
      - unit_name
    rules:
      - pattern: '\bbtry\b'
        replacement: Battery
        description: OCR lowercase btry for Battery
      - pattern: '\b(?:B\s*t\s*r\s*y(?!\s*s)|Bt\s*ry)\b\.?[''"]*'
        replacement: Battery
        description: OCR spaced B t r y / Bt ry (not B t r y s) for Battery

  unit_name_cos:
    description: Expand Cos abbreviations to Companies (unit_name only).
    columns:
      - unit_name
    rules:
      - pattern: '\bCos\.?[''"]+'
        replacement: Companies
        description: OCR "Cos'" (optional dot, trailing quote) for Companies
      - pattern: '\bCos\b'
        replacement: Companies
        description: Cos abbreviation for Companies

  unit_name_co:
    description: Expand Co abbreviation to Company (unit_name only).
    columns:
      - unit_name
    rules:
      - pattern: '\bCo\b'
        replacement: Company
        description: Co abbreviation for Company
      - pattern: '\bCp\b'
        replacement: Company
        description: Cp abbreviation for Company
      - pattern: '\bGo\b'
        replacement: Company
        description: OCR Go for Co/Company
      - pattern: 'Company\* A'
        replacement: Company A
        description: OCR Company* A for Company A
      - pattern: 'C»'
        replacement: Company
        description: OCR C» for Company
      - pattern: 'C®'
        replacement: Company
        description: OCR C® for Company
      - pattern: 'C\*'
        replacement: Company
        description: OCR C* for Company
      - pattern: 'Ct>'
        replacement: Company
        description: OCR Ct> for Company
      - pattern: 'C©'
        replacement: Company
        description: OCR C© for Company
      - pattern: '\bCa\b(?!\s*v\b)(?!\s*ul)(?!\s+Reconnaissance)'
        replacement: Company
        description: OCR Ca for Company (excludes Ca v/Ca ul/Ca Reconnaissance = Cavalry)

  unit_name_regt:
    description: Expand Regt abbreviation to Regiment (unit_name only).
    columns:
      - unit_name
    rules:
      - pattern: '\bRegt\b'
        replacement: Regiment
        description: Regt abbreviation for Regiment

  unit_name_prcht:
    description: Expand Prcht abbreviation to Parachute (unit_name only).
    columns:
      - unit_name
    rules:
      - pattern: 'Prcht'
        replacement: Parachute
        description: Prcht abbreviation for Parachute (e.g. 507th Prcht Infantry)

  unit_name_non_division:
    description: Expand (Non Division) to Regiment (unit_name only).
    columns:
      - unit_name
    rules:
      - pattern: '\(Non Division\)'
        replacement: Regiment
        description: OOB (Non Division) designation for separate regiment
      - pattern: '\(Hon Division\)'
        replacement: Regiment
        description: OCR (Hon Division) for separate regiment (e.g. 159th Infantry)

  unit_name_cav:
    description: Expand Cav abbreviation to Cavalry (unit_name only).
    columns:
      - unit_name
    rules:
      - pattern: 'Ca v'
        replacement: Calvary
        description: OCR spaced Ca v for Calvary (e.g. 14th Ca v Group)
      - pattern: ':\(Atchd 14th'
        replacement: '(Attached 14th Calvary Group)'
        description: OCR :(Atchd 14th for (Attached 14th Calvary Group) (106th ID p421)
      - pattern: '\bCav\b'
        replacement: Cavalry
        description: Cav abbreviation for Cavalry

  unit_name_cml:
    description: Expand Cml abbreviation to Chemical (unit_name only).
    columns:
      - unit_name
    rules:
      - pattern: '\bCml\b'
        replacement: Chemical
        description: Cml abbreviation for Chemical

  unit_name_cmi:
    description: Expand Cmi abbreviation to Chemical (unit_name only).
    columns:
      - unit_name
    rules:
      - pattern: '\bCmi\b'
        replacement: Chemical
        description: Cmi abbreviation for Chemical

  unit_name_mort:
    description: Expand Mort abbreviation to Mortar (unit_name only).
    columns:
      - unit_name
    rules:
      - pattern: '\bMort\b'
        replacement: Mortar
        description: Mort abbreviation for Mortar
      - pattern: 'I5ort'
        replacement: Mortar
        description: OCR I5ort for Mortar
      - pattern: 'Kqrt'
        replacement: Mortar
        description: OCR Kqrt for Mortar

  unit_name_sq:
    description: Expand Sq abbreviation to Squadron (unit_name only).
    columns:
      - unit_name
    rules:
      - pattern: '\bSq\b'
        replacement: Squadron
        description: Sq abbreviation for Squadron

  unit_name_rmd_ocr:
    description: OCR rmd abbreviations misread to Armored (unit_name only).
    columns:
      - unit_name
    rules:
      - pattern: '(?<![A-Za-z])\^rmd'
        replacement: Armored
        description: OCR caret-rmd for Armored
      - pattern: '\brmd\b'
        replacement: Armored
        description: OCR rmd for Armored

  unit_name_rind_ocr:
    description: OCR rind misread to Armored (unit_name only).
    columns:
      - unit_name
    rules:
      - pattern: ' rind'
        replacement: ' Armored'
        description: OCR spaced rind for Armored
      - pattern: '(?<=\d[d])Armored'
        replacement: ' Armored'
