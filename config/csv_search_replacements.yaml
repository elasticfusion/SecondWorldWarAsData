  unit_name_ocr_tilde_c_star:
    description: Strip OCR (~C* C) junk from unit_name (unit_name only).
    columns:
      - unit_name
    rules:
      - pattern: ' \(~C\* C\)'
        replacement: ''
        description: OCR (~C* C) junk tail (e.g. after Self-Propelled)

  unit_name_trailing_gunk:
    description: Strip layered OCR junk tails (e.g. .., k..,..;. ••>) from unit_name.
    columns:
      - unit_name
    repeat: 8
    rules:
      - pattern: '\s*;;\s*\*\s*[a-zA-Z]{1,2}\s*>?\s*$'
        replacement: ''
        description: Trailing ;; *j or ;; *j> OCR junk
      - pattern: '\s*;\s*\*\s*[a-zA-Z]{1,2}\s*>?\s*$'
        replacement: ''
        description: Trailing ; *J or ; *J> OCR junk
      - pattern: '\s*[,;:\.\s]+\*\s*[a-zA-Z]{1,2}\s*>?\s*$'
        replacement: ''
        description: Trailing punctuation run before asterisk-letter (e.g. , ; . ; * J)
      - pattern: '\s*;\s*\*[\.,;:\*•''"<>«»^]{1,30}\s*$'
        replacement: ''
        description: Trailing semicolon-asterisk punctuation cluster (e.g. ;*."«)
      - pattern: '\s*[;][\.,;:\*•''"<>]{2,}(?:\s*\d{1,2})?\s*$'
        replacement: ''
        description: Trailing semicolon punctuation with optional digit (e.g. ;..;;;; 24)
      - pattern: '\s*[,;:\.•\*''"<>]{1,}[a-zA-Z]{0,2}\s*>\s*$'
        replacement: ''
        description: Trailing punctuation with short fragment and greater-than
      - pattern: '\s*;\s*[^A-Za-z0-9()]{3,}\s*$'
        replacement: ''
        description: Trailing semicolon plus OCR junk run
      - pattern: '\s*••>\s*$'
        replacement: ''
        description: Trailing bullet-arrow OCR junk
      - pattern: '\s*;\s*[\.,;:\*•''"<>]+$'
        replacement: ''
        description: Trailing semicolon punctuation runs
      - pattern: '\s*,\s*[a-zA-Z]{1,2}\.[\.,;:\*•''"<>]+$'
        replacement: ''
        description: Trailing comma with short OCR fragment (e.g. , k..)
      - pattern: '\s*\.\.[,;]\s*$'
        replacement: ''
        description: Trailing double-dot comma/semicolon
      - pattern: '\s*[,;]{2,}\s*$'
        replacement: ''
        description: Trailing repeated commas or semicolons
      - pattern: '\s*[,;:\.•\*''"<>]{2,}\s*$'
        replacement: ''
        description: Trailing punctuation clusters
      - pattern: '\s*/,\s*$'
        replacement: ''
        description: Trailing slash-comma OCR junk
      - pattern: '\s*[,;:\.•\*''"<>/]+\s*$'
        replacement: ''
        description: Trailing single punctuation layer
      - pattern: '[\s•\*»]+$'
        replacement: ''
        description: Trailing guillemets and bullet OCR artifacts

  unit_name_dot_artifacts:
    description: Remove OCR dot artifacts within unit_name fields.
    columns:
      - unit_name
    rules:
      - pattern: '\.\s*\('
        replacement: '('
        description: Dot before opening parenthesis
      - pattern: '\s*\.+\s*(?=[A-Za-z(])'
        replacement: ' '
        description: Spaced dot(s) before word or parenthesis
      - pattern: '(?<=[A-Za-z])\.\s*(?=\))'
        replacement: ''
        description: Dot after word before closing parenthesis
      - pattern: '(?<=[A-Za-z])\.(?=[A-Za-z])'
        replacement: ' '
        description: Dot between alphabetic words

