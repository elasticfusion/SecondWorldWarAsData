      - pattern: '\bl(\d{2,3})d\b'
        replacement: '1\1d'
        description: OCR lowercase-l glued ordinal (e.g. l63d)
      - pattern: '\bI(\d{1,2})(st|d|th)\b'
        replacement: '1\1\2'
        description: OCR capital-I ordinal (e.g. I4th)
      - pattern: '\b2bth\b'
