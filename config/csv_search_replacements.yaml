        replacement: '44'
        description: OCR kk misread for year 44
      - pattern: '\^5\b'
        replacement: '45'
        description: OCR caret-5 for year 45
      - pattern: '\bU5\b'
        replacement: '45'
        description: OCR U5 for year 45
      - pattern: '\bk5\b'
        replacement: '45'
        description: OCR k5 for year 45
      - pattern: 'k[$]'
        replacement: '45'
        description: OCR k$ for year 45
      - pattern: '\bky\b'
        replacement: '45'
        description: OCR ky for year 45
      - pattern: 'i£'
        replacement: '45'
        description: OCR i£ for year 45
      - pattern: '\b51\s+Dec\b'
        replacement: '1 Dec'
        description: OCR 51 Dec for 1 Dec
