      - pattern: '(?<=[a-z])(?=V\s+Corps\b)'
        replacement: ' '
        description: Space before V Corps when glued
      - pattern: '\b([IVX]{1,4})(Corps)\b'
        replacement: '\1 \2'
        description: Roman numeral glued to Corps (e.g. XVCorps)
      - pattern: '\bArmored(Div|DiV|Liv|Piv)\b'
        replacement: Armored Division
        description: Armored glued to Div/Liv (e.g. ArmoredDiv, ArmoredLiv)
      - pattern: '\b(\d{1,2}[a-z]{0,3})(Div|DiV|Liv|Piv)\b'
        replacement: '\1 Division'
