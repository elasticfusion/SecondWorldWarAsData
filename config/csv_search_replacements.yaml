      - pattern: '\bReconnaissance SqT\b'
        replacement: Reconnaissance Squadron
        description: Truncated Reconnaissance SqT
      - pattern: '\bReconnaissance Sqf\b'
        replacement: Reconnaissance Squadron
        description: Truncated Reconnaissance Sqf
      - pattern: '\bRenSq\b'
        replacement: Reconnaissance Squadron
        description: OCR RenSq for Reconnaissance Squadron
      - pattern: '\bSqT\b'
        replacement: Squadron
        description: Truncated SqT
      - pattern: '\bSqf\b'
        replacement: Squadron
        description: Truncated Sqf
      - pattern: 'Squadron\('
        replacement: 'Squadron ('
        description: Space before paren after Squadron
      - pattern: 'Battalion\('
        replacement: 'Battalion ('
        description: Space before paren after Battalion
      - pattern: 'Regiment\('
        replacement: 'Regiment ('
        description: Space before paren after Regiment
      - pattern: 'Company\('
        replacement: 'Company ('
        description: Space before paren after Company
      - pattern: '\bCoj\^l\b'
        replacement: Company
        description: OCR Coj^l for Company
      - pattern: '\bArnyrBiy\b'
        replacement: Armored Battalion
        description: OCR ArnyrBiy for Armored Battalion
      - pattern: '\bEiiRr\b'
        replacement: Engineer
        description: OCR EiiRr for Engineer
      - pattern: '\bCnl\b'
        replacement: Chemical
        description: OCR Cnl for Chemical
      - pattern: '\bllort\b'
        replacement: Mort
        description: OCR llort for Mort
      - pattern: '\bIjort\b'
        replacement: Mort
        description: OCR Ijort for Mort
      - pattern: '\bCaviJBcn\b'
        replacement: Cavalry Reconnaissance
        description: OCR CaviJBcn for Cavalry Reconnaissance
      - pattern: '\bEcn\b'
        replacement: Reconnaissance
        description: OCR Ecn for Reconnaissance
      - pattern: '\bRcn\b'
        replacement: Reconnaissance
        description: OCR Rcn for Reconnaissance
      - pattern: '\bRon\b'
        replacement: Reconnaissance
        description: OCR Ron for Reconnaissance
      - pattern: '\bGav\b'
        replacement: Cav
        description: OCR Gav for Cav
      - pattern: '\bRen Sq\b'
        replacement: Reconnaissance Squadron
        description: OCR Ren Sq for Reconnaissance Squadron
      - pattern: '\bRcriSq\b'
        replacement: Reconnaissance Squadron
        description: OCR RcriSq for Reconnaissance Squadron
      - pattern: '\bSq_\b'
        replacement: Squadron
        description: OCR Sq_ for Squadron
      - pattern: '\bSq(\d{1,2})'
        replacement: 'Squadron \1'
        description: Glued Sq ordinal (e.g. Sq94th)
      - pattern: '#Field'
        replacement: ' Field'
        description: OCR hash before Field Artillery

  unit_name_mid_junk:
    description: Strip mid-string OCR junk (e.g. F;* Battalion, (105 How);; ..., empty ()).
    columns:
      - unit_name
    repeat: 6
    rules:
      - pattern: '(?<=[A-Za-z])\s*;\*\s*'
        replacement: ' '
        description: Semicolon-asterisk glue between letters (e.g. F;* Battalion)
      - pattern: '(?<=[A-Za-z])\s*;\*\s*(?=[a-z]{1,8}\b)'
        replacement: ''
        description: Semicolon-asterisk before short OCR fragment (e.g. ;*rty)
      - pattern: '\(\s*\)'
        replacement: ''
        description: Empty parenthetical (e.g. (Self-Propelled) ())
      - pattern: '(How\))\s*;;.*$'
