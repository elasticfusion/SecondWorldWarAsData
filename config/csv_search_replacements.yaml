    columns:
      - unit_name
    rules:
      - pattern: '\bM\s*A\.?[''"]+'
        replacement: Antiaircraft
        description: OCR "M A'" (optional dot, trailing quote) for Antiaircraft
      - pattern: '\bM\s*A\b'
        replacement: Antiaircraft
        description: OCR spaced M A for Antiaircraft

  unit_name_mid_ocr:
    description: OCR "mid" misread to Armored (unit_name only).
    columns:
      - unit_name
    rules:
      - pattern: '\bmid\b'
        replacement: Armored
