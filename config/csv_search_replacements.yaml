      - pattern: '(?<=[A-Za-z])Batallion'
        replacement: ' Batallion'
        description: Space before Batallion when conjoined (e.g. AntiaircraftBatallion)

  unit_name_at_r:
    description: OCR "AT/r" misread to Antiaircraft (unit_name only).
    columns:
      - unit_name
    rules:
      - pattern: 'AT/r'
        replacement: Antiaircraft
        description: OCR AT/r for Antiaircraft

  unit_name_leading_junk:
    description: Strip leading OCR punctuation artifacts (unit_name only).
    columns:
      - unit_name
    rules:
      - pattern: '^[\s•\*\.;,:''"!-]+'
        replacement: ''
        description: Leading bullets, whitespace, and OCR punctuation

  unit_name_contd:
    description: Strip OCR continuation marker (Contd) from unit_name.
    columns:
      - unit_name
    rules:
      - pattern: '\(Contd\)'
        replacement: ''
        description: OCR section continuation marker (Contd)

  unit_name_trailing_junk:
    description: Strip trailing OCR dot artifacts (unit_name only).
    columns:
      - unit_name
    rules:
      - pattern: '(?:\s*[\.\•][\s\.\•\*;,:\''"!-]*)+$'
        replacement: ''
        description: Trailing spaced dots (. .), bullets, and OCR punctuation
      - pattern: ' \. \. ,v 7$'
        replacement: ''
        description: Trailing OCR junk ( . . ,v 7)
      - pattern: '\. '' , \. \. 7$'
        replacement: ''
        description: Trailing OCR junk (. ' , . . 7)
      - pattern: "' \\.«+$"
        replacement: ''
        description: Trailing OCR junk (' .«...)
      - pattern: '\s+<\s*$'
        replacement: ''
        description: Trailing OCR less-than artifact
      - pattern: '\s*„\s*$'
        replacement: ''
        description: Trailing OCR low double quote (German „)

  unit_name_trailing_dates:
    description: >-
      Strip trailing dates, page-number bleed, and junk after closing parens in unit_name.
      Run before unit_name_trailing_gunk.
    columns:
      - unit_name
    repeat: 4
    rules:
      - pattern: '(?<=\))\d{1,2}\s+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\.?\s+\d{2,4}(?:\s+\d{1,2})?\s*$'
        replacement: ''
        description: Date glued directly after closing paren (e.g. Division)29 Oct. 44)
      - pattern: '(?<=\))\s+\d{1,2}\s+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\.?\s+\d{2,4}(?:\s+\d{1,2})?\s*$'
        replacement: ''
        description: Spaced date after closing paren (e.g. (Self-Propelled) 17 Jul 44)
      - pattern: '\s*[\.,;:\*•]+\s*\d{1,2}\s+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\.?\s+\d{2,4}(?:\s+\d{1,2})?\s*$'
        replacement: ''
        description: OCR punctuation run before trailing date (e.g. ..;;30 Mar 45   31)
      - pattern: '\s+\d{1,2}\s+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\.?\s+\d{2,4}(?:\s+\d{1,2})?\s*$'
        replacement: ''
        description: Trailing standalone date (e.g. Group 17 Jul 44)
      - pattern: '(?<=\))\s+\d{1,2}\s*$'
        replacement: ''
        description: Page-number bleed after closing paren (e.g. Squadron) 12)
      - pattern: '(?<=\))[\s,;:\.•\*''"<>/0-9=-]+$'
        replacement: ''
        description: Junk punctuation or digits after closing paren (e.g. Division) ; ; ,7)
      - pattern: '\s+$'
        replacement: ''
        description: Trailing whitespace

  unit_name_date_bleed_extended:
    description: >-
      Strip glued corps/div dates and OCR date tails missed by unit_name_trailing_dates.
      Run after unit_name_trailing_dates and before unit_name_trailing_gunk.
    columns:
      - unit_name
    repeat: 4
    rules:
      - pattern: '(Division),(?:\s*)?\d{1,2}\s+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\.?\s+\d{2,4}\s*~?\s*$'
        replacement: '\1'
        description: Comma-glued date after Division (e.g. Division,6 Apr 45 ~)
      - pattern: '\s*((?:Corps|DiV|Div|Liv|Piv|CT))\d{1,2}\s+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\.?\s+\d{2,4}\s*~?\s*$'
        replacement: ' \1'
        description: Glued corps/div date tail (e.g. Corps26 Mar 45)
      - pattern: '(?<![0-9])(?:Div|DiV|Liv|Piv)\d{1,2}\s+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\.?\s+\d{2,4}\s*~?\s*$'
        replacement: ''
        description: Glued Div/Liv date without space (e.g. Div13 Apr 45)
      - pattern: '(?<=[a-zA-Z])(?=\d{1,2}\s+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\.?\s+\d{2,4}\s*$)'
        replacement: ' '
        description: Space before glued trailing date (e.g. ,T3 Apr 45)
      - pattern: '\s+\d{1,2}\s+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\.?\s+\d{2,4}\s+[\d''?£\s~^•\*-]{0,12}(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\.?\s+\d{2,4}\s*[~^''"]*\s*$'
        replacement: ''
        description: Trailing OCR date range (e.g. 17 Sep 44   2? Nov 44)
      - pattern: '\s*[,;]{2,}\s*\d{1,2}\s+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\.?\s+\d{2,4}\s*$'
        replacement: ''
        description: Semicolon/comma run before trailing date
      - pattern: '\s*[\.,;:]+[A-Za-z]?\d{1,2}\s+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\.?\s+\d{2,4}\s*$'
        replacement: ''
        description: Punctuation before glued date (e.g. ..,T3 Apr 45)
      - pattern: '\s+\d{1,2}\s+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\.?\s+\d{2,4}.*$'
        replacement: ''
        description: Trailing date with OCR junk tail (e.g. 11 Sep 44   1 4 ' S e p 44)

  unit_name_spaced_ocr:
    description: Collapse OCR-spaced letter runs in unit_name (D i v, H o w, S q, etc.).
    columns:
