# Equipment Alias Table
# Maps common nicknames / abbreviations / cross-system designations to a canonical
# technical name. Used by the disambiguator (checked FIRST, authoritative) + dedup.
#
# Organized by NATIONALITY so additional theaters drop in as whole sections. Current
# corpus is ETO (US / German / British). Japanese / Italian / Soviet sections are
# placeholders to be populated when those theaters are ingested.
#
# Lookups are normalized (lowercase, punctuation/spacing stripped, Pz.Kpfw.<->Panzer,
# roman<->arabic), so ONE entry matches surface variants ("Pz.Kpfw. IV" == "Panzer IV"
# == "PzKpfw IV"). Keys here may be written in natural form; they are normalized on load.

