# Search query templates for people enrichment (OpenSERP)
# Variables: {name}, {facts}
# {facts} = the person's own context (primary unit + rank + nationality) injected to
# disambiguate — e.g. "Robert Smith 90th Infantry Division Captain American" instead of a
# bare name. Empty {facts} collapses cleanly (double spaces are squeezed by the caller).

portrait_images:
  - '{name} {facts} WWII portrait photo'
  - '{name} {facts} World War II officer photo'

academic_sources:
  - '{name} {facts} oral history WWII'
  - '{name} {facts} university archive World War II'
  - '{name} documentary interview WWII'

web_results:
  - '{name} {facts} WWII biography'
  - '{name} {facts} World War II military service'
